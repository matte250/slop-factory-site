<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gravity Well</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #05050c; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Gravity Well</h1>
    <p class="game-description">Tap to create a brief gravity well that pulls nearby obstacles into a single clump, clearing a corridor for the dot to pass.</p>
    <ul class="game-controls">
      <li>Tap / click to create gravity well</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG ===========================================================
    const W = 800, H = 600;
    const PLAYER_RADIUS = 6;
const HAZARD_RADIUS = 12;
const HAZARD_SPEED_RANGE = [80, 150];
const SAFE_RADIUS = 140;
const HAZARD_SPAWN_INTERVAL_MIN = 1;
const HAZARD_SPAWN_INTERVAL_MAX = 3;

// Gravity well constants
const WELL_RADIUS = 80;
const WELL_DURATION = 0.3; // seconds
const WELL_FORCE = 200; // acceleration (px/sec^2)

    // === STATE ===========================================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const restartBtn = document.getElementById('restart');
    let loopId = null;
    let audioCtx = null;
    let keys;
    let lastTime;
    let player;
    let score;
    let phase; // "playing" | "gameover"
    let hazards;
    let hazardSpawnTimer;
    let well;

    // === RESET ===========================================================
    function reset() {
  player = { x: W/2, y: H/2, radius: PLAYER_RADIUS };
  score = 0;
  phase = 'playing';
  keys = new Set();
  hazards = [];
  hazardSpawnTimer = 0;
  well = null;
  lastTime = performance.now();
  publishState();
  startLoop();
}


    // === LOOP ===========================================================
    function startLoop() {
      // Clear canvas each frame to reset background
      ctx.fillStyle = '#05050c';
      ctx.fillRect(0, 0, W, H);

      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          update(dt);
          render();
          publishState();
        } catch (e) {
          console.error('loop error', e);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    function update(dt) {
      // No dynamics for task 1 – placeholder.
      // Respond to restart key.
      if (keys.has('r') || keys.has('R')) {
        reset();
        return;
      }
    }

    function render() {
      // Clear canvas
      ctx.fillStyle = '#05050c';
      ctx.fillRect(0, 0, W, H);

      // Draw player (dot)
      ctx.fillStyle = '#7df9ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // HUD – score
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '16px ui-sans-serif, system-ui';
      ctx.textAlign = 'left';
      ctx.fillText('Score ' + score, 12, 22);
    }

    // === INPUT ===========================================================
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
      keys.add(ev.key);
    });
    document.addEventListener('keyup', (ev) => { keys.delete(ev.key); });
    restartBtn.addEventListener('click', reset);

    // === AUDIO (lazy) ====================================================
    function beep(freq, durSec) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + durSec);
      } catch {}
    }

    // === OBSERVABLE CONTRACT =============================================
    function publishState() {
      window.__game = {
        state: phase,
        score: score,
        player: {
          x: player.x,
          y: player.y,
          visible: player.x >= 0 && player.x < W && player.y >= 0 && player.y < H,
        },
        objective: 'Tap to create gravity wells that pull obstacles into a clump and clear a path for the dot.'
      };
    }

    // === BOOT ===========================================================
    reset();
  </script>
</body>
</html>
