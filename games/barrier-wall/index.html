<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Barrier Wall</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #05050c; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Barrier Wall</h1>
    <p class="game-description">Tap to create a brief wall at the dot’s current position that blocks incoming obstacles; the wall vanishes after a short time, so you must time its placement to carve safe corridors through dense sections.</p>
    <ul class="game-controls">
      <li>Tap / click to place a wall</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
  // === CONFIG =============================================================
  const W = 800, H = 600;
  const PLAYER_RADIUS = 10;

// === CONSTANTS =====================================================
const WALL_DURATION = 0.3; // seconds wall exists
const WALL_COOLDOWN = 0.5; // seconds between wall placements
const OBSTACLE_SPEED = 200; // px per second
const OBSTACLE_RADIUS = 8;
const SPAWN_INTERVAL = 1.0; // seconds between spawns

  // === STATE ==============================================================
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const restartBtn = document.getElementById("restart");

  let player;      // { x, y, alive }
  let score;
  let highScore = 0;
  let phase;       // "menu" | "playing" | "gameover"
  let keys;
  let lastTime;
  let loopId = null;
  let audioCtx = null;

  // === RESET ===============================================================
  function reset() {
    player = { x: W/2, y: H/2, alive: true };
    score = 0;
    phase = "playing";
    keys = new Set();
    lastTime = performance.now();
    publishState();
    startLoop();
  }

  // === LOOP / UPDATE =======================================================
  function startLoop() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    function tick(now) {
      try {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        // Canvas clearing
        ctx.clearRect(0, 0, W, H);
        update(dt);
        render();
        publishState();
      } catch (err) {
        console.error("loop error", err);
      }
      loopId = requestAnimationFrame(tick);
    }
    loopId = requestAnimationFrame(tick);
  }

  function update(dt) {
    if (phase !== "playing") return;
    // Placeholder: no game logic yet.
  }

  // === RENDER ==============================================================
  function render() {
    ctx.fillStyle = "#05050c";
    ctx.fillRect(0, 0, W, H);
    // Draw player as a simple circle
    if (player && player.alive) {
      ctx.fillStyle = "#7df9ff";
      ctx.beginPath();
      ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    }
    // HUD
    ctx.fillStyle = "#e6e6f0";
    ctx.font = "16px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText(`Score ${score}`, 12, 22);
    ctx.textAlign = "right";
    ctx.fillText(`Best ${highScore}`, W - 12, 22);
  }

  // === INPUT ===============================================================
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "r" || ev.key === "R") { reset(); return; }
    keys.add(ev.key);
  });
  document.addEventListener("keyup", (ev) => { keys.delete(ev.key); });
  restartBtn.addEventListener("click", reset);

  // === AUDIO (lazy) ========================================================
  function beep(freq, durSec) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durSec);
    } catch (e) { }
  }

  // === OBSERVABLE CONTRACT ================================================
  function publishState() {
    window.__game = {
      state: phase,
      score: score,
      player: {
        x: player ? player.x : 0,
        y: player ? player.y : 0,
        visible: !!player && player.x >= 0 && player.x < W && player.y >= 0 && player.y < H,
      },
      objective: "Tap to place walls that block obstacles and create safe passages.",
    };
  }

  // === BOOT ===============================================================
  reset();
  </script>
</body>
</html>
