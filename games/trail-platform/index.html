<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trail Platform</title>
  <style>
    body { margin:0; background:#0a0a0f; color:#e6e6f0; font-family:ui-sans-serif,system-ui,sans-serif; }
    .game-header { padding:12px 16px; border-bottom:1px solid #1d1d2a; }
    .game-header h1 { margin:0; font-size:18px; color:#7df9ff; }
    .game-header .game-description { margin:4px 0; color:#a5a5b8; }
    .game-header .game-controls { margin:4px 0; padding-left:18px; color:#c8c8d8; }
    main { display:flex; flex-direction:column; align-items:center; padding:16px; }
    canvas { background:#05050c; border:1px solid #2a2f44; }
    .game-restart { margin-top:10px; padding:8px 14px; background:#1c2030; color:#7df9ff; border:1px solid #2a2f44; cursor:pointer; }
    .game-restart:hover { background:#232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Trail Platform</h1>
    <p class="game-description">A glowing dot auto‑advances, leaving a trail that solidifies into temporary platforms, letting you build bridges across gaps.</p>
    <ul class="game-controls">
      <li>Arrow keys to steer</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const W = 800, H = 600;
    const PLAYER_RADIUS = 8;
    const PLAYER_SPEED = 120; // px/sec
    const PLAYER_TURN_SPEED = Math.PI * 2; // rad/sec (unused)

    // === STATE ==============================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restart");

    let player; // {x, y}
    let keys;
    let lastTime;
    let loopId = null;
    let audioCtx = null;
    let score = 0;
    let scoreTimer = 0;
    let state = "menu"; // "menu" | "playing" | "gameover"

    // === RESET ==============================================================
    function reset() {
      player = { x: 0, y: H / 2 };
      keys = new Set();
      lastTime = performance.now();
      score = 0;
      state = "playing";
      publishState();
      startLoop();
    }

    // === LOOP / UPDATE ======================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          update(dt);
          render();
          publishState();
        } catch (err) {
          console.error("loop error", err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    function update(dt) {
      if (state !== "playing") return;
      // Move forward horizontally.
      player.x += PLAYER_SPEED * dt;

      // Steering: Up/Down arrows move vertically.
      if (keys.has("ArrowUp") || keys.has("w") || keys.has("W")) {
        player.y -= PLAYER_SPEED * dt;
      }
      if (keys.has("ArrowDown") || keys.has("s") || keys.has("S")) {
        player.y += PLAYER_SPEED * dt;
      }

      // Wrap horizontally.
      if (player.x > W) player.x = 0;

      // Clamp vertical position.
      if (player.y < 0) player.y = 0;
      if (player.y > H) player.y = H;
    }

    // === RENDER =============================================================
    function render() {
      // Background.
      ctx.fillStyle = "#05050c";
      ctx.fillRect(0, 0, W, H);

      // Player dot.
      ctx.fillStyle = "#7df9ff";
      ctx.beginPath();
      ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
      ctx.fill();

      // Score.
      ctx.fillStyle = "#e6e6f0";
      ctx.font = "16px ui-sans-serif, system-ui";
      ctx.textAlign = "left";
      ctx.fillText(`Score ${score}`, 12, 22);
    }

    // === INPUT ==============================================================
    document.addEventListener("keydown", ev => {
      if (ev.key === "r" || ev.key === "R") { reset(); return; }
      keys.add(ev.key);
    });
    document.addEventListener("keyup", ev => { keys.delete(ev.key); });
    restartBtn.addEventListener("click", reset);

    // === AUDIO ==============================================================
    function beep(freq, durSec) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durSec);
      } catch (e) {}
    }

    // === OBSERVABLE CONTRACT ================================================
    function publishState() {
      window.__game = {
        state,
        score,
        player: {
          x: player.x,
          y: player.y,
          visible: player.x >= 0 && player.x < W && player.y >= 0 && player.y < H,
        },
        objective: "Guide the dot, letting its trail solidify into platforms to cross gaps.",
      };
    }

    // === BOOT ===============================================================
    reset();
  </script>
</body>
</html>
