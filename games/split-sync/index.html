<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Split Sync</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #05050c; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Split Sync</h1>
    <p class="game-description">A dot auto‑advances and taps split it into two synchronized smaller dots that dodge obstacles in parallel lanes; a second tap fuses them back, rewarding precise timing.</p>
    <ul class="game-controls">
      <li>Tap to split/fuse</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const W = 800, H = 600;
    const PLAYER_RADIUS = 12;
    const PLAYER_SPEED = 120; // px/sec auto-advance
    const SPLIT_OFFSET = 8; // horizontal offset when split
    const SPLIT_BONUS = 10;

    // === STATE ==============================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restart");

    let player = { x: W/2, y: H/2, radius: PLAYER_RADIUS, split: false };
    let score = 0;
    let phase = "playing"; // "playing" | "gameover"
    let keys = new Set();
    let lastTime = performance.now();
    let loopId = null;
    // Ensure observable contract is initialized early
    publishState();

    // === RESET ==============================================================
    function reset() {
      player = { x: W/2, y: H/2, radius: PLAYER_RADIUS, split: false };
      score = 0;
      phase = "playing";
      keys.clear();
      lastTime = performance.now();
      publishState();
      startLoop();
    }

    // === LOOP ==============================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          update(dt);
          render();
          publishState();
        } catch (err) {
          console.error("loop error", err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    // === UPDATE ==============================================================
    function update(dt) {
      if (phase !== "playing") return;

      // Auto-advance player forward (downwards)
      player.y += PLAYER_SPEED * dt;
      // Keep within canvas bounds (wrap)
      if (player.y > H) player.y -= H;
    }

    // === RENDER ==============================================================
    function render() {
      // Clear canvas
      ctx.fillStyle = "#05050c";
      ctx.fillRect(0, 0, W, H);

      // Draw player or split dots
      ctx.fillStyle = "#7df9ff";
      if (!player.split) {
        ctx.beginPath();
        ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
        ctx.fill();
      } else {
        const r = PLAYER_RADIUS * 0.6;
        ctx.beginPath();
        ctx.arc(player.x - SPLIT_OFFSET, player.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(player.x + SPLIT_OFFSET, player.y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw score
      ctx.fillStyle = "#e6e6f0";
      ctx.font = "16px ui-sans-serif, system-ui";
      ctx.textAlign = "left";
      ctx.fillText(`Score ${score}`, 12, 22);
    }

    // === INPUT ==============================================================
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "r" || ev.key === "R") { reset(); return; }
      keys.add(ev.key);
    });
    document.addEventListener("keyup", (ev) => { keys.delete(ev.key); });
    canvas.addEventListener("pointerdown", () => {
      if (phase !== "playing") return;
      if (!player.split) {
        player.split = true;
      } else {
        player.split = false;
        score += SPLIT_BONUS;
      }
    });
    restartBtn.addEventListener("click", reset);

    // === AUDIO (lazy) ========================================================
    // placeholder for future audio implementation

    // === OBSERVABLE CONTRACT ================================================
    function publishState() {
      window.__game = {
        state: phase,
        score,
        player: {
          x: player.x,
          y: player.y,
          visible: player.x >= 0 && player.x < W && player.y >= 0 && player.y < H,
        },
        objective: "Tap to split the dot, then tap again to fuse it for a score bonus while dodging obstacles.",
      };
    }

    // === HELPERS ===========================================================
    function wrap(v, max) {
      if (v < 0) return v + max;
      if (v >= max) return v - max;
      return v;
    }

    // === BOOT ==============================================================
    reset();
  </script>
</body>
</html>
