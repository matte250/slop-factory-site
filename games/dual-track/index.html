<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dual Track</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; image-rendering: pixelated; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Dual Track</h1>
    <p class="game-description">The dot auto‑advances through two parallel tunnels; tap to instantly switch the dot between the upper and lower track, timing each jump to avoid lane‑specific obstacles.</p>
    <ul class="game-controls">
      <li>Tap / click to switch tracks</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restart");

    // === STATE ==============================================================
    let player = { x: 0, y: 0 };
    let hazards = [];
    let score = 0;
    let phase = "playing";
    let lastTime = performance.now();
    let loopId = null;
    let keys = new Set();

    // Reset function
    function reset() {
      player.x = canvas.width * 0.2;
      player.y = canvas.height / 2;
      hazards = [];
      score = 0;
      phase = "playing";
      lastTime = performance.now();
      publishState();
      startLoop();
    }

    // Input handling
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "r" || ev.key === "R") { reset(); return; }
      keys.add(ev.key);
    });
    document.addEventListener("keyup", (ev) => {
      keys.delete(ev.key);
    });
    restartBtn.addEventListener("click", reset);

    // Update function
    function update(dt) {
      if (phase !== "playing") return;
      // Move player forward
      player.x += 100 * dt;
      if (player.x > canvas.width) {
        player.x = 0;
      }
      // Simple discrete scoring based on distance
      score = Math.floor(player.x / 10);
    }

    // Render function
    function render() {
      // Background
      ctx.fillStyle = "#0f1320";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // Player
      ctx.fillStyle = "#7df9ff";
      ctx.beginPath();
      ctx.arc(player.x, player.y, 8, 0, Math.PI * 2);
      ctx.fill();
      // HUD score
      ctx.fillStyle = "#e6e6f0";
      ctx.font = "16px ui-sans-serif, system-ui";
      ctx.textAlign = "left";
      ctx.fillText(`Score ${score}`, 12, 22);
    }

    // === LOOP ==============================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = (now - lastTime) / 1000;
          lastTime = now;
          // Update game logic
          update(dt);
          // Render frame
          render();
          // Publish observable state each frame
          publishState();
        } catch (err) {
          console.error("loop error", err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }
    // === OBSERVABLE CONTRACT ===============================================
    function publishState() {
      // Determine visibility of player within canvas bounds
      const visible = player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height;
      window.__game = {
        state: phase, // "playing" | "gameover" | "menu"
        score: score,
        player: {
          x: player.x,
          y: player.y,
          visible: visible,
        },
        objective: "Switch tracks to avoid obstacles and survive as long as possible."
      };
    }
    // Initialize observable state
    publishState();
    // === BOOT ==============================================================
    // Start the game on page load
    reset();
  </script>
</body>
</html>
