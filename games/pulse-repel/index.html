<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pulse Repel</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; image-rendering: pixelated; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Pulse Repel</h1>
    <p class="game-description">The dot moves forward automatically; tap to emit a radial pulse that temporarily pushes nearby obstacles outward, clearing a path before the pulse fades.</p>
    <ul class="game-controls">
      <li>Tap / click to emit pulse</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
  // === CONFIG =============================================================
  const CANVAS_W = 800;
  const CANVAS_H = 600;
  const PLAYER_SPEED = 200; // px/s forward (to the right)
  const PLAYER_RADIUS = 12;
  const OBSTACLE_RADIUS = 20;
  const OBSTACLE_SPEED = 200; // leftward speed relative to world (px/s)
  const SPAWN_INTERVAL = 1.5; // seconds
  const PULSE_DURATION = 0.5; // seconds
  const PULSE_RADIUS = 120; // effect radius
  const PUSH_SPEED = 150; // px/s outward during pulse

  // === STATE ==============================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const restartBtn = document.getElementById('restart');

  const player = { x: 100, y: 300, vx: PLAYER_SPEED, radius: PLAYER_RADIUS, pulseActive: false, pulseTimer: 0 };
  const obstacles = []; // each { x, y }
  let score = 0;
  let highScore = 0;
  let spawnTimer = 0;
  let lastTime = performance.now();
  let loopId = null;
  let audioCtx = null;
  let phase = 'playing'; // 'playing' | 'gameover'

  // === RESET ==============================================================
  function reset() {
    player.x = 100; player.y = 300; player.pulseActive = false; player.pulseTimer = 0;
    obstacles.length = 0;
    score = 0;
    spawnTimer = 0;
    phase = 'playing';
    publishState();
    startLoop();
  }

  // === LOOP ===============================================================
  function startLoop() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    function tick(now) {
      try {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        update(dt);
        render();
        publishState();
      } catch (e) {
        console.error('loop error', e);
      }
      loopId = requestAnimationFrame(tick);
    }
    loopId = requestAnimationFrame(tick);
  }

  // === UPDATE =============================================================
  function update(dt) {
    if (phase !== 'playing') return;

    // player moves forward automatically
    player.x += player.vx * dt;

    // pulse timer
    if (player.pulseActive) {
      player.pulseTimer -= dt;
      if (player.pulseTimer <= 0) {
        player.pulseActive = false;
        player.pulseTimer = 0;
      }
    }

    // spawn obstacles
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnObstacle();
      spawnTimer = SPAWN_INTERVAL;
    }

    // update obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      // base leftward motion
      let vx = -OBSTACLE_SPEED;
      let vy = 0;
      // pulse push
      if (player.pulseActive) {
        const dx = o.x - player.x;
        const dy = o.y - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist <= PULSE_RADIUS && dist > 0) {
          const pushX = (dx / dist) * PUSH_SPEED;
          const pushY = (dy / dist) * PUSH_SPEED;
          vx += pushX;
          vy += pushY;
        }
      }
      o.x += vx * dt;
      o.y += vy * dt;

      // collision check (only when pulse not active)
      if (!player.pulseActive) {
        const d = Math.hypot(o.x - player.x, o.y - player.y);
        if (d <= player.radius + OBSTACLE_RADIUS) {
          gameOver();
          return;
        }
      }

      // scoring: passed player
      if (o.x + OBSTACLE_RADIUS < player.x) {
        score++;
        obstacles.splice(i, 1);
      }
    }
  }

  function spawnObstacle() {
    // y between 50 and 550 to stay fully visible
    const y = 50 + Math.random() * (CANVAS_H - 100);
    // ensure safe spawn: not within SAFE_RADIUS of player at current time
    // Since player is always to the left, a simple check suffices.
    const safe = Math.abs(100 - (player.x)) > 200 ? true : false;
    // We always spawn at x just outside right edge.
    obstacles.push({ x: CANVAS_W + OBSTACLE_RADIUS, y });
  }

  function gameOver() {
    phase = 'gameover';
    if (score > highScore) highScore = score;
    beep(200, 0.2);
  }

  // === RENDER =============================================================
  function render() {
    // clear background
    ctx.fillStyle = '#0f1320';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // draw player
    ctx.fillStyle = '#ff00aa';
    ctx.beginPath();
    ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    // draw pulse (fading visual)
    if (player.pulseActive) {
      const alpha = player.pulseTimer / PULSE_DURATION;
      ctx.strokeStyle = `rgba(255,255,0,${alpha.toFixed(2)})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(player.x, player.y, PULSE_RADIUS, 0, Math.PI * 2);
      ctx.stroke();
    }

    // draw obstacles
    ctx.fillStyle = '#7df9ff';
    obstacles.forEach(o => {
      ctx.beginPath();
      ctx.arc(o.x, o.y, OBSTACLE_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    });

    // HUD
    ctx.fillStyle = '#e6e6f0';
    ctx.font = '16px ui-sans-serif, system-ui';
    ctx.textAlign = 'left';
    ctx.fillText(`Score ${score}`, 12, 22);
    ctx.textAlign = 'right';
    ctx.fillText(`Best ${highScore}`, CANVAS_W - 12, 22);

    // Game over overlay
    if (phase === 'gameover') {
      ctx.fillStyle = 'rgba(10,10,15,0.7)';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = '#ff00aa';
      ctx.textAlign = 'center';
      ctx.font = '44px ui-sans-serif, system-ui';
      ctx.fillText('Game Over', CANVAS_W / 2, CANVAS_H / 2 - 20);
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '20px ui-sans-serif, system-ui';
      ctx.fillText(`Final score ${score}` + (score === highScore && score > 0 ? ' — new best!' : ''), CANVAS_W / 2, CANVAS_H / 2 + 16);
      ctx.fillStyle = '#a5a5b8';
      ctx.font = '16px ui-sans-serif, system-ui';
      ctx.fillText('Press R or click Restart', CANVAS_W / 2, CANVAS_H / 2 + 44);
    }
  }

  // === INPUT ==============================================================
  const keys = new Set();
  document.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') { reset(); return; }
    keys.add(e.key);
  });
  document.addEventListener('keyup', (e) => keys.delete(e.key));

  // mouse / touch for pulse
  function activatePulse() {
    if (phase !== 'playing') return;
    player.pulseActive = true;
    player.pulseTimer = PULSE_DURATION;
    beep(440, 0.08);
  }
  canvas.addEventListener('click', activatePulse);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); activatePulse(); });

  restartBtn.addEventListener('click', reset);

  // === AUDIO (lazy) =======================================================
  function beep(freq, durSec) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + durSec);
    } catch {}
  }

  // === OBSERVABLE CONTRACT ===============================================
  function publishState() {
    const visible = player.x >= 0 && player.x <= CANVAS_W && player.y >= 0 && player.y <= CANVAS_H;
    window.__game = {
      state: phase,
      score,
      player: {
        x: player.x,
        y: player.y,
        visible,
      },
      objective: 'Emit a pulse to push obstacles away and survive as long as possible.',
    };
  }

  // === BOOT ===============================================================
  reset();
  </script>
</body>
</html>
