<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Obstacle Shrink</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Obstacle Shrink</h1>
    <p class="game-description">The dot auto‑advances through a tunnel of obstacles; each tap temporarily reduces the size of all obstacles, creating larger gaps that quickly restore, demanding precise timing.</p>
    <ul class="game-controls">
      <li>Tap or press to shrink obstacles</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const SAFE_RADIUS = 200; // px safe radius at start
    const SHRINK_DURATION = 0.5; // seconds shrink effect lasts
    const SHRINK_FACTOR = 0.5; // multiplicative factor to shrink obstacles
    const PLAYER_SPEED = 300; // px/sec forward movement

    // === STATE ==============================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restart");

    let player = { x: canvas.width / 2, y: canvas.height / 2, radius: 6 };
    let hazards = []; // will hold obstacle objects
    let score = 0;
    let phase = "menu"; // "menu" | "playing" | "gameover"
    let keys = new Set();
    let lastTime = performance.now();
    let loopId = null;
    let audioCtx = null;
    let shrinkTimer = 0; // seconds remaining for shrink effect
    let shrinkActive = false; // true when shrink effect triggered

    // === RESET =============================================================
    function reset() {
      if (loopId !== null) {
        cancelAnimationFrame(loopId);
        loopId = null;
      }
      player = { x: canvas.width / 2, y: canvas.height / 2, radius: 6 };
      hazards = [];
      score = 0;
      phase = "playing";
      keys = new Set();
      lastTime = performance.now();
      startLoop();
    }

    // === LOOP =============================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          if (typeof update === "function") update(dt);
          if (typeof render === "function") render();
          if (typeof publishState === "function") publishState();
        } catch (err) {
          console.error("loop error", err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    // === UPDATE =============================================================
    function update(dt) {
      // placeholder for game logic
    }

    // === RENDER =============================================================
    function render() {
      // Background
      ctx.fillStyle = "#0f1320";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Hazards (obstacles)
      const shrinkFactor = (shrinkTimer > 0) ? SHRINK_FACTOR : 1;
      for (const h of hazards) {
        if (!h) continue;
        const color = h.color || "#7df9ff";
        ctx.fillStyle = color;
        if (h.radius !== undefined) {
          const r = h.radius * shrinkFactor;
          ctx.beginPath();
          ctx.arc(h.x, h.y, r, 0, Math.PI * 2);
          ctx.fill();
        } else if (h.w !== undefined && h.h !== undefined) {
          const w = h.w * shrinkFactor;
          const hh = h.h * shrinkFactor;
          // Keep obstacle centered by adjusting position
          const x = h.x - (w - h.w) / 2;
          const y = h.y - (hh - h.h) / 2;
          ctx.fillRect(x, y, w, hh);
        }
      }

      // Player (high‑contrast)
      ctx.fillStyle = "#ff00aa";
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // HUD – score
      ctx.fillStyle = "#e6e6f0";
      ctx.font = "16px ui-sans-serif, system-ui";
      ctx.textAlign = "left";
      ctx.fillText(`Score ${score}`, 12, 22);

      // Game‑over overlay
      if (phase === "gameover") {
        ctx.fillStyle = "rgba(10,10,15,0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff52ae";
        ctx.textAlign = "center";
        ctx.font = "44px ui-sans-serif, system-ui";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = "#e6e6f0";
        ctx.font = "20px ui-sans-serif, system-ui";
        ctx.fillText(`Final score ${score}`, canvas.width / 2, canvas.height / 2 + 14);
        ctx.fillStyle = "#a5a5b8";
        ctx.font = "16px ui-sans-serif, system-ui";
        ctx.fillText("Press R or click Restart", canvas.width / 2, canvas.height / 2 + 42);
      }
    }

    // === OBSERVABLE CONTRACT ====================================================
function publishState() {
  window.__game = {
    state: phase,
    score: score,
    player: {
      x: player.x,
      y: player.y,
      visible: player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height,
    },
    objective: "Navigate the auto‑advancing dot through the tunnel, tapping to shrink obstacles and survive.",
  };
}

// === INPUT ==============================================================
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "r" || ev.key === "R") { reset(); return; }
      keys.add(ev.key);
    });
    document.addEventListener("keyup", (ev) => {
      keys.delete(ev.key);
    });
    restartBtn.addEventListener("click", reset);

    // === BOOT ===============================================================
    reset();
  </script>
</body>
</html>
