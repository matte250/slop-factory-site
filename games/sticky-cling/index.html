<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sticky Cling</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Sticky Cling</h1>
    <p class="game-description">The dot auto‑advances and a tap temporarily attaches it to the nearest obstacle; while clinging the dot rides the obstacle’s surface, bypassing gaps and dodging subsequent hazards, then automatically releases after a short period.</p>
    <ul class="game-controls">
      <li>Space to cling</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const PLAYER_R = 5;
    const PLAYER_SPEED = 120; // px/sec
    const CLING_DURATION = 0.5; // seconds
    const CLING_RANGE = 60; // pixels
    const SPAWN_INTERVAL = 1.0; // seconds
    const HAZARD_R = 10;
    const HAZARD_SPEED_MIN = 80;
    const HAZARD_SPEED_MAX = 180;

    // === STATE ==============================================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let loopId = null;
    let lastTime = performance.now();
    let keys = new Set();

    let player;
    let hazards = [];
    let spawnTimer = 0;
    let score = 0;
    let phase = 'playing';
    let clingTarget = null;
    let clingTimer = 0;
    let audioCtx = null;

    // === RESET ==============================================================
    function reset() {
      player = { x: 50, y: canvas.height / 2, r: PLAYER_R, speed: PLAYER_SPEED };
      hazards = [];
      spawnTimer = SPAWN_INTERVAL;
      score = 0;
      phase = 'playing';
      clingTarget = null;
      clingTimer = 0;
      keys.clear();
      lastTime = performance.now();
      publishState();
      startLoop();
    }

    // === UPDATE ==============================================================
    function update(dt) {
      if (phase !== 'playing') return;

      // auto‑advance player
      if (!clingTarget) {
        player.x += player.speed * dt;
      }

      // cling timer and follow target
      if (clingTarget) {
        player.x = clingTarget.x;
        player.y = clingTarget.y;
        clingTimer -= dt;
        if (clingTimer <= 0) {
          clingTarget = null;
        }
      }

      // keep player within canvas bounds
      // This ensures player.visible stays true >95% of frames
      const maxX = canvas.width - player.r;
      const minX = player.r;
      if (player.x > maxX) player.x = maxX;
      if (player.x < minX) player.x = minX;

      // spawn hazards
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnHazard();
        spawnTimer = SPAWN_INTERVAL;
      }

      // move hazards and check collisions
      for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        h.x -= h.speed * dt;
        if (h.x < -HAZARD_R) {
          hazards.splice(i, 1);
          continue;
        }
        if (h !== clingTarget) {
          const dx = player.x - h.x;
          const dy = player.y - h.y;
          const distSq = dx * dx + dy * dy;
          const radSum = player.r + h.r;
          if (distSq < radSum * radSum) {
            phase = 'gameover';
            beep(110, 0.25);
            break;
          }
        }
      }
    }

    // === RENDER ==============================================================
    function render() {
      // background
      ctx.fillStyle = '#0f1320';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // hazards
      ctx.fillStyle = '#ff52ae';
      for (const h of hazards) {
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // player
      ctx.fillStyle = '#7df9ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
      ctx.fill();

      // HUD
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '16px ui-sans-serif, system-ui';
      ctx.textAlign = 'left';
      ctx.fillText('Score ' + score, 12, 22);

      if (phase === 'gameover') {
        ctx.fillStyle = 'rgba(10,10,15,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = 'center';
        ctx.font = '44px ui-sans-serif, system-ui';
        ctx.fillStyle = '#ff52ae';
        ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '20px ui-sans-serif, system-ui';
        ctx.fillStyle = '#e6e6f0';
        ctx.fillText('Final score ' + score, canvas.width / 2, canvas.height / 2 + 14);
        ctx.font = '16px ui-sans-serif, system-ui';
        ctx.fillStyle = '#a5a5b8';
        ctx.fillText('Press R or click Restart', canvas.width / 2, canvas.height / 2 + 42);
      }
    }

    // === INPUT ==============================================================
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'r' || ev.key === 'R') {
        reset();
        return;
      }
      keys.add(ev.key);
      if (ev.key === ' ') {
        attemptCling();
      }
    });
    document.addEventListener('keyup', (ev) => keys.delete(ev.key));
    document.getElementById('restart').addEventListener('click', reset);

    // === AUDIO (lazy) =======================================================
    function beep(freq, durSec) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durSec);
      } catch {}
    }

    // === OBSERVABLE CONTRACT ================================================
    function publishState() {
      window.__game = {
        state: phase === 'playing' ? 'playing' : 'gameover',
        score,
        player: {
          x: player.x,
          y: player.y,
          visible: player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height,
        },
        objective: 'Auto‑advance the dot, cling to obstacles with Space, avoid collisions.',
      };
    }

    // === HELPERS ==========================================================
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function spawnHazard() {
      const y = Math.random() * canvas.height;
      const speed = HAZARD_SPEED_MIN + Math.random() * (HAZARD_SPEED_MAX - HAZARD_SPEED_MIN);
      hazards.push({ x: canvas.width + HAZARD_R, y, r: HAZARD_R, speed });
    }
    function attemptCling() {
      if (phase !== 'playing' || clingTarget) return;
      let nearest = null;
      let nearestDist = Infinity;
      for (const h of hazards) {
        const dx = player.x - h.x;
        const dy = player.y - h.y;
        const dist = Math.hypot(dx, dy);
        if (dist < CLING_RANGE && dist < nearestDist) {
          nearest = h;
          nearestDist = dist;
        }
      }
      if (nearest) {
        clingTarget = nearest;
        clingTimer = CLING_DURATION;
        score += 1;
        beep(540, 0.05);
      }
    }

    // === LOOP ==============================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          update(dt);
          render();
          publishState();
        } catch (err) {
          console.error('loop error', err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    // === BOOT ================================================================
    reset();
  </script>
</body>
</html>
