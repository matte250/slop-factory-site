<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Side Drift</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Side Drift</h1>
    <p class="game-description">The dot auto‑advances forward; each tap toggles a lateral drift left or right, causing a short diagonal slide that lets you steer around horizontally placed obstacles.</p>
    <ul class="game-controls">
      <li>Tap or click to toggle drift</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
const PLAYER_R = 8; // radius of the player dot
const PLAYER_SPEED = 200; // forward speed (px/sec)
const DRIFT_SPEED = 180; // lateral drift speed (px/sec)

const HAZARD_HEIGHT = 20; // height of each obstacle block
const HAZARD_SPACING = 150; // vertical distance between hazards (px)
const GAP_WIDTH = 120; // width of the gap in each obstacle
const SAFE_RADIUS = 200; // start safe radius (px)

// === STATE ==============================================================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const restartBtn = document.getElementById("restart");

let player = { x: canvas.width / 2, y: canvas.height - 80, drift: 0 };
let hazards = []; // each hazard: { y, gapX, passed }
let score = 0;
let phase = "playing"; // "playing" | "gameover"
let keys = new Set();
let lastTime = performance.now();
let loopId = null;
let spawnTimer = 0;
let audioCtx = null;
let highScore = 0;

function reset() {
  player.x = canvas.width / 2;
  player.y = canvas.height - 80;
  player.drift = 0;
  hazards = [];
  score = 0;
  phase = "playing";
  keys.clear();
  lastTime = performance.now();
  spawnTimer = 0;
  publishState();
  startLoop();
}

// === LOOP / UPDATE ======================================================
function startLoop() {
  if (loopId !== null) cancelAnimationFrame(loopId);
  function tick(now) {
    try {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      update(dt);
      render();
      publishState();
    } catch (err) {
      console.error("loop error", err);
    }
    loopId = requestAnimationFrame(tick);
  }
  loopId = requestAnimationFrame(tick);
}

function update(dt) {
  if (phase !== "playing") return;

   // Player lateral drift.
   const intendedX = player.x + player.drift * DRIFT_SPEED * dt;
   const clampedX = clamp(intendedX, PLAYER_R, canvas.width - PLAYER_R);
   if (clampedX !== intendedX) beep(220, 0.04);
   player.x = clampedX;

  // Hazards move downward (simulating forward motion).
  for (const h of hazards) {
    h.y += PLAYER_SPEED * dt;
  }

  // Collision and scoring.
  for (const h of hazards) {
    // When the hazard reaches the player's band, check collision.
    if (!h.checked && h.y + HAZARD_HEIGHT >= player.y - PLAYER_R && h.y <= player.y + PLAYER_R) {
      h.checked = true; // mark as checked for this pass
      const gapLeft = h.gapX - GAP_WIDTH / 2;
      const gapRight = h.gapX + GAP_WIDTH / 2;
      if (player.x < gapLeft || player.x > gapRight) {
        // Collision -> game over.
        phase = "gameover";
        if (score > highScore) highScore = score;
        beep(110, 0.3);
        break;
      } else {
        // Passed safely.
        if (!h.passed) {
          score += 1;
          h.passed = true;
          beep(880, 0.03);
        }
      }
    }
  }

  // Remove hazards that are off-screen.
  hazards = hazards.filter(h => h.y <= canvas.height + HAZARD_HEIGHT);

  // Spawn new hazards.
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    // Ensure the gap does not spawn directly over the player if within SAFE_RADIUS.
    let gapX;
    const maxAttempts = 10;
    let attempts = 0;
    do {
      gapX = GAP_WIDTH / 2 + Math.random() * (canvas.width - GAP_WIDTH);
      attempts++;
    } while (attempts < maxAttempts && Math.abs(gapX - player.x) < SAFE_RADIUS && player.y - (spawnTimer * PLAYER_SPEED) < SAFE_RADIUS);
    hazards.push({ y: -HAZARD_HEIGHT, gapX, passed: false, checked: false });
    spawnTimer = HAZARD_SPACING / PLAYER_SPEED;
  }
}

// === RENDER =============================================================
function render() {
  // Clear background.
  ctx.fillStyle = "#0f1320";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw hazards.
  ctx.fillStyle = "#ff52ae"; // left/right block color
  for (const h of hazards) {
    const gapLeft = h.gapX - GAP_WIDTH / 2;
    const gapRight = h.gapX + GAP_WIDTH / 2;
    // Left block.
    ctx.fillRect(0, h.y, gapLeft, HAZARD_HEIGHT);
    // Right block.
    ctx.fillRect(gapRight, h.y, canvas.width - gapRight, HAZARD_HEIGHT);
  }

  // Draw player.
  ctx.fillStyle = "#7df9ff";
  ctx.beginPath();
  ctx.arc(player.x, player.y, PLAYER_R, 0, Math.PI * 2);
  ctx.fill();

  // HUD.
  ctx.fillStyle = "#e6e6f0";
  ctx.font = "16px ui-sans-serif, system-ui";
  ctx.textAlign = "left";
  ctx.fillText(`Score ${score}`, 12, 22);
  ctx.textAlign = "right";
  ctx.fillText(`Best ${highScore}`, canvas.width - 12, 22);

  // Game‑over overlay.
  if (phase === "gameover") {
    ctx.fillStyle = "rgba(10,10,15,0.7)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = "center";
    ctx.font = "44px ui-sans-serif, system-ui";
    ctx.fillStyle = "#ff52ae";
    ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = "20px ui-sans-serif, system-ui";
    ctx.fillStyle = "#e6e6f0";
    ctx.fillText(`Final score ${score}`, canvas.width / 2, canvas.height / 2 + 14);
    ctx.font = "16px ui-sans-serif, system-ui";
    ctx.fillText("Press R or click Restart", canvas.width / 2, canvas.height / 2 + 42);
  }
}

// === INPUT ==============================================================
function toggleDrift() {
  // Flip between left (-1) and right (+1) drift.
  player.drift = player.drift >= 0 ? -1 : 1;
}

document.addEventListener("keydown", (ev) => {
  if (ev.key === "r" || ev.key === "R") { reset(); return; }
  if (ev.key === " " || ev.key === "Spacebar") { toggleDrift(); return; }
  keys.add(ev.key);
});

document.addEventListener("keyup", (ev) => { keys.delete(ev.key); });

canvas.addEventListener("click", () => { toggleDrift(); });
restartBtn.addEventListener("click", reset);

// === AUDIO (lazy) =======================================================
function beep(freq, durSec) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + durSec);
  } catch {}
}

// === OBSERVABLE CONTRACT ===============================================
function publishState() {
  window.__game = {
    state: phase === "playing" ? "playing" : "gameover",
    score,
    player: {
      x: player.x,
      y: player.y,
      visible: player.x >= 0 && player.x <= canvas.width,
    },
    objective: "Tap to toggle left/right drift and steer the dot around obstacles.",
  };
}

// === HELPERS ===========================================================
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

// === BOOT ===============================================================
reset();
  </script>
</body>
</html>
