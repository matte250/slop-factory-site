<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Elastic Launch</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #05050c; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Elastic Launch</h1>
    <p class="game-description">Stretch the dot forward like a spring and release a rapid thrust to clear moving wall gaps. Survive as long as you can.</p>
    <ul class="game-controls">
      <li>Space or click to stretch and launch</li>
      <li>Press R or click Restart to restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
  // === CONFIG =============================================================
  const W = 800, H = 600;
  const PLAYER_R = 15;
  const PLAYER_SCALE_MAX = 2.0;
  const PLAYER_THRUST = 600; // px/s forward during launch
  const PLAYER_THRUST_TIME = 0.08; // seconds
  const WALL_THICK = 40;
  const GAP_H = 80;
  const WALL_SPEED = 200; // px/s leftwards (world moves right)
  const SPAWN_INTERVAL = 1.5; // seconds
  const MAX_LIVES = 3;

  // === STATE ==============================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const restartBtn = document.getElementById('restart');

  let player;      // {x,y,vx,vy,scale,launchPending,launchTimer,alive,lives}
  let hazards = []; // each {x,gapY}
  let score = 0;
  let highScore = 0;
  let spawnTimer = 0;
  let keys = new Set();
  let lastTime = performance.now();
  let loopId = null;
  let audioCtx = null;

  // === RESET ==============================================================
  function reset() {
    player = { x: W/2, y: H/2, vx: 0, vy: 0, scale: 1, launchPending: false, launchTimer: 0, alive: true, lives: MAX_LIVES };
    hazards = [];
    score = 0;
    spawnTimer = SPAWN_INTERVAL;
    keys = new Set();
    lastTime = performance.now();
    publishState();
    startLoop();
  }

  // === LOOP ==============================================================
  function startLoop() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    function tick(now) {
      try {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        update(dt);
        render();
        publishState();
      } catch (e) { console.error('loop error', e); }
      loopId = requestAnimationFrame(tick);
    }
    loopId = requestAnimationFrame(tick);
  }

  // === UPDATE =============================================================
  function update(dt) {
    if (!player.alive) return;

    // Input handling for launch
    if (keys.has(' ') || keys.has('Space')) {
      if (!player.launchPending && player.scale === 1) {
        player.scale = PLAYER_SCALE_MAX;
        player.launchPending = true;
      }
    }

    // Launch logic (next frame after press)
    if (player.launchPending) {
      // Initiate thrust this frame
      player.vx = PLAYER_THRUST;
      player.launchTimer = PLAYER_THRUST_TIME;
      player.scale = 1; // snap back
      player.launchPending = false;
    }
    // Apply thrust decay
    if (player.launchTimer > 0) {
      player.launchTimer -= dt;
      if (player.launchTimer <= 0) {
        player.vx = 0; // stop forward motion after thrust period
      }
    }

    // Update player position
    player.x += player.vx * dt;
    player.y += player.vy * dt; // vy stays zero (no vertical movement)

    // Keep player within vertical bounds (game over if out)
    if (player.y < 0 || player.y > H) {
      player.alive = false;
      player.lives = 0;
      endGame();
    }

    // Hazard spawning
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnHazard();
      spawnTimer = SPAWN_INTERVAL;
    }

    // Move hazards
    for (const h of hazards) {
      h.x -= WALL_SPEED * dt;
    }
    // Remove passed hazards and score
    for (let i = hazards.length - 1; i >= 0; i--) {
      const h = hazards[i];
      if (h.x + WALL_THICK < player.x) {
        score++;
        hazards.splice(i, 1);
        continue;
      }
    }

    // Collision detection (only when not stretched)
    if (player.scale === 1) {
      for (const h of hazards) {
        // left wall rect
        const leftRect = { x: h.x - WALL_THICK, y: 0, w: WALL_THICK, h: h.gapY - GAP_H/2 };
        // right wall rect
        const rightRect = { x: h.x - WALL_THICK, y: h.gapY + GAP_H/2, w: WALL_THICK, h: H - (h.gapY + GAP_H/2) };
        if (circleRectCollide(player.x, player.y, PLAYER_R, leftRect) ||
            circleRectCollide(player.x, player.y, PLAYER_R, rightRect)) {
          player.alive = false;
          player.lives--;
          endGame();
          break;
        }
      }
    }
  }

  function endGame() {
    if (score > highScore) highScore = score;
    beep(120, 0.4);
    // state switches to gameover via observable contract update
  }

  function spawnHazard() {
    const gapY = 100 + Math.random() * (H - 200); // ensure gap fully inside canvas
    const hazard = { x: W + WALL_THICK, gapY };
    hazards.push(hazard);
  }

  function circleRectCollide(cx, cy, r, rect) {
    // Find closest point on rect to circle center
    const closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    const closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    const dx = cx - closestX;
    const dy = cy - closestY;
    return dx*dx + dy*dy <= r*r;
  }

  // === RENDER =============================================================
  function render() {
    ctx.fillStyle = '#05050c';
    ctx.fillRect(0,0,W,H);

    // Hazards
    ctx.fillStyle = '#ff00aa';
    for (const h of hazards) {
      // left wall
      ctx.fillRect(h.x - WALL_THICK, 0, WALL_THICK, h.gapY - GAP_H/2);
      // right wall
      ctx.fillRect(h.x - WALL_THICK, h.gapY + GAP_H/2, WALL_THICK, H - (h.gapY + GAP_H/2));
    }

    // Player
    if (player.alive) {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.scale(player.scale, player.scale);
      ctx.beginPath();
      ctx.arc(0,0,PLAYER_R,0,Math.PI*2);
      ctx.fillStyle = '#7df9ff';
      ctx.fill();
      ctx.restore();
    }

    // HUD
    ctx.fillStyle = '#e6e6f0';
    ctx.font = '16px ui-sans-serif, system-ui';
    ctx.textAlign = 'left';
    ctx.fillText(`Score ${score}`, 12, 22);
    ctx.textAlign = 'right';
    ctx.fillText(`Best ${highScore}`, W-12, 22);
    ctx.textAlign = 'left';
    ctx.fillText(`Lives ${player.lives}`, 12, 42);

    if (!player.alive) {
      ctx.fillStyle = 'rgba(5,5,12,0.65)';
      ctx.fillRect(0,0,W,H);
      ctx.textAlign = 'center';
      ctx.font = '44px ui-sans-serif, system-ui';
      ctx.fillStyle = '#ff52ae';
      ctx.fillText('Game Over', W/2, H/2 - 20);
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '20px ui-sans-serif, system-ui';
      ctx.fillText(`Final score ${score}`, W/2, H/2 + 14);
      ctx.fillStyle = '#a5a5b8';
      ctx.font = '16px ui-sans-serif, system-ui';
      ctx.fillText('Press R or click Restart', W/2, H/2 + 42);
    }
  }

  // === INPUT ==============================================================
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
    keys.add(ev.key);
    if (ev.key === ' ') ev.preventDefault();
  });
  document.addEventListener('keyup', (ev) => { keys.delete(ev.key); });
  canvas.addEventListener('mousedown', (ev) => {
    // treat as space press
    keys.add(' ');
  });
  canvas.addEventListener('mouseup', (ev) => {
    keys.delete(' ');
  });
  restartBtn.addEventListener('click', reset);

  // === AUDIO (lazy) =======================================================
  function beep(freq, durSec) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + durSec);
    } catch {}
  }

  // === OBSERVABLE CONTRACT ===============================================
  function publishState() {
    window.__game = {
      state: player.alive ? 'playing' : 'gameover',
      score,
      player: {
        x: player.x,
        y: player.y,
        visible: player.x >= 0 && player.x < W && player.y >= 0 && player.y < H,
      },
      objective: 'Stretch and launch the dot to clear moving wall gaps before they hit you.',
    };
  }

  // === BOOT ===============================================================
  reset();
  </script>
</body>
</html>
