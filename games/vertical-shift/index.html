<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vertical Shift</title>
  <style>
    body { margin:0; background:#0a0a0f; color:#fff; font-family:sans-serif; overflow:hidden; }
    .game-header { padding:0.5rem 1rem; }
    .game-header h1 { margin:0; font-size:1.5rem; }
    .game-description { margin:0.2rem 0; }
    .game-controls { margin:0; padding:0; list-style:none; }
    .game-controls li { margin:0.2rem 0; }
    canvas { display:block; margin:0 auto; background:#000; }
    #restart { position:absolute; top:1rem; right:1rem; padding:0.5rem 1rem; background:#7df9ff; color:#000; border:none; cursor:pointer; }
    #restart:hover { background:#ff00aa; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Vertical Shift</h1>
    <p class="game-description">A dot rides a sine wave that shifts up or down with taps, aligning with high or low gaps in scrolling obstacles.</p>
    <ul class="game-controls">
      <li>Space or click to raise baseline (release to lower)</li>
      <li>Press R or click Restart to restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
/*
=== CRITIQUE ANALYSIS
=== END CRITIQUE ===
*/
    (() => {
      // ----- Configuration -----
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;

      const PLAYER_X = 150; // fixed horizontal position
      const PLAYER_RADIUS = 10;
      const BASELINE_START = 300;
      const BASELINE_DELTA = 40; // change on press
      const AMPLITUDE = 200; // sine amplitude
      const WAVE_SPEED = Math.PI * 2 / 2; // rad/s, one full wave every 2 seconds
      const PLAYER_SPEED_X = 200; // px/s (matches obstacle speed)

const OBSTACLE_WIDTH = 50;
const GAP_HEIGHT = 100;
const HIGH_GAP_TOP = 80; // top edge of high gap
const LOW_GAP_BOTTOM = HEIGHT - 80; // bottom edge of low gap
const SPAWN_INTERVAL = 1.5; // seconds
const OBSTACLE_SPEED = 200; // px/s leftward
const SAFE_RADIUS = 200; // not used directly, spawn logic respects safe rule

// ----- Enhancements -----
// Visual feedback timers
let flashTimer = 0;
let flashColor = '';
let shakeTimer = 0;

// Background stars for subtle animation
const STAR_COUNT = 100;
const stars = [];
for (let i = 0; i < STAR_COUNT; i++) {
  stars.push({
    x: Math.random() * WIDTH,
    y: Math.random() * HEIGHT,
    radius: Math.random() * 1.5 + 0.5,
    speed: Math.random() * 20 + 10,
  });
}

// Audio context lazily initialized
let audioCtx = null;
function playTone(freq, dur) {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.type = 'sine';
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.01);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {
    console.error('Audio error:', e);
  }
}


      // ----- State -----
      let player = {
        x: PLAYER_X,
        y: BASELINE_START,
        baseline: BASELINE_START,
        offset: 0,
        phase: 0,
        visible: true,
      };
      let obstacles = [];
      let spawnTimer = SPAWN_INTERVAL;
      let score = 0;
      let state = 'playing'; // menu | playing | gameover
      let loopId = null;
      let lastTime = performance.now();

      // ----- Observable contract -----
      window.__game = {
        state: state,
        score: score,
        player: { x: player.x, y: player.y, visible: player.visible },
        objective: 'Ride the sine wave and pass through high or low gaps without hitting the bars.'
      };

      // ----- Input handling -----
      let baselineShiftActive = false;

      const setBaselineShift = (active) => {
        baselineShiftActive = active;
        player.baseline = BASELINE_START + (active ? BASELINE_DELTA : 0);
      };

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          setBaselineShift(true);
        } else if (e.code === 'KeyR') {
          e.preventDefault();
          resetGame();
        }
      });
      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
          setBaselineShift(false);
        }
      });
      canvas.addEventListener('mousedown', (e) => setBaselineShift(true));
      canvas.addEventListener('mouseup', (e) => setBaselineShift(false));
      canvas.addEventListener('touchstart', (e) => { e.preventDefault(); setBaselineShift(true); });
      canvas.addEventListener('touchend', (e) => { e.preventDefault(); setBaselineShift(false); });

      document.getElementById('restart').addEventListener('click', resetGame);

      // ----- Game Loop -----
      function startLoop() {
        if (loopId !== null) cancelAnimationFrame(loopId);
        lastTime = performance.now();
        function tick(now) {
          try {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;
            update(dt);
            render();
            // update observable contract after rendering
            window.__game.state = state;
            window.__game.score = score;
            window.__game.player.x = player.x;
            window.__game.player.y = player.y;
            window.__game.player.visible = player.visible;
          } catch (err) {
            console.error('Game loop error:', err);
          }
          loopId = requestAnimationFrame(tick);
        }
        loopId = requestAnimationFrame(tick);
      }

      function resetGame() {
        if (loopId !== null) cancelAnimationFrame(loopId);
        player.baseline = BASELINE_START;
        player.offset = 0;
        player.phase = 0;
        player.y = BASELINE_START;
        player.visible = true;
        obstacles = [];
        spawnTimer = 0;
        score = 0;
        state = 'playing';
        baselineShiftActive = false;
        // reset observable contract immediately
        window.__game.state = state;
        window.__game.score = score;
        window.__game.player.x = player.x;
        window.__game.player.y = player.y;
        window.__game.player.visible = player.visible;
        startLoop();
      }

const WIN_SCORE = 30; // win threshold
function update(dt) {
          if (state !== 'playing') return;
          // advance wave phase
          player.phase += WAVE_SPEED * dt;
          // compute y position
          const waveY = Math.sin(player.phase) * AMPLITUDE;
          player.y = player.baseline + waveY;
          // keep within canvas bounds for visibility flag
          player.visible = player.y >= 0 && player.y <= HEIGHT;
          // spawn obstacles
          spawnTimer -= dt;
          if (spawnTimer <= 0) {
            spawnObstacle();
            spawnTimer = SPAWN_INTERVAL;
          }
          // move obstacles
          for (let i = obstacles.length - 1; i >= 0; i--) {
            const obs = obstacles[i];
            obs.x -= OBSTACLE_SPEED * dt;
            // scoring when passed player
            if (!obs.scored && obs.x + OBSTACLE_WIDTH / 2 < PLAYER_X - PLAYER_RADIUS) {
              score += 1;
              obs.scored = true;
              // visual/audio feedback for score
              flashTimer = 0.08;
              flashColor = 'rgba(255,255,255,0.5)';
              shakeTimer = 0.08;
              playTone(660, 0.1);
              // win condition
              if (score >= WIN_SCORE) {
                state = 'win';
                flashTimer = 0.2;
                flashColor = 'rgba(0,255,0,0.5)';
                shakeTimer = 0.3;
                playTone(880, 0.4);
              }
            }
            // collision check when overlapping player X
            if (!obs.collided &&
                obs.x - OBSTACLE_WIDTH / 2 <= PLAYER_X + PLAYER_RADIUS &&
                obs.x + OBSTACLE_WIDTH / 2 >= PLAYER_X - PLAYER_RADIUS) {
              const inHighGap = player.y >= HIGH_GAP_TOP && player.y <= HIGH_GAP_TOP + GAP_HEIGHT;
              const inLowGap = player.y >= LOW_GAP_BOTTOM - GAP_HEIGHT && player.y <= LOW_GAP_BOTTOM;
              if (!(inHighGap || inLowGap)) {
                obs.collided = true;
                state = 'gameover';
                // feedback for hit
                flashTimer = 0.2;
                flashColor = 'rgba(255,0,0,0.5)';
                shakeTimer = 0.3;
                playTone(200, 0.3);
              }
            }
            // remove off‑screen obstacles
            if (obs.x + OBSTACLE_WIDTH / 2 < 0) {
              obstacles.splice(i, 1);
            }
          }
          // death by leaving canvas vertically
          if (player.y < 0 || player.y > HEIGHT) {
            state = 'gameover';
            flashTimer = 0.2;
            flashColor = 'rgba(255,0,0,0.5)';
            shakeTimer = 0.3;
            playTone(150, 0.4);
          }
          // update timers
          if (flashTimer > 0) flashTimer -= dt;
          if (shakeTimer > 0) shakeTimer -= dt;
          // update background stars
          for (const s of stars) {
            s.y += s.speed * dt;
            if (s.y > HEIGHT) {
              s.y = 0;
              s.x = Math.random() * WIDTH;
            }
          }
        }

      function spawnObstacle() {
        // X starts just outside right edge
        const x = WIDTH + OBSTACLE_WIDTH / 2;
        obstacles.push({ x, scored: false, collided: false });
      }

function render() {
          // apply screen shake if active
          if (shakeTimer > 0) {
            const magnitude = 5; // pixels
            const dx = (Math.random() - 0.5) * magnitude;
            const dy = (Math.random() - 0.5) * magnitude;
            ctx.save();
            ctx.translate(dx, dy);
          }
          // draw background stars
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, WIDTH, HEIGHT);
          ctx.fillStyle = '#fff';
          for (const s of stars) {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
            ctx.fill();
          }
          // draw obstacles
          ctx.fillStyle = '#ff00aa'; // neon magenta bar
          obstacles.forEach((obs) => {
            const left = obs.x - OBSTACLE_WIDTH / 2;
            // draw top part
            ctx.fillRect(left, 0, OBSTACLE_WIDTH, HIGH_GAP_TOP);
            // middle part
            ctx.fillRect(left, HIGH_GAP_TOP + GAP_HEIGHT, OBSTACLE_WIDTH, LOW_GAP_BOTTOM - (HIGH_GAP_TOP + GAP_HEIGHT));
            // bottom part
            ctx.fillRect(left, LOW_GAP_BOTTOM, OBSTACLE_WIDTH, HEIGHT - LOW_GAP_BOTTOM);
          });
          // draw player dot
          ctx.beginPath();
          ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
          ctx.fillStyle = '#7df9ff'; // cyan
          ctx.fill();
          // draw persistent score UI
          ctx.fillStyle = '#fff';
          ctx.font = '20px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText('Score: ' + score, 10, 30);
          // flash overlay for events
          if (flashTimer > 0) {
            ctx.fillStyle = flashColor;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
          }
          // draw game over overlay
          if (state === 'gameover') {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.fillStyle = '#ff00aa';
            ctx.font = '48px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over', WIDTH / 2, HEIGHT / 2 - 30);
            ctx.fillStyle = '#fff';
            ctx.font = '24px sans-serif';
            ctx.fillText('Score: ' + score, WIDTH / 2, HEIGHT / 2 + 10);
            ctx.fillText('Press R or click Restart', WIDTH / 2, HEIGHT / 2 + 50);
          } else if (state === 'win') {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.fillStyle = '#7df9ff';
            ctx.font = '48px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('You Win!', WIDTH / 2, HEIGHT / 2 - 30);
            ctx.fillStyle = '#fff';
            ctx.font = '24px sans-serif';
            ctx.fillText('Score: ' + score, WIDTH / 2, HEIGHT / 2 + 10);
            ctx.fillText('Press R or click Restart', WIDTH / 2, HEIGHT / 2 + 50);
          }
          // restore context after shake
          if (shakeTimer > 0) {
            ctx.restore();
          }
        }

      // start automatically
      startLoop();
    })();
  </script>
</body>
</html>
