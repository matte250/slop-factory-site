<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trail Fade</title>
  <style>
    body {
      margin: 0;
      background:#0a0a0f;
      color:#fff;
      font-family:sans-serif;
      overflow:hidden;
    }
    .game-header {
      padding:0.5rem 1rem;
    }
    .game-header h1 {margin:0; font-size:1.5rem;}
    .game-header p {margin:0.2rem 0; font-size:0.9rem;}
    .game-controls {margin:0; padding:0; list-style:none; display:flex; gap:0.5rem; font-size:0.8rem;}
    .game-restart {
      position:absolute;
      top:1rem; right:1rem;
      background:#7df9ff; color:#0a0a0f;
      border:none; padding:0.3rem 0.6rem;
      cursor:pointer;
    }
    canvas {display:block; margin:0 auto; background:#0a0a0f;}
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Trail Fade</h1>
    <p class="game-description">A dot continuously moves forward, leaving a solid trail. Tap or click to temporarily erase the trail, letting the dot slip through its own line.</p>
    <ul class="game-controls">
      <li>Tap or click to erase trail</li>
      <li>Press R or click Restart to reset</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    (function(){
      const canvas=document.getElementById('game');
      const ctx=canvas.getContext('2d');
      const restartBtn=document.getElementById('restart');
      const width=canvas.width, height=canvas.height;
      const trailColor='#ff00aa';
      const dotColor='#7df9ff';
      const eraseDuration=300; // ms

      let loopId=null;
      let lastTime=performance.now();
      let player={x:width/2, y:height/2, radius:5, speed:100}; // pixels per second
      let prevPos={x:player.x, y:player.y};
      let score=0;
      let gameOver=false;
      let eraseTimeout=null;
      let erasing=false;

      function drawScore(){
        ctx.fillStyle='#ffd23f';
        ctx.font='16px sans-serif';
        ctx.fillText('Score: '+Math.floor(score),10,20);
      }

      function drawGameOver(){
        ctx.fillStyle='rgba(0,0,0,0.6)';
        ctx.fillRect(0,0,width,height);
        ctx.fillStyle='#fff';
        ctx.textAlign='center';
        ctx.font='32px sans-serif';
        ctx.fillText('Game Over', width/2, height/2-20);
        ctx.font='20px sans-serif';
        ctx.fillText('Score: '+Math.floor(score), width/2, height/2+10);
        ctx.fillText('Press R or click Restart', width/2, height/2+40);
      }

      function reset(){
        if(loopId!==null) cancelAnimationFrame(loopId);
        ctx.clearRect(0,0,width,height);
        player.x=width/2; player.y=height/2; prevPos.x=player.x; prevPos.y=player.y;
        score=0; gameOver=false; erasing=false;
        lastTime=performance.now();
        startLoop();
      }

      function startLoop(){
        function tick(now){
          const dt=Math.min((now-lastTime)/1000,0.1);
          lastTime=now;
          if(gameOver){
            drawGameOver();
            return;
          }
          // update score
          score+=dt;
          // move forward (to the right)
          player.x+=player.speed*dt;
          // wrap vertically not allowed – hitting border ends game
          if(player.x>width || player.x<0 || player.y>height || player.y<0){
            gameOver=true;
          }
          // draw trail unless erasing
          if(!erasing){
            ctx.strokeStyle=trailColor;
            ctx.lineWidth=4;
            ctx.beginPath();
            ctx.moveTo(prevPos.x, prevPos.y);
            ctx.lineTo(player.x, player.y);
            ctx.stroke();
          }
          // draw dot
          ctx.fillStyle=dotColor;
          ctx.beginPath();
          ctx.arc(player.x, player.y, player.radius,0,Math.PI*2);
          ctx.fill();
          // UI
          drawScore();
          prevPos.x=player.x; prevPos.y=player.y;
          loopId=requestAnimationFrame(tick);
        }
        loopId=requestAnimationFrame(tick);
      }

      // erase on click/tap
      canvas.addEventListener('pointerdown',()=>{
        if(erasing) return;
        erasing=true;
        ctx.clearRect(0,0,width,height);
        // reset previous position to current to avoid a long line after erase
        prevPos.x=player.x; prevPos.y=player.y;
        eraseTimeout=setTimeout(()=>{erasing=false;},eraseDuration);
      });

      // restart button
      restartBtn.addEventListener('click',reset);
      // R key restart
      window.addEventListener('keydown',e=>{if(e.key==='r' || e.key==='R'){reset();}});

      // start game
      startLoop();
    })();
  </script>
</body>
</html>
