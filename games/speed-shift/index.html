<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Speed Shift</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Speed Shift</h1>
    <p class="game-description">Guide a constantly moving dot through an endless tunnel, toggling speed between fast and slow to fit gaps.</p>
    <ul class="game-controls">
      <li>Tap or press Space to toggle speed</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
// === CONFIG =============================================================
// Canvas and rendering context
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const restartBtn = document.getElementById('restart');

// Game constants
const HAZARD_W = 20;
const HAZARD_H = 60;
const HAZARD_SPEED = 120; // px/sec
const HAZARD_SPAWN_INTERVAL = 1.5; // seconds
const SAFE_RADIUS = 200; // initial safety radius
const PLAYER_R = 6; // player radius (px)
const PLAYER_COLOR = '#7df9ff';
const HAZARD_COLOR = '#ff52ae';

// === STATE ==============================================================
let player = { x: 400, y: 300 };
let hazards = []; // will hold obstacle objects
let hazardSpawnTimer = 0;
let score = 0;
let phase = 'menu'; // 'menu' | 'playing' | 'gameover'
let keys = new Set();
let lastTime = performance.now();
let loopId = null;
let audioCtx = null;

// === RESET ==============================================================
function reset() {
  // Reset game state to initial values
  player = { x: 400, y: 300 };
  hazards = [];
  score = 0;
  phase = 'playing';
  keys.clear();
  lastTime = performance.now();
  startLoop();
}

// === LOOP ==============================================================
function startLoop() {
  if (loopId !== null) cancelAnimationFrame(loopId);
  function tick(now) {
    try {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      update(dt);
      render();
      publishState();
    } catch (err) {
      console.error('loop error', err);
    }
    loopId = requestAnimationFrame(tick);
  }
  loopId = requestAnimationFrame(tick);
}

// === UPDATE ==============================================================
function update(dt) {
  // Placeholder: no game logic yet
}

// === RENDER ==============================================================
function render() {
  // Clear canvas
  ctx.fillStyle = '#0f1320';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw hazards
  ctx.fillStyle = HAZARD_COLOR;
  for (const h of hazards) {
    ctx.fillRect(h.x, h.y, h.w, h.h);
  }

  // Draw player
  ctx.fillStyle = PLAYER_COLOR;
  ctx.beginPath();
  ctx.arc(player.x, player.y, PLAYER_R, 0, Math.PI * 2);
  ctx.fill();

  // HUD – score
  ctx.fillStyle = '#e6e6f0';
  ctx.font = '16px ui-sans-serif, system-ui';
  ctx.textAlign = 'left';
  ctx.fillText(`Score ${score}`, 12, 22);
}

// === INPUT ==============================================================
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
  keys.add(ev.key);
});
document.addEventListener('keyup', (ev) => {
  keys.delete(ev.key);
});
restartBtn.addEventListener('click', reset);

// === AUDIO (lazy) =======================================================
function beep(freq, durSec) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + durSec);
  } catch {}
}

// === OBSERVABLE CONTRACT ===============================================
function publishState() {
  const visible = player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height;
  window.__game = {
    state: phase,
    score,
    player: { x: player.x, y: player.y, visible },
    objective: 'Toggle speed to pass through tunnel gaps.',
  };
}

// === HELPERS ============================================================
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

// === BOOT ===============================================================
reset();
</script>
</body>
</html>
