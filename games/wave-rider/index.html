<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wave Rider</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Wave Rider</h1>
    <p class="game-description">A dot auto‑advances while oscillating vertically in a sine wave. Tap to flip the wave phase and align with gaps.</p>
    <ul class="game-controls">
      <li>Tap to flip wave phase</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const PLAYER_R = 6; // radius of the player dot

    // === STATE ==============================================================
    // Global game state objects
    const player = { x: 400, y: 300 }; // position will be updated each frame
    const hazards = []; // array of hazard objects (to be added later)
    let score = 0;
    let phase = "menu"; // "menu" | "playing" | "gameover"
    let keys = new Set();
    let lastTime = performance.now();
    let loopId = null;
    let audioCtx = null;

    // === RESET ==============================================================
    function reset() {
      // Initialize game state
      player.x = 400;
      player.y = 300;
      hazards.length = 0;
      score = 0;
      phase = "playing";
      keys.clear();
      lastTime = performance.now();
      // Publish initial observable state before starting loop
      publishState();
      // Start animation loop
      startLoop();
    }

    // === LOOP/UPDATE ========================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            // Clear canvas each frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            lastTime = now;
            // (Game logic will be added in later tasks)
            render();
            publishState();
        } catch (e) {
          console.error("loop error", e);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

// === RENDER ==============================================================
function render() {
  // Background
  ctx.fillStyle = "#0f1320";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Hazards (placeholder)
  ctx.fillStyle = "#ff00aa";
  for (const h of hazards) {
    if (typeof h.x === "number") {
      const w = h.w || 20;
      const hgt = h.h || 20;
      ctx.fillRect(h.x, h.y, w, hgt);
    }
  }

  // Player dot
  ctx.fillStyle = "#7df9ff";
  ctx.beginPath();
  ctx.arc(player.x, player.y, PLAYER_R, 0, Math.PI * 2);
  ctx.fill();

  // HUD - score
    ctx.fillStyle = "#e6e6f0";
    ctx.font = "16px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText(`Score ${score}`, 12, 22);
    // Game Over overlay
    if (phase === "gameover") {
      ctx.fillStyle = "rgba(10,10,15,0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center";
      ctx.font = "44px ui-sans-serif, system-ui";
      ctx.fillStyle = "#ff52ae";
      ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = "#e6e6f0";
      ctx.font = "20px ui-sans-serif, system-ui";
      ctx.fillText(`Final score ${score}`, canvas.width / 2, canvas.height / 2 + 14);
      ctx.fillStyle = "#a5a5b8";
      ctx.font = "16px ui-sans-serif, system-ui";
      ctx.fillText("Press R or click Restart", canvas.width / 2, canvas.height / 2 + 42);
    }
}

// === OBSERVABLE CONTRACT ================================================
    function publishState() {
      const visible = player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height;
      window.__game = {
        state: phase,
        score,
        player: {
          x: player.x,
          y: player.y,
          visible,
        },
        objective: "A dot auto‑advances while oscillating vertically in a sine wave."
      };
    }

    // === BOOT ===============================================================
    reset();
  </script>
</body>
</html>
