<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Layer Shift</title>
  <style>
    body { margin:0; background:#0a0a0f; color:#fff; font-family:sans-serif; overflow:hidden; }
    .game-header { padding:0.5rem 1rem; }
    .game-header h1 { margin:0; font-size:1.5rem; }
    .game-header p { margin:0.2rem 0; }
    .game-controls { margin:0; padding:0; list-style:none; }
    .game-restart { position:absolute; top:1rem; right:1rem; padding:0.5rem 1rem; background:#7df9ff; border:none; color:#000; cursor:pointer; font-weight:bold; }
    canvas { display:block; margin:0 auto; background:#111; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Layer Shift</h1>
    <p class="game-description">Swap between two invisible layers to avoid incoming obstacle gaps. The dot auto‑advances as the track scrolls, requiring precise timing to survive.</p>
    <ul class="game-controls">
      <li>Space or mouse click to toggle layer</li>
      <li>Press R or click Restart to reset the game</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const restartBtn = document.getElementById('restart');

  const CONFIG = {
    width: canvas.width,
    height: canvas.height,
    playerStart: { x: 100, y: 300 },
    playerRadius: 10,
    obstacleWidth: 30,
    gapSize: 150,
    obstacleSpeed: 150, // px/s leftward
    spawnInterval: 2.0, // seconds per layer
    safeRadius: 200,
    colors: { layer0: '#7df9ff', layer1: '#ff00aa', player0: '#7df9ff', player1: '#ff00aa' },
  };

  let loopId = null;
  let lastTime = performance.now();
  let state = 'playing';
  let score = 0;
  let player = {
    x: CONFIG.playerStart.x,
    y: CONFIG.playerStart.y,
    layer: 0,
    radius: CONFIG.playerRadius,
    visible: true,
  };
  let obstacles = [];
  let nextSpawn = [0, 1]; // staggers per layer

  // observable contract
  window.__game = {
    state: state,
    score: score,
    player: { x: player.x, y: player.y, visible: player.visible },
    objective: 'Swap layers to avoid obstacle gaps and survive as long as possible.'
  };

  function reset() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    state = 'playing';
    score = 0;
    player.x = CONFIG.playerStart.x;
    player.y = CONFIG.playerStart.y;
    player.layer = 0;
    player.visible = true;
    obstacles = [];
    nextSpawn = [0, 1];
    lastTime = performance.now();
    // update observable
    window.__game.state = state;
    window.__game.score = score;
    window.__game.player.x = player.x;
    window.__game.player.y = player.y;
    window.__game.player.visible = player.visible;
    startLoop();
  }

  function spawnObstacle(layer) {
    const gapY = Math.random() * (CONFIG.height - CONFIG.gapSize);
    obstacles.push({ x: CONFIG.width + CONFIG.obstacleWidth, layer, gapY, passed: false });
  }

  function update(dt) {
    // spawn obstacles per layer
    for (let layer = 0; layer < 2; layer++) {
      if (nextSpawn[layer] <= 0) {
        spawnObstacle(layer);
        nextSpawn[layer] = CONFIG.spawnInterval;
      }
      nextSpawn[layer] -= dt;
    }
    // move obstacles
    obstacles.forEach(o => { o.x -= CONFIG.obstacleSpeed * dt; });
    // remove off‑screen obstacles
    obstacles = obstacles.filter(o => o.x + CONFIG.obstacleWidth > 0);
    // scoring when passing
    obstacles.forEach(o => {
      if (!o.passed && o.layer === player.layer && o.x + CONFIG.obstacleWidth < player.x) {
        o.passed = true;
        score++;
      }
    });
    // collision detection
    for (const o of obstacles) {
      if (o.layer !== player.layer) continue;
      if (player.x >= o.x && player.x <= o.x + CONFIG.obstacleWidth) {
        if (player.y < o.gapY || player.y > o.gapY + CONFIG.gapSize) {
          state = 'gameover';
          break;
        }
      }
    }
  }

  function draw() {
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
    // draw obstacles
    obstacles.forEach(o => {
      const col = o.layer === 0 ? CONFIG.colors.layer0 : CONFIG.colors.layer1;
      ctx.fillStyle = col;
      // top rect
      ctx.fillRect(o.x, 0, CONFIG.obstacleWidth, o.gapY);
      // bottom rect
      ctx.fillRect(o.x, o.gapY + CONFIG.gapSize, CONFIG.obstacleWidth, CONFIG.height - (o.gapY + CONFIG.gapSize));
    });
    // draw player
    ctx.fillStyle = player.layer === 0 ? CONFIG.colors.player0 : CONFIG.colors.player1;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();
    // draw score
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText('Score: ' + score, 10, 30);
    // game over overlay
    if (state === 'gameover') {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
      ctx.fillStyle = '#ff00aa';
      ctx.font = '48px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', CONFIG.width / 2, CONFIG.height / 2 - 30);
      ctx.font = '24px monospace';
      ctx.fillText('Score: ' + score, CONFIG.width / 2, CONFIG.height / 2 + 10);
      ctx.fillText('Press R or Restart', CONFIG.width / 2, CONFIG.height / 2 + 50);
    }
  }

  function loop(now) {
    try {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      if (state === 'playing') update(dt);
      draw();
      // update observable
      window.__game.state = state;
      window.__game.score = score;
      window.__game.player.x = player.x;
      window.__game.player.y = player.y;
      window.__game.player.visible = true;
    } catch (e) {
      console.error(e);
    }
    loopId = requestAnimationFrame(loop);
  }

  function startLoop() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    lastTime = performance.now();
    loopId = requestAnimationFrame(loop);
  }

  // input handling
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      player.layer ^= 1;
    } else if (e.code === 'KeyR') {
      reset();
    }
  });
  window.addEventListener('mousedown', () => { player.layer ^= 1; });
  restartBtn.addEventListener('click', reset);

  // start the game loop
  startLoop();
})();
  </script>
</body>
</html>
