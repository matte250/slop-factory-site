<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mirror Slide</title>
  <style>
    body {margin:0;background:#0a0a0f;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh;}
    .game-header {padding:1rem; text-align:center;}
    .game-header h1 {margin:0; font-size:2rem;}
    .game-header p {margin:0.5rem 0;}
    .game-controls {list-style:none;padding:0;margin:0;display:inline-block;}
    .game-controls li {margin:0.2rem 0;}
    main {flex:1;display:flex;justify-content:center;align-items:center;}
    canvas {background:#0a0a0f;}
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Mirror Slide</h1>
    <p class="game-description">A line of light bounces between two walls; tap to reflect it horizontally or vertically, timing reflections to navigate through moving obstacles that appear only on one side.</p>
    <ul class="game-controls">
      <li>Click or tap to reflect the light</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
  </main>
  <script>
    (function(){
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      // light line state
      let x = w/2, y = h/2;
      let dx = 2, dy = 2;
      // obstacles
      const obstacles = [];
      const obstacleFreq = 2000; // ms
      const obstacleSpeed = 1.5;
      // spawn obstacles
      setInterval(()=>{
        const side = Math.random()<0.5?'left':'right';
        const size = 20 + Math.random()*30;
        const startX = side==='left' ? 0 : w - size;
        obstacles.push({x:startX, y:-size, w:size, h:size});
      }, obstacleFreq);
      // handle click / tap
      canvas.addEventListener('click',()=>{
        // reflect horizontally or vertically randomly for fun
        if (Math.random()<0.5) dx = -dx; else dy = -dy;
      });
      function loop(){
        try {
          // clear
          ctx.fillStyle = '#0a0a0f';
          ctx.fillRect(0,0,w,h);
          // move line
          x += dx; y += dy;
          if (x<=0 || x>=w) dx = -dx;
          if (y<=0 || y>=h) dy = -dy;
          // draw line (as short segment to look like a moving point)
          ctx.strokeStyle = '#7df9ff';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(x-10, y);
          ctx.lineTo(x+10, y);
          ctx.stroke();
          // update and draw obstacles
          ctx.fillStyle = '#ff00aa';
          for(let i=obstacles.length-1;i>=0;i--){
            const o = obstacles[i];
            o.y += obstacleSpeed;
            ctx.fillRect(o.x, o.y, o.w, o.h);
            if(o.y>h) obstacles.splice(i,1);
          }
        } catch(e){
          console.error(e);
        }
        requestAnimationFrame(loop);
      }
      // start loop immediately
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
