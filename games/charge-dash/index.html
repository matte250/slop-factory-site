<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Charge Dash</title>
  <style>
    body { margin:0; background:#0a0a0f; color:#fff; font-family:sans-serif; overflow:hidden; }
    .game-header { padding:0.5rem 1rem; background:#111; }
    .game-header h1 { margin:0; font-size:1.5rem; }
    .game-description { margin:0.2rem 0 0; }
    .game-controls { margin:0.2rem 0 0; padding-left:1.2rem; }
    canvas { display:block; background:#111; }
    #restart { position:absolute; top:0.5rem; right:0.5rem; padding:0.4rem 0.8rem; background:#7df9ff; color:#000; border:none; cursor:pointer; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Charge Dash</h1>
    <p class="game-description">Hold to charge a high‑speed dash that lets you thread through fleeting gaps as the dot moves forward.</p>
    <ul class="game-controls">
      <li>Hold Space to charge, release to dash</li>
      <li>Press R or click Restart to restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const restartBtn = document.getElementById('restart');
      const SAFE_RADIUS = 200; // px
      const PLAYER_RADIUS = 8;
      const BASE_SPEED = 200; // px/s
      const MAX_CHARGE = 1.5; // seconds
      const DASH_DURATION = 0.2; // seconds
      const OBSTACLE_SPEED = 150; // world scroll speed (same as base speed)
      const OBSTACLE_WIDTH = 30;
      const GAP_HEIGHT = 80;
      const SPAWN_INTERVAL = 1.5; // seconds

      let loopId = null;
        // Visual feedback variables
        let flashTimer = 0; // seconds
        let shakeTimer = 0; // seconds
        let shakeMagnitude = 5;
        // Simple star field background
        const STAR_COUNT = 100;
        const stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            z: Math.random() * 0.5 + 0.5 // speed factor
          });
        }
        // Audio context lazily created
        let audioCtx = null;
        function getAudioCtx() {
          if (!audioCtx) {
            try {
              audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
              console.warn('Web Audio not supported');
            }
          }
          return audioCtx;
        }
        function beep(freq, dur) {
          const ctx = getAudioCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.value = freq;
          osc.connect(gain);
          gain.connect(ctx.destination);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + dur);
        }
      let lastTime = performance.now();
      let player = { x: 100, y: canvas.height / 2, vx: BASE_SPEED };
      let charging = false;
      let chargeTime = 0;
      let dashTime = 0;
      let obstacles = [];
      let spawnTimer = SPAWN_INTERVAL;
      let score = 0;
      let highScore = Number(localStorage.getItem('slop-factory:charge-dash:highScore')) || 0;
      let gameOver = false;

      function reset() {
        if (loopId !== null) cancelAnimationFrame(loopId);
        player = { x: 100, y: canvas.height / 2, vx: BASE_SPEED };
        charging = false; chargeTime = 0; dashTime = 0;
        obstacles = [];
        spawnTimer = SPAWN_INTERVAL;
        score = 0;
        gameOver = false;
        loopId = requestAnimationFrame(loop);
      }

      function spawnObstacle() {
        // Choose gap position avoiding player initial safe zone at start of game.
        const gapY = Math.random() * (canvas.height - GAP_HEIGHT);
        // Ensure not within SAFE_RADIUS horizontally at spawn and won't reach player within 3s.
        const spawnX = canvas.width + OBSTACLE_WIDTH;
        const timeToReach = (spawnX - player.x) / OBSTACLE_SPEED;
        if (timeToReach < 3) {
          // delay spawn by adjusting spawnX further right
          // but for simplicity just return without spawning this frame.
          return;
        }
        obstacles.push({ x: spawnX, gapY });
      }

      function update(dt) {
        // decrement visual timers
        flashTimer = Math.max(flashTimer - dt, 0);
        shakeTimer = Math.max(shakeTimer - dt, 0);
        // Charge handling
        if (charging) {
          chargeTime = Math.min(chargeTime + dt, MAX_CHARGE);
        } else if (dashTime > 0) {
          // dash already active, decrement timer
          dashTime = Math.max(dashTime - dt, 0);
          if (dashTime === 0) {
            player.vx = BASE_SPEED;
          }
        } else if (chargeTime > 0) {
          // release triggers dash
          player.vx = BASE_SPEED + chargeTime * 300; // boost proportional to charge
          dashTime = DASH_DURATION;
          chargeTime = 0;
        }

        // Move player forward (world scroll simulated by moving obstacles leftwards)
        // Player x stays constant; obstacles move left by player.vx * dt.
        const move = player.vx * dt;
        obstacles.forEach(o => o.x -= move);
        // Remove passed obstacles and increase score
        obstacles = obstacles.filter(o => {
          if (o.x + OBSTACLE_WIDTH < 0) {
            // Score point
            score++;
            // visual/audio feedback for score
            flashTimer = 0.1;
            shakeTimer = 0.1;
            beep(440, 0.05);
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('slop-factory:charge-dash:highScore', highScore);
            }
            return false;
            score++;
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('slop-factory:charge-dash:highScore', highScore);
            }
            return false;
          }
          return true;
        });

        // Spawn logic
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnObstacle();
          spawnTimer = SPAWN_INTERVAL;
        }

        // Collision detection (simple circle-rectangle)
        for (const o of obstacles) {
          if (player.x + PLAYER_RADIUS > o.x && player.x - PLAYER_RADIUS < o.x + OBSTACLE_WIDTH) {
            // within horizontal bounds of obstacle
            if (player.y - PLAYER_RADIUS < o.gapY || player.y + PLAYER_RADIUS > o.gapY + GAP_HEIGHT) {
              gameOver = true;
              break;
            }
          }
        }
      }

      function draw() {
        // Update star field
        stars.forEach(s => {
          s.x -= s.z * 30 * (shakeTimer > 0 ? 0 : 1); // move slower, pause during shake not needed
          if (s.x < 0) {
            s.x = canvas.width;
            s.y = Math.random() * canvas.height;
          }
        });
        // Apply screen shake
        if (shakeTimer > 0) {
          const shakeX = (Math.random() - 0.5) * shakeMagnitude;
          const shakeY = (Math.random() - 0.5) * shakeMagnitude;
          ctx.save();
          ctx.translate(shakeX, shakeY);
        }
        // Apply screen shake
        if (shakeTimer > 0) {
          const shakeX = (Math.random() - 0.5) * shakeMagnitude;
          const shakeY = (Math.random() - 0.5) * shakeMagnitude;
          ctx.save();
          ctx.translate(shakeX, shakeY);
        }
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Draw player
        ctx.fillStyle = charging ? '#ff00aa' : '#7df9ff';
        ctx.beginPath();
        ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        // Draw obstacles
        ctx.fillStyle = '#ffd23f';
        for (const o of obstacles) {
          // top part
          ctx.fillRect(o.x, 0, OBSTACLE_WIDTH, o.gapY);
          // bottom part
          ctx.fillRect(o.x, o.gapY + GAP_HEIGHT, OBSTACLE_WIDTH, canvas.height - (o.gapY + GAP_HEIGHT));
        }
        // UI
        ctx.fillStyle = '#fff';
        ctx.font = '20px sans-serif';
        ctx.fillText('Score: ' + score, 10, 30);
        ctx.fillText('High: ' + highScore, 10, 60);
        if (gameOver) {
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#fff';
          ctx.font = '48px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 20);
          ctx.font = '24px sans-serif';
          ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 20);
          ctx.fillText('Press R or click Restart', canvas.width / 2, canvas.height / 2 + 60);
        }
      }

      function loop(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          if (!gameOver) update(dt);
          draw();
          loopId = requestAnimationFrame(loop);
        } catch (e) {
          console.error('Loop error:', e);
        }
      }

      // Input handling
      window.addEventListener('keydown', e => {
        if (e.code === 'Space') {
          e.preventDefault();
          if (!charging && dashTime === 0) charging = true;
        } else if (e.code === 'KeyR') {
          reset();
        }
      });
      window.addEventListener('keyup', e => {
        if (e.code === 'Space') {
          charging = false;
        }
      });
      restartBtn.addEventListener('click', reset);

      // Start game
      reset();
    })();
  </script>
</body>
</html>
