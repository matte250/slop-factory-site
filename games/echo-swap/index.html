<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Echo Swap</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #05050c; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Echo Swap</h1>
    <p class="game-description">The dot leaves a fading echo behind as it moves forward; tapping swaps the dot's current position with the echo, instantly jumping back or forward to a recent safe spot.</p>
    <ul class="game-controls">
      <li>Arrow keys to move</li>
      <li>Tap or press Space to swap with the echo</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const W = 800, H = 600;
    const PLAYER_RADIUS = 10;
    const PLAYER_THRUST = 300; // px/sec^2
    const PLAYER_FRICTION = 0.9; // per second decay factor
    const PLAYER_MAX_SPEED = 300; // max px/sec
    const ECHO_MAX_AGE = 1.5; // seconds
    const SWAP_COOLDOWN_TIME = 0.5; // seconds
    const HAZARD_RADIUS = 12;
    const HAZARD_SPEED = 150; // px/sec
    const HAZARD_SPAWN_INTERVAL = 2.0; // seconds
    const SAFE_RADIUS = 200; // no hazard spawns within this distance from player at start

    // === STATE ==============================================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let player, hazards, echoTrail, score, highScore, phase, swapCooldown, spawnTimer, keys, lastTime, loopId = null;
    let audioCtx = null;

    function reset() {
      player = { x: W/2, y: H/2, vx: 0, vy: 0 };
      hazards = [];
      echoTrail = [];
      score = 0;
      phase = 'playing';
      swapCooldown = 0;
      spawnTimer = 0;
      keys = new Set();
      lastTime = performance.now();
      publishState();
      startLoop();
    }

    // === LOOP ==============================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          update(dt);
          render();
          publishState();
        } catch (err) {
          console.error('loop error', err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    // === INPUT ==============================================================
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
      keys.add(ev.key);
      if (ev.key === ' ') ev.preventDefault();
    });
    document.addEventListener('keyup', (ev) => {
      keys.delete(ev.key);
    });
    document.getElementById('restart').addEventListener('click', reset);
    // click/tap to swap
    document.addEventListener('mousedown', (ev) => { if (phase === 'playing') trySwap(); });
    document.addEventListener('touchstart', (ev) => { if (phase === 'playing') trySwap(); });

    // === UPDATE ==============================================================
    function spawnHazard() {
      // Attempt to find a safe spawn location
      let x, tries = 0;
      while (tries < 30) {
        x = HAZARD_RADIUS + Math.random() * (W - 2 * HAZARD_RADIUS);
        const dy = -HAZARD_RADIUS - player.y; // start above canvas
        const dx = x - player.x;
        const dist = Math.hypot(dx, dy);
        if (dist >= SAFE_RADIUS && dist / HAZARD_SPEED >= 3) break;
        tries++;
      }
      hazards.push({ x, y: -HAZARD_RADIUS, r: HAZARD_RADIUS });
    }

    function update(dt) {
      if (phase !== 'playing') return;
      // Player movement based on keys
      let ax = 0, ay = 0;
      if (keys.has('ArrowLeft') || keys.has('a') || keys.has('A')) ax -= PLAYER_THRUST;
      if (keys.has('ArrowRight') || keys.has('d') || keys.has('D')) ax += PLAYER_THRUST;
      if (keys.has('ArrowUp') || keys.has('w') || keys.has('W')) ay -= PLAYER_THRUST;
      if (keys.has('ArrowDown') || keys.has('s') || keys.has('S')) ay += PLAYER_THRUST;
      player.vx += ax * dt;
      player.vy += ay * dt;
      // clamp speed
      const spd = Math.hypot(player.vx, player.vy);
      if (spd > PLAYER_MAX_SPEED) {
        const scale = PLAYER_MAX_SPEED / spd;
        player.vx *= scale;
        player.vy *= scale;
      }
      // friction
      const decay = Math.pow(PLAYER_FRICTION, dt);
      player.vx *= decay;
      player.vy *= decay;
      // move and clamp inside canvas
      player.x = Math.max(PLAYER_RADIUS, Math.min(W - PLAYER_RADIUS, player.x + player.vx * dt));
      player.y = Math.max(PLAYER_RADIUS, Math.min(H - PLAYER_RADIUS, player.y + player.vy * dt));

      // Echo trail update
      const now = performance.now() / 1000;
      echoTrail.push({ x: player.x, y: player.y, t: now });
      while (echoTrail.length && now - echoTrail[0].t > ECHO_MAX_AGE) echoTrail.shift();

      // cooldown timer
      if (swapCooldown > 0) swapCooldown -= dt;

      // hazard spawn timer
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnHazard();
        spawnTimer = HAZARD_SPAWN_INTERVAL;
      }

      // move hazards
      for (const h of hazards) {
        h.y += HAZARD_SPEED * dt;
      }
      // remove off‑screen hazards
      hazards = hazards.filter(h => h.y - h.r < H + h.r);

      // collision detection
      for (const h of hazards) {
        const dx = h.x - player.x;
        const dy = h.y - player.y;
        if (Math.hypot(dx, dy) < h.r + PLAYER_RADIUS) {
          phase = 'gameover';
          if (score > highScore) highScore = score;
          beep(110, 0.3);
          break;
        }
      }
    }

    function trySwap() {
      if (swapCooldown > 0 || echoTrail.length === 0) return;
      const last = echoTrail[echoTrail.length - 1];
      player.x = last.x;
      player.y = last.y;
      echoTrail = [];
      swapCooldown = SWAP_COOLDOWN_TIME;
      score += 10;
      beep(440, 0.1);
    }

    // === RENDER ==============================================================
    function render() {
      // background
      ctx.fillStyle = '#05050c';
      ctx.fillRect(0, 0, W, H);
      // hazards
      ctx.fillStyle = '#ff5252';
      for (const h of hazards) {
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
        ctx.fill();
      }
      // echo trail
      const now = performance.now() / 1000;
      for (const p of echoTrail) {
        const age = now - p.t;
        const alpha = Math.max(0, 1 - age / ECHO_MAX_AGE);
        ctx.fillStyle = `rgba(125,249,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      // player
      ctx.fillStyle = '#7df9ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      // HUD
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '16px ui-sans-serif, system-ui';
      ctx.textAlign = 'left';
      ctx.fillText(`Score ${score}`, 12, 22);
      if (phase === 'gameover') {
        ctx.fillStyle = 'rgba(5,5,12,0.65)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.font = '44px ui-sans-serif, system-ui';
        ctx.fillStyle = '#ff52ae';
        ctx.fillText('Game Over', W/2, H/2 - 20);
        ctx.font = '20px ui-sans-serif, system-ui';
        ctx.fillStyle = '#e6e6f0';
        ctx.fillText(`Final score ${score}`, W/2, H/2 + 14);
        ctx.font = '16px ui-sans-serif, system-ui';
        ctx.fillStyle = '#a5a5b8';
        ctx.fillText('Press R or click Restart', W/2, H/2 + 42);
      }
    }

    // === OBSERVABLE CONTRACT ================================================
    function publishState() {
      const visible = player.x >= 0 && player.x <= W && player.y >= 0 && player.y <= H;
      window.__game = {
        state: phase,
        score,
        player: { x: player.x, y: player.y, visible },
        objective: 'Swap with your echo to avoid hazards and survive as long as possible.'
      };
    }

    // === AUDIO (lazy) =====================================================
    function beep(freq, durSec) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durSec);
      } catch (e) {
        // silence any errors
      }
    }

    // === BOOT ===============================================================
    reset();
  </script>
</body>
</html>
