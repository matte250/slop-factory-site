<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shape Shift</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 20px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Shape Shift</h1>
    <p class="game-description">Tap to cycle a glowing dot through circle, square, and triangle shapes as it races through a neon tunnel; match each shape to the cut‑out obstacles to survive.</p>
    <ul class="game-controls">
      <li>Tap (or press Space) to change shape</li>
      <li>Press R or click Restart to reset</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
// Configuration constants
    const PLAYER_SPEED = 150; // pixels per second
    const SHAPE_COUNT = 3; // number of shapes (circle, square, triangle)
    const SAFE_RADIUS = 200; // safe distance from player at start
    const HAZARD_SPAWN_MIN = 1.0; // min seconds between hazards
    const HAZARD_SPAWN_MAX = 2.5; // max seconds between hazards

    // === STATE ==============================================================
    // Game state objects
    let player = { x: 400, y: 300, shape: 0, visible: true };
    let hazards = []; // array of obstacles
    let score = 0;
    let phase = "menu"; // "menu" | "playing" | "gameover"
    let keys = new Set();

    function reset() {
  // Reset game state to initial values
  player = { x: 400, y: 300, shape: 0, visible: true };
  hazards = [];
  score = 0;
  phase = "playing";
  keys.clear();
  // Reset timing
  lastTime = performance.now();
  // Start game loop
  startLoop();
}

function cycleShape() {
  // Cycle shape index 0->1->2->0
  player.shape = (player.shape + 1) % SHAPE_COUNT;
}

    // === OBSERVABLE CONTRACT ===============================================
    (function(){
      window.__game = {
        state: "menu",
        score: 0,
        player: { x: 400, y: 300, visible: true },
        objective: "Tap to cycle shape and match obstacles."
      };
    })();

// === INPUT ==============================================================
document.addEventListener("keydown", function(ev) {
  // Add pressed key to the set
  keys.add(ev.key);
  // Reset game on R key press
  if (ev.key === "r" || ev.key === "R") {
    reset();
  }
  // Cycle shape on Space key press
  if (ev.key === " " || ev.key === "Space") {
    cycleShape();
  }
});

document.addEventListener("keyup", function(ev) {
  // Remove released key from the set
  keys.delete(ev.key);
});

document.getElementById("restart").addEventListener("click", function() {
  reset();
});

    // === LOOP =============================================================
let loopId = null;
let lastTime = performance.now();
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function update(dt) {
  // Update game logic based on current phase
  if (phase === "playing") {
    // Move player forward (downwards)
    player.y += PLAYER_SPEED * dt;
    // Wrap around to stay within canvas
    if (player.y > canvas.height) player.y = 0;
  }
  // Populate observable contract each frame
  window.__game.state = phase;
  window.__game.score = score;
  window.__game.player.x = player.x;
  window.__game.player.y = player.y;
  window.__game.player.visible = player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height;
}

// placeholder render function
function render() {
  // Clear canvas
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // Fill background
  ctx.fillStyle = "#0f1320";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw player shape
  const size = 12; // half-size for square/triangle, radius for circle
  ctx.fillStyle = "#7df9ff";
  if (player.shape === 0) {
    // circle
    ctx.beginPath();
    ctx.arc(player.x, player.y, size, 0, Math.PI * 2);
    ctx.fill();
  } else if (player.shape === 1) {
    // square
    ctx.fillRect(player.x - size, player.y - size, size * 2, size * 2);
  } else {
    // triangle
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - size);
    ctx.lineTo(player.x - size, player.y + size);
    ctx.lineTo(player.x + size, player.y + size);
    ctx.closePath();
    ctx.fill();
  }

  // Draw HUD (score)
  ctx.fillStyle = "#e6e6f0";
  ctx.font = "16px ui-sans-serif, system-ui";
  ctx.textAlign = "left";
  ctx.fillText(`Score ${score}`, 12, 22);

  // Game over overlay (if applicable)
  if (phase === "gameover") {
    ctx.fillStyle = "rgba(10,10,15,0.7)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ff52ae";
    ctx.textAlign = "center";
    ctx.font = "44px ui-sans-serif, system-ui";
    ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillStyle = "#e6e6f0";
    ctx.font = "20px ui-sans-serif, system-ui";
    ctx.fillText(`Final score ${score}`, canvas.width / 2, canvas.height / 2 + 14);
    ctx.fillStyle = "#a5a5b8";
    ctx.font = "16px ui-sans-serif, system-ui";
    ctx.fillText("Press R or click Restart", canvas.width / 2, canvas.height / 2 + 42);
  }
}

// startLoop implementation
function startLoop() {
  if (loopId !== null) cancelAnimationFrame(loopId);
  function tick(now) {
    try {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      update(dt);
      render();
    } catch (err) {
      console.error("loop error", err);
    }
    loopId = requestAnimationFrame(tick);
  }
  loopId = requestAnimationFrame(tick);
}

// === BOOT ===============================================================
    reset();
  </script>
</body>
</html>
