<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orbit Radius</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Orbit Radius</h1>
    <p class="game-description">The dot orbits a central pivot while the tunnel scrolls forward; tapping toggles between an inner and outer orbit, letting you bypass obstacles that appear at either radius.</p>
    <ul class="game-controls">
      <li>Tap to toggle orbit</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
  // === STATE ==============================================================
// Define initial game state objects.
const player = {
  // Player position will be set by game logic; starting at canvas center.
  x: 400,
  y: 300,
  // Additional properties can be added later (e.g., orbit radius).
};

const hazards = []; // Array of hazard objects.
let score = 0; // Player's score.
let phase = "menu"; // Game phase: "menu", "playing", or "gameover".
let keys = new Set(); // Currently pressed keys.
let scoreTimer = 0; // Accumulates dt for scoring.


// === CONFIG ==============================================================
// Game constants.
const SAFE_RADIUS = 120; // Minimum safe distance for spawning hazards.
const HAZARD_SPEED = 200; // Pixels per second.
const PLAYER_RADIUS = 10; // Player radius for collision detection.
let spawnTimer = 0; // Time until next hazard spawn.

  // === LOOP ==============================================================
  // Animation loop that clears the canvas each frame.
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let loopId = null;
  let lastTime = performance.now();

  function startLoop() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    function tick(now) {
      try {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        // Clear canvas each frame.
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Update game state and render.
    update(dt);
    render();
    publishState();
      } catch (err) {
        console.error("loop error", err);
      }
      loopId = requestAnimationFrame(tick);
    }
    loopId = requestAnimationFrame(tick);
  }

  // Start the animation loop.
  startLoop();

  // === AUDIO (lazy) ======================================================
  // Lazy AudioContext for beep sounds.
  let audioCtx = null;
  function beep(freq, durSec) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durSec);
    } catch (e) { }
  }

  // === UPDATE ==============================================================
  function update(dt) {
    // Placeholder for game update logic.
    // Increment score slowly as a demo (each second).
    scoreTimer += dt;
    if (scoreTimer >= 1) {
      score += 1;
      scoreTimer -= 1;
      beep(880, 0.05); // Score increment sound
    }
    // Future: handle player movement, hazard spawning, collision, etc.
  }

  // === RENDER ==============================================================
  function render() {
    // Draw background.
    ctx.fillStyle = "#0f1320";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw hazards (placeholder – none yet).
    // Future: iterate hazards array and draw each.

    // Draw player.
    ctx.fillStyle = "#7df9ff";
    ctx.beginPath();
    ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    // HUD – score.
    ctx.fillStyle = "#e6e6f0";
    ctx.font = "16px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText(`Score ${score}`, 12, 22);

    // Game‑over overlay.
    if (phase === "gameover") {
      ctx.fillStyle = "rgba(10,10,15,0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center";
      ctx.font = "44px ui-sans-serif, system-ui";
      ctx.fillStyle = "#ff52ae";
      ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = "20px ui-sans-serif, system-ui";
      ctx.fillStyle = "#e6e6f0";
      ctx.fillText(`Final score ${score}`, canvas.width / 2, canvas.height / 2 + 14);
      ctx.font = "16px ui-sans-serif, system-ui";
      ctx.fillStyle = "#c8c8d8";
      ctx.fillText("Press R or click Restart", canvas.width / 2, canvas.height / 2 + 42);
    }
  }

  // === OBSERVABLE CONTRACT ==============================================
  function publishState() {
    window.__game = {
      state: phase,
      score: score,
      player: {
        x: player.x,
        y: player.y,
        visible: player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height,
      },
      objective: "Orbit around the pivot and avoid obstacles.",
    };
  }

  </script>
</body>
</html>
