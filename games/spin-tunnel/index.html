<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spin Tunnel</title>
  <style>
    body {margin:0; background:#0a0a0f; color:#fff; font-family:sans-serif; overflow:hidden;}
    .game-header {padding:0.5rem 1rem; background:#111;}
    .game-header h1 {margin:0; font-size:1.5rem;}
    .game-header p {margin:0.2rem 0; font-size:0.9rem;}
    .game-controls {margin:0; padding:0; list-style:none; display:flex; gap:1rem; font-size:0.8rem;}
    canvas {display:block; margin:0 auto; background:#0a0a0f;}
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Spin Tunnel</h1>
    <p class="game-description">Control a dot sliding through a rotating tunnel; tap to reverse the spin and line up gaps as they approach. Survive as long as possible and try to beat your high score.</p>
    <ul class="game-controls">
      <li>Tap / click to reverse spin</li>
      <li>Press R to restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const CENTER_X = W/2, CENTER_Y = H/2;
      const TUNNEL_RADIUS = 250;
      const DOT_RADIUS = 6;
      const GAP_ANGLE = Math.PI/6; // 30deg gap
      let rotation = 0;
      let direction = 1; // 1 clockwise, -1 counter
      let speed = 2; // forward speed per frame
      let offset = 0; // distance travelled
      let score = 0;
      let gameOver = false;

      // lazy audio init
      let audioCtx;
      const playHit = () => {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.value = 440;
          osc.type = 'sine';
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.1);
        } catch(e) { console.error(e); }
      };

      const reset = () => {
        rotation = 0;
        direction = 1;
        offset = 0;
        score = 0;
        gameOver = false;
      };

      const handleTap = (e) => {
        direction *= -1;
      };

      canvas.addEventListener('click', handleTap);
      canvas.addEventListener('touchstart', handleTap);
      window.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R') reset();
        // first user interaction may unlock audio
        if (!audioCtx) {
          try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(_) {}
        }
      });

      function drawTunnel() {
        ctx.save();
        ctx.translate(CENTER_X, CENTER_Y);
        ctx.rotate(rotation);
        // draw many rings to give sense of depth
        for (let i = -offset; i < TUNNEL_RADIUS; i += 20) {
          const radius = TUNNEL_RADIUS - i;
          ctx.beginPath();
          ctx.arc(0, 0, radius, GAP_ANGLE, 2*Math.PI - GAP_ANGLE);
          ctx.strokeStyle = '#7df9ff';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawDot() {
        const angle = rotation;
        const r = TUNNEL_RADIUS - offset;
        const x = CENTER_X + Math.cos(angle) * r;
        const y = CENTER_Y + Math.sin(angle) * r;
        ctx.beginPath();
        ctx.arc(x, y, DOT_RADIUS, 0, 2*Math.PI);
        ctx.fillStyle = '#ff00aa';
        ctx.fill();
      }

      function drawScore() {
        ctx.fillStyle = '#ffd23f';
        ctx.font = '20px monospace';
        ctx.fillText('Score: ' + score, 10, 30);
      }

      function checkCollision() {
        // if dot aligns with gap, safe, else hit
        const gapCenter = rotation % (2*Math.PI);
        const diff = Math.abs(((gapCenter + Math.PI) % (2*Math.PI)) - Math.PI); // distance to gap center
        // simple: if rotation modulo gap size within gap range, safe
        const withinGap = Math.abs(((rotation % (2*Math.PI)) - GAP_ANGLE/2)) < GAP_ANGLE/2;
        if (!withinGap) {
          gameOver = true;
          playHit();
        }
      }

      function loop() {
        try {
          if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0,0,W,H);
            ctx.fillStyle = '#fff';
            ctx.font = '40px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over', CENTER_X, CENTER_Y);
            ctx.font = '20px sans-serif';
            ctx.fillText('Score: ' + score, CENTER_X, CENTER_Y + 30);
            ctx.fillText('Press R to restart', CENTER_X, CENTER_Y + 60);
            requestAnimationFrame(loop);
            return;
          }
          ctx.clearRect(0,0,W,H);
          drawTunnel();
          drawDot();
          drawScore();
          rotation += 0.02 * direction;
          offset += speed;
          if (offset > TUNNEL_RADIUS) {
            offset = 0;
            score++;
          }
          checkCollision();
        } catch (err) {
          console.error('Animation loop error:', err);
        }
        requestAnimationFrame(loop);
      }

      // start immediately
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
