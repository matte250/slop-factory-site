<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>World Spin</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>World Spin</h1>
    <p class="game-description">Navigate an endless neon tunnel by rotating it with taps or clicks to stay within safe gaps and survive as long as possible.</p>
    <ul class="game-controls">
      <li>Tap or click to rotate the tunnel</li>
      <li>Press R or click Restart to restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
// === CONFIG =============================================================
    // Canvas size and game constants
    const CANVAS_W = canvas.width;
    const CANVAS_H = canvas.height;
    const SAFE_RADIUS = 200; // pixels around player start safe zone
    const ROTATION_ANGLE = Math.PI / 6; // 30 degrees per tap
    const SCROLL_SPEED = 200; // pixels per second scroll speed
    const SPAWN_INTERVAL = 1.0; // seconds between hazard spawns

    // === STATE =============================================================
    // Game state objects
    let player = { x: CANVAS_W / 2, y: CANVAS_H - 30, visible: true };
    let hazards = []; // array of obstacle objects
    let score = 0;
    let phase = "menu";
    let spawnTimer = SPAWN_INTERVAL;
    let rotationOccurred = false;
    let comboStreak = 0;

    let loopId = null;
    let keys = new Set();
    let worldRotation = 0;
    let lastTime = performance.now();
    // === OBSERVABLE CONTRACT =============================================================
function publishState() {
      window.__game = {
        state: phase === "menu" ? "menu" : phase === "playing" ? "playing" : "gameover",
        score: score,
        player: { x: player.x, y: player.y, visible: player.visible },
        objective: 'Rotate the tunnel to stay within gaps.'
      };
    }
    function render() {
      // Clear background
      ctx.fillStyle = '#0f1320';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // Draw player dot
      ctx.fillStyle = '#7df9ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, 8, 0, Math.PI * 2);
      ctx.fill();

      // Draw score HUD
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '16px ui-sans-serif, system-ui';
      ctx.textAlign = 'left';
      ctx.fillText(`Score ${score}`, 12, 22);

      // If game over, draw overlay
      if (phase === 'gameover') {
        ctx.fillStyle = 'rgba(10,10,15,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = 'center';
        ctx.font = '44px ui-sans-serif, system-ui';
        ctx.fillStyle = '#ff52ae';
        ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '20px ui-sans-serif, system-ui';
        ctx.fillStyle = '#e6e6f0';
        ctx.fillText(`Final score ${score}`, canvas.width / 2, canvas.height / 2 + 14);
        ctx.font = '16px ui-sans-serif, system-ui';
        ctx.fillStyle = '#a5a5b8';
        ctx.fillText('Press R or click Restart', canvas.width / 2, canvas.height / 2 + 42);
      }
    }
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick() {
        try {
          render();
          publishState();
        } catch (e) { console.error(e); }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }
    function reset() {
      startLoop();
    }
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'r' || ev.key === 'R') { reset(); }
    });
    document.getElementById('restart').addEventListener('click', reset);
    // === AUDIO (lazy) =======================================================
    let audioCtx = null;
    function beep(freq, durSec) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durSec);
      } catch (e) {
        // ignore audio errors
      }
    }
    // start immediately
    reset();
  </script>
</body>
</html>
