<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Time Freeze</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #05050c; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Time Freeze</h1>
    <p class="game-description">A dot moves automatically through a scrolling tunnel. Tap briefly to freeze all obstacles while the dot continues moving, allowing you to thread through dense clusters before time resumes.</p>
    <ul class="game-controls">
      <li>Space or click to freeze time</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const W = 800, H = 600;
    const PLAYER_RADIUS = 8;
    const PLAYER_X = W / 2;
    const PLAYER_Y = H / 2;
    const SAFE_RADIUS = 120; // no hazard spawns within this radius of player
    const FREEZE_DURATION = 0.5; // seconds
    const SPAWN_INTERVAL = 1.2; // seconds between spawns
    const HAZARD_R_MIN = 8, HAZARD_R_MAX = 20;
    const HAZARD_SPEED_MIN = 80, HAZARD_SPEED_MAX = 200; // pixels per second, negative direction

    // === STATE =============================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restart");

    let player; // { x, y, radius }
    let hazards; // array of { x, y, r, vx }
    let score;
    let highScore = 0;
    let phase; // "playing" | "gameover"
    let freezeTimer;
    let keys;
    let lastTime;
    let loopId = null;
    let audioCtx = null;
    let spawnTimer;

    // === RESET =============================================================
    function reset() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      player = { x: PLAYER_X, y: PLAYER_Y, radius: PLAYER_RADIUS };
      hazards = [];
      score = 0;
      phase = "playing";
      freezeTimer = 0;
      keys = new Set();
      lastTime = performance.now();
      spawnTimer = SPAWN_INTERVAL;
      publishState();
      startLoop();
    }

    // === LOOP =============================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          update(dt);
          render();
          publishState();
        } catch (err) {
          console.error("loop error", err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    // === UPDATE =============================================================
    function spawnHazard() {
      const r = HAZARD_R_MIN + Math.random() * (HAZARD_R_MAX - HAZARD_R_MIN);
      let y;
      // Ensure safe spawn distance from player
      const maxAttempts = 30;
      let attempts = 0;
      do {
        y = Math.random() * H;
        attempts++;
      } while (Math.abs(y - PLAYER_Y) < SAFE_RADIUS && attempts < maxAttempts);
      const vx = - (HAZARD_SPEED_MIN + Math.random() * (HAZARD_SPEED_MAX - HAZARD_SPEED_MIN));
      hazards.push({ x: W + r, y, r, vx });
    }

    function update(dt) {
      if (phase !== "playing") return;

      // Freeze timer handling
      if (freezeTimer > 0) {
        freezeTimer = Math.max(0, freezeTimer - dt);
      } else {
        // Move hazards
        for (const h of hazards) {
          h.x += h.vx * dt;
        }
      }

      // Spawn hazards
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnHazard();
        spawnTimer = SPAWN_INTERVAL;
      }

      // Remove off‑screen hazards and increase score
      for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        if (h.x + h.r < 0) {
          hazards.splice(i, 1);
          score += 1;
        }
      }

      // Collision detection
      for (const h of hazards) {
        const dx = h.x - player.x;
        const dy = h.y - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist < h.r + player.radius) {
          phase = "gameover";
          if (score > highScore) highScore = score;
          beep(110, 0.3);
          break;
        }
      }
    }

    // === RENDER =============================================================
    function render() {
      // Clear background
      ctx.fillStyle = "#05050c";
      ctx.fillRect(0, 0, W, H);

      // Draw hazards
      ctx.fillStyle = "#ff00aa";
      for (const h of hazards) {
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw player
      ctx.fillStyle = "#7df9ff";
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // HUD
      ctx.fillStyle = "#e6e6f0";
      ctx.font = "16px ui-sans-serif, system-ui";
      ctx.textAlign = "left";
      ctx.fillText(`Score ${score}`, 12, 22);
      ctx.textAlign = "right";
      ctx.fillText(`Best ${highScore}`, W - 12, 22);

      // Game‑over overlay
      if (phase === "gameover") {
        ctx.fillStyle = "rgba(5,5,12,0.65)";
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = "center";
        ctx.font = "44px ui-sans-serif, system-ui";
        ctx.fillStyle = "#ff52ae";
        ctx.fillText("Game Over", W / 2, H / 2 - 20);
        ctx.fillStyle = "#e6e6f0";
        ctx.font = "20px ui-sans-serif, system-ui";
        ctx.fillText(`Final Score ${score}`, W / 2, H / 2 + 14);
        ctx.fillStyle = "#a5a5b8";
        ctx.font = "16px ui-sans-serif, system-ui";
        ctx.fillText("Press R or click Restart", W / 2, H / 2 + 42);
      }
    }

    // === INPUT =============================================================
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "r" || ev.key === "R") { reset(); return; }
      if (ev.key === " ") {
        if (freezeTimer <= 0) {
          freezeTimer = FREEZE_DURATION;
          beep(440, 0.12);
        }
        ev.preventDefault();
      }
      keys.add(ev.key);
    });
    document.addEventListener("keyup", (ev) => { keys.delete(ev.key); });
    restartBtn.addEventListener("click", reset);

    // === AUDIO (lazy) ======================================================
    function beep(freq, durSec) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durSec);
      } catch (e) {}
    }

    // === OBSERVABLE CONTRACT ===============================================
    function publishState() {
      window.__game = {
        state: phase,
        score,
        player: {
          x: player.x,
          y: player.y,
          visible: player.x >= 0 && player.x < W && player.y >= 0 && player.y < H,
        },
        objective: "Freeze obstacles to navigate the tunnel.",
      };
    }

    // === BOOT ===============================================================
    reset();
  </script>
</body>
</html>
