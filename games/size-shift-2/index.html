<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Size Shift</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #05050c; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Size Shift</h1>
    <p class="game-description">A dot auto‑advances; tapping toggles its radius between a tiny and a large version, letting you slip through narrow gaps when small or make small obstacles bounce off when large, with a short cooldown.</p>
    <ul class="game-controls">
      <li>Tap/Click or press Space to toggle size</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
// === CONFIG =============================================================
    const W = 800, H = 600;
    const PLAYER_RADIUS_SMALL = 5;
    const PLAYER_RADIUS_LARGE = 20;
    const PLAYER_TOGGLE_COOLDOWN = 0.3; // seconds
    const PLAYER_AUTO_SPEED = 150; // px/sec auto-advance
    const HAZARD_RADIUS = 12;
    const HAZARD_SPEED = 140; // px/sec, moving leftward
    const SPAWN_INTERVAL = 2.0; // seconds between spawns
    const SAFE_RADIUS = 150; // no hazard spawns within this radius of player

    // === STATE =============================================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const restartBtn = document.getElementById('restart');
    let player, hazards, score, phase, toggleCooldown, keys, lastTime, loopId = null, audioCtx = null;

    function reset() {
      player = {
        x: W / 2,
        y: H / 2,
        vx: PLAYER_AUTO_SPEED,
        vy: 0,
        radius: PLAYER_RADIUS_SMALL,
        sizeState: 'small',
      };
      hazards = [];
      score = 0;
      phase = 'playing';
      toggleCooldown = 0;
      keys = new Set();
      lastTime = performance.now();
      publishState();
      startLoop();
    }

    // === LOOP/UPDATE =============================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          update(dt);
          render();
          publishState();
        } catch (err) {
          console.error('loop error', err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    function update(dt) {
      if (phase !== 'playing') return;

      // Auto‑advance player
      player.x += player.vx * dt;
      player.y += player.vy * dt;
      // Wrap around edges
      if (player.x > W) player.x -= W;
      if (player.x < 0) player.x += W;
      if (player.y > H) player.y -= H;
      if (player.y < 0) player.y += H;

      // Cooldown timer for size toggle
      if (toggleCooldown > 0) toggleCooldown -= dt;

      // TODO: hazard logic will be added later
    }

    // === RENDER =============================================================
    function render() {
      // Clear background
      ctx.fillStyle = '#05050c';
      ctx.fillRect(0, 0, W, H);

      // Draw player
      ctx.fillStyle = '#7df9ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // HUD – score
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '16px ui-sans-serif, system-ui';
      ctx.textAlign = 'left';
      ctx.fillText(`Score ${score}`, 12, 22);
    }

    // === INPUT =============================================================
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
      keys.add(ev.key);
      if (ev.key === ' ' || ev.key === 'Space') { toggleSize(); }
    });
    document.addEventListener('keyup', (ev) => { keys.delete(ev.key); });
    // Click/tap toggles size
    canvas.addEventListener('pointerdown', () => { toggleSize(); });
    restartBtn.addEventListener('click', reset);

    function toggleSize() {
      if (toggleCooldown > 0) return;
      toggleCooldown = PLAYER_TOGGLE_COOLDOWN;
      if (player.sizeState === 'small') {
        player.sizeState = 'large';
        player.radius = PLAYER_RADIUS_LARGE;
      } else {
        player.sizeState = 'small';
        player.radius = PLAYER_RADIUS_SMALL;
      }
      beep(440, 0.05);
    }

    // === AUDIO (lazy) =====================================================
    function beep(freq, durSec) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durSec);
      } catch {}
    }

    // === OBSERVABLE CONTRACT ===============================================
    function publishState() {
      window.__game = {
        state: phase,
        score,
        player: {
          x: player.x,
          y: player.y,
          visible: player.x >= 0 && player.x < W && player.y >= 0 && player.y < H,
        },
        objective: 'Tap to toggle size and avoid obstacles.',
      };
    }

    // === BOOT =============================================================
    reset();
  </script>
</body>
</html>
