<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orbit Dodge</title>
  <style>
    body {margin:0; background:#0a0a0f; color:#fff; font-family:sans-serif; overflow:hidden;}
    .game-header {padding:10px; text-align:center;}
    .game-header h1 {margin:0; font-size:2em;}
    .game-description {margin:5px 0;}
    .game-controls {list-style:none; padding:0; margin:0; display:inline-block;}
    .game-controls li {display:inline; margin:0 5px;}
    canvas {display:block; margin:0 auto; background:#0a0a0f;}
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Orbit Dodge</h1>
    <p class="game-description">Orbit around a planet while dodging incoming asteroids on multiple lanes and collecting fuel orbs to extend your time.</p>
    <ul class="game-controls">
      <li>Arrow keys to rotate</li>
      <li>Space to boost</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
  </main>
  <script>
    (function(){
      const canvas=document.getElementById('game');
      const ctx=canvas.getContext('2d');
      const W=canvas.width, H=canvas.height;
      const center={x:W/2, y:H/2};
      const player={angle:0, radius:150, size:8, speed:0.03};
      const asteroids=[];
      const fuels=[];
      let boost=0;
      const keys={};
      function spawnAsteroid(){
        const lane=Math.random()*2+1; // 1-3 factor
        const angle=Math.random()*Math.PI*2;
        const r=lane*200;
        asteroids.push({angle, r, speed:(Math.random()*0.5+0.5)});
      }
      function spawnFuel(){
        const lane=Math.random()*2+1;
        const angle=Math.random()*Math.PI*2;
        const r=lane*200;
        fuels.push({angle, r, speed:0.6});
      }
      for(let i=0;i<5;i++) spawnAsteroid();
      for(let i=0;i<2;i++) spawnFuel();
      window.addEventListener('keydown',e=>{keys[e.key]=true;});
      window.addEventListener('keyup',e=>{keys[e.key]=false;});
      function update(){
        if(keys['ArrowLeft']) player.angle-=player.speed;
        if(keys['ArrowRight']) player.angle+=player.speed;
        if(keys[' ']) boost=0.2; else boost=0;
        asteroids.forEach(a=>{a.r-=a.speed+boost;});
        fuels.forEach(f=>{f.r-=f.speed+boost;});
        // remove off-screen
        for(let i=asteroids.length-1;i>=0;i--){if(asteroids[i].r<=0) asteroids.splice(i,1);}
        for(let i=fuels.length-1;i>=0;i--){if(fuels[i].r<=0) fuels.splice(i,1);}
        if(Math.random()<0.02) spawnAsteroid();
        if(Math.random()<0.005) spawnFuel();
        const px=center.x+Math.cos(player.angle)*player.radius;
        const py=center.y+Math.sin(player.angle)*player.radius;
        for(let i=asteroids.length-1;i>=0;i--){
          const a=asteroids[i];
          const ax=center.x+Math.cos(a.angle)*a.r;
          const ay=center.y+Math.sin(a.angle)*a.r;
          const dx=px-ax, dy=py-ay;
          if(dx*dx+dy*dy < (player.size+6)*(player.size+6)){
            asteroids.splice(i,1);
            player.angle=0; // simple reset
          }
        }
        for(let i=fuels.length-1;i>=0;i--){
          const f=fuels[i];
          const fx=center.x+Math.cos(f.angle)*f.r;
          const fy=center.y+Math.sin(f.angle)*f.r;
          const dx=px-fx, dy=py-fy;
          if(dx*dx+dy*dy < (player.size+5)*(player.size+5)){
            fuels.splice(i,1);
          }
        }
      }
      function draw(){
        ctx.fillStyle='#0a0a0f';
        ctx.fillRect(0,0,W,H);
        // planet
        ctx.fillStyle='#7df9ff';
        ctx.beginPath();
        ctx.arc(center.x,center.y,30,0,Math.PI*2);
        ctx.fill();
        // player
        const px=center.x+Math.cos(player.angle)*player.radius;
        const py=center.y+Math.sin(player.angle)*player.radius;
        ctx.fillStyle='#ff00aa';
        ctx.beginPath();
        ctx.arc(px,py,player.size,0,Math.PI*2);
        ctx.fill();
        // asteroids
        ctx.fillStyle='#ffd23f';
        asteroids.forEach(a=>{
          const x=center.x+Math.cos(a.angle)*a.r;
          const y=center.y+Math.sin(a.angle)*a.r;
          ctx.beginPath();
          ctx.arc(x,y,6,0,Math.PI*2);
          ctx.fill();
        });
        // fuel orbs
        ctx.fillStyle='#00ff99';
        fuels.forEach(f=>{
          const x=center.x+Math.cos(f.angle)*f.r;
          const y=center.y+Math.sin(f.angle)*f.r;
          ctx.beginPath();
          ctx.arc(x,y,5,0,Math.PI*2);
          ctx.fill();
        });
      }
      function loop(){
        try{
          update();
          draw();
        }catch(e){
          console.error('Game loop error',e);
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
