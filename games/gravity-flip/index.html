<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gravity Flip</title>
  <style>
    html,body{margin:0;padding:0;background:#0a0a0f;color:#fff;font-family:sans-serif;overflow:hidden}
    .game-header{padding:1rem;background:#111;text-align:center}
    .game-header h1{margin:0;font-size:2rem;color:#7df9ff}
    .game-header p{margin:.5rem 0;color:#ffd23f}
    .game-controls{list-style:none;padding:0;margin:0;display:flex;justify-content:center;gap:1rem}
    .game-controls li{color:#ff00aa;font-size:.9rem}
    canvas{display:block;background:#000;}
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Gravity Flip</h1>
    <p class="game-description">Control a ball that flips gravity left or right to roll through a side‑scrolling corridor, collecting tokens while avoiding spikes.</p>
    <ul class="game-controls">
      <li>Arrow Left to flip gravity left</li>
      <li>Arrow Right to flip gravity right</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
  </main>
  <script>
    // Simple gravity‑flip side‑scroller
    (function(){
      const canvas=document.getElementById('game');
      const ctx=canvas.getContext('2d');
      const W=canvas.width, H=canvas.height;

      const ball={x:W*0.2,y:H/2,r:15,vx:0,vy:0};
      let gravity=0; // -1 left, 1 right, 0 down (default)

      const spikes=[]; // {x,y,w,h,top:true/false}
      const tokens=[]; // {x,y,r,collected:false}
      let frame=0;
      let score=0;

      function addSpike(){
        const gap=H*0.3;
        const size=30;
        // top spike
        spikes.push({x:W+size,y:0,w:size,h:gap,top:true});
        // bottom spike
        spikes.push({x:W+size,y:H-gap,w:size,h:gap,top:false});
      }
      function addToken(){
        const r=8;
        const y=Math.random()*(H-2*r)+r;
        tokens.push({x:W+20,y,r,collected:false});
      }

      document.addEventListener('keydown',e=>{
        if(e.code==='ArrowLeft'){gravity=-1;}
        else if(e.code==='ArrowRight'){gravity=1;}
      });

      function update(){
        // Apply horizontal gravity
        if(gravity!==0){ball.vx+=gravity*0.2;}
        // constant downwards pull to keep movement
        ball.vy+=0.05;
        // apply velocity
        ball.x+=ball.vx;
        ball.y+=ball.vy;
        // simple friction
        ball.vx*=0.98;
        ball.vy*=0.98;
        // keep ball within bounds (wrap horizontally)
        if(ball.x<0) ball.x=W;
        if(ball.x>W) ball.x=0;
        if(ball.y<ball.r) ball.y=ball.r, ball.vy=0;
        if(ball.y>H-ball.r) ball.y=H-ball.r, ball.vy=0;
        // move obstacles leftwards
        spikes.forEach(s=>s.x-=4);
        tokens.forEach(t=>t.x-=4);
        // remove off‑screen
        while(spikes.length && spikes[0].x<-spikes[0].w) spikes.shift();
        while(tokens.length && tokens[0].x<-20) tokens.shift();
        // collision with spikes
        spikes.forEach(s=>{
          if(ball.x+ball.r> s.x && ball.x-ball.r< s.x+s.w){
            if(s.top && ball.y-ball.r< s.h){ball.x=s.x+ball.r;ball.vx=0;}
            if(!s.top && ball.y+ball.r> H-s.h){ball.x=s.x+ball.r;ball.vx=0;}
          }
        });
        // collect tokens
        tokens.forEach(t=>{
          if(!t.collected && Math.hypot(ball.x-t.x,ball.y-t.y)<ball.r+t.r){
            t.collected=true;score++;}
        });
        // spawn obstacles
        if(frame%120===0) addSpike();
        if(frame%180===0) addToken();
        frame++;
      }

      function draw(){
        ctx.clearRect(0,0,W,H);
        // background
        ctx.fillStyle='#0a0a0f';
        ctx.fillRect(0,0,W,H);
        // draw ball
        ctx.fillStyle='#7df9ff';
        ctx.beginPath();
        ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
        ctx.fill();
        // draw spikes (triangles)
        ctx.fillStyle='#ff00aa';
        spikes.forEach(s=>{
          ctx.beginPath();
          if(s.top){
            ctx.moveTo(s.x,0);
            ctx.lineTo(s.x+s.w,0);
            ctx.lineTo(s.x+s.w/2,s.h);
          }else{
            ctx.moveTo(s.x,H);
            ctx.lineTo(s.x+s.w,H);
            ctx.lineTo(s.x+s.w/2,H-s.h);
          }
          ctx.closePath();
          ctx.fill();
        });
        // draw tokens
        ctx.fillStyle='#ffd23f';
        tokens.forEach(t=>{
          if(t.collected) return;
          ctx.beginPath();
          ctx.arc(t.x,t.y,t.r,0,Math.PI*2);
          ctx.fill();
        });
        // draw score
        ctx.fillStyle='#fff';
        ctx.font='16px sans-serif';
        ctx.fillText('Score: '+score,10,20);
      }

      function loop(){
        try{
          update();
          draw();
        }catch(e){
          console.error('Game loop error',e);
        }
        requestAnimationFrame(loop);
      }
      // start immediately
      loop();
    })();
  </script>
</body>
</html>
