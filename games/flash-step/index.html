<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flash Step</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Flash Step</h1>
    <p class="game-description">The dot auto‑advances forward and a tap instantly teleports it a short distance ahead, bypassing obstacles, with a brief cooldown after each blink.</p>
    <ul class="game-controls">
      <li>Tap to blink ahead</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
  // === CONFIG =============================================================
  const PLAYER_R = 5; // radius of player dot
  const PLAYER_SPEED = 200; // px/sec forward auto-advance
  const BLINK_DISTANCE = 80; // pixels teleport forward per tap
  const BLINK_COOLDOWN = 0.3; // seconds

  // === STATE ==============================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const restartBtn = document.getElementById('restart');

  let player; // { x, y, cooldown }
  let score;
  let state; // "menu" | "playing" | "gameover"
  let keys; // Set of pressed keys (unused now but required for input pattern)
  let lastTime;
  let loopId = null;
  let audioCtx = null;

  // === RESET ==============================================================
  function reset() {
    player = { x: canvas.width / 2, y: canvas.height / 2, cooldown: 0 };
    score = 0;
    state = 'playing';
    keys = new Set();
    lastTime = performance.now();
    // Ensure observable contract exists before the first frame
    publishState();
    startLoop();
  }

  // === LOOP =============================================================
  function startLoop() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    function tick(now) {
      try {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        update(dt);
        render();
        publishState();
      } catch (err) {
        console.error('loop error', err);
      }
      loopId = requestAnimationFrame(tick);
    }
    loopId = requestAnimationFrame(tick);
  }

  // === UPDATE =============================================================
  function update(dt) {
    if (state !== 'playing') return;
    // Auto-advance forward (upwards)
    player.y -= PLAYER_SPEED * dt;
    // Blink forward on tap (Space key as placeholder for "tap")
    if (keys.has(' ') && player.cooldown <= 0) {
      player.y -= BLINK_DISTANCE;
      player.cooldown = BLINK_COOLDOWN;
      beep(440, 0.05);
    }
    // Cooldown timer
    if (player.cooldown > 0) player.cooldown -= dt;
    // Clamp player within canvas bounds
    player.y = Math.max(PLAYER_R, Math.min(canvas.height - PLAYER_R, player.y));
    player.x = Math.max(PLAYER_R, Math.min(canvas.width - PLAYER_R, player.x));
    // Increment score over time
    score = Math.floor((performance.now() - lastTime) / 1000);
  }

  // === RENDER =============================================================
  function render() {
    ctx.fillStyle = '#0f1320';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Draw player dot
    ctx.fillStyle = '#7df9ff';
    ctx.beginPath();
    ctx.arc(player.x, player.y, PLAYER_R, 0, Math.PI * 2);
    ctx.fill();
    // HUD score
    ctx.fillStyle = '#e6e6f0';
    ctx.font = '16px ui-sans-serif, system-ui';
    ctx.textAlign = 'left';
    ctx.fillText('Score ' + score, 12, 22);
    // Game Over overlay
    if (state === 'gameover') {
      ctx.fillStyle = 'rgba(10,10,15,0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff52ae';
      ctx.textAlign = 'center';
      ctx.font = '44px ui-sans-serif, system-ui';
      ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = '20px ui-sans-serif, system-ui';
      ctx.fillText('Press R or click Restart', canvas.width / 2, canvas.height / 2 + 20);
    }
  }

  // === INPUT ==============================================================
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
    keys.add(ev.key);
  });
  document.addEventListener('keyup', (ev) => { keys.delete(ev.key); });
  restartBtn.addEventListener('click', reset);

  // === AUDIO (lazy) =======================================================
  function beep(freq, durSec) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durSec);
    } catch {}
  }

  // === OBSERVABLE CONTRACT ===============================================
  function publishState() {
    window.__game = {
      state: state,
      score: score,
      player: {
        x: player.x,
        y: player.y,
        visible: player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height,
      },
      objective: 'Tap to blink ahead and survive as long as possible.',
    };
  }

  // === BOOT ===============================================================
  reset();
  </script>
</body>
</html>
