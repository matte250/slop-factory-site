<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Laser Blast</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Laser Blast</h1>
    <p class="game-description">Guide a glowing dot racing through a neon tunnel. Tap to fire a forward laser that destroys the next obstacle. Time your shots to survive as the tunnel speeds up.</p>
    <ul class="game-controls">
      <li>Tap or click to fire laser</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const PLAYER_RADIUS = 8;
    const PLAYER_SPEED = 200; // px/sec (unused placeholder)
    const CANVAS_W = 800;
    const CANVAS_H = 600;
    const SAFE_RADIUS = 200;
    const RECHARGE_TIME = 0.5; // seconds
    const HAZARD_SPEED = 150;
    const HAZARD_SPAWN_INTERVAL = 1.5; // seconds
    const HAZARD_RADIUS = 12;

    // === STATE ==============================================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const restartBtn = document.getElementById('restart');

    let player; // {x, y}
    let score;
    let keys;
    let lastTime;
    let loopId = null;
    let audioCtx = null;
    let hazards = [];
    let phase = 'playing';
    let laserCooldown = 0;
    let hazardSpawnTimer = 0;

    // === RESET ==============================================================
    function reset() {
      player = { x: CANVAS_W / 2, y: CANVAS_H / 2 };
      score = 0;
      keys = new Set();
      lastTime = performance.now();
      publishState();
      startLoop();
    }

    // === LOOP / UPDATE ======================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          update(dt);
          render();
          publishState();
        } catch (err) {
          console.error('loop error', err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    function update(dt) {
      // Placeholder: no game logic yet.
    }

    // === RENDER =============================================================
    function render() {
      ctx.fillStyle = '#0f1320';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw player dot
      ctx.fillStyle = '#7df9ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
      ctx.fill();

      // Draw score
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '16px ui-sans-serif, system-ui';
      ctx.textAlign = 'left';
      ctx.fillText(`Score ${score}`, 12, 22);
    }

    // === INPUT ==============================================================
    document.addEventListener('keydown', ev => {
      if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
      keys.add(ev.key);
    });
    document.addEventListener('keyup', ev => { keys.delete(ev.key); });
    restartBtn.addEventListener('click', reset);

    // === AUDIO (lazy) ======================================================
    function beep(freq, durSec) {
      // Placeholder for beep sound; actual laser fire sound will be added later
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durSec);
      } catch {}
    }

    // === OBSERVABLE CONTRACT ===============================================
    function publishState() {
      // Determine observable state based on game phase
      let observableState;
      if (phase === 'playing') observableState = 'playing';
      else if (phase === 'gameover') observableState = 'gameover';
      else observableState = 'menu';
      window.__game = {
        state: observableState,
        score,
        player: {
          x: player.x,
          y: player.y,
          visible: player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height,
        },
        objective: 'Fire the laser to clear obstacles and survive as the tunnel speeds up.',
      };
    }

    // === BOOT ===============================================================
    reset();
  </script>
</body>
</html>
