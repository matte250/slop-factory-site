<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pulse Runner</title>
  <style>
    body {
      margin: 0;
      background: #0a0a0f;
      color: #fff;
      font-family: sans-serif;
    }
    .game-header {
      text-align: center;
      padding: 1rem;
    }
    .game-header h1 {
      margin: 0.2rem;
    }
    .game-controls {
      list-style: none;
      padding: 0;
      margin: 0.5rem 0 0;
      display: inline-block;
      text-align: left;
    }
    canvas { display: block; margin: 0 auto; background: #0a0a0f; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Pulse Runner</h1>
    <p class="game-description">Navigate a constantly advancing dot through moving gaps by shrinking or growing its size. Each successful passage extends the timer and speeds up the game.</p>
    <ul class="game-controls">
      <li>Arrow Up to grow the dot</li>
      <li>Arrow Down to shrink the dot</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;

      // Game state
      let dot = { x: 80, y: height / 2, r: 20 };
      let speed = 2; // pixels per frame (dot and barrier)
      const barrier = { x: width, w: 40, gapY: 200, gapH: 120 };
      let score = 0;
      let lastTime = performance.now();

      const maxRadius = 60;
      const minRadius = 5;

      // Input handling
      window.addEventListener('keydown', e => {
        if (e.code === 'ArrowUp') {
          dot.r = Math.min(dot.r + 2, maxRadius);
        } else if (e.code === 'ArrowDown') {
          dot.r = Math.max(dot.r - 2, minRadius);
        }
      });

      function resetBarrier() {
        barrier.x = width;
        barrier.gapY = Math.random() * (height - 150) + 75; // keep gap away from edges
        barrier.gapH = Math.random() * 80 + 60; // 60-140px gap height
      }

      function update(dt) {
        // advance dot
        dot.x += speed;
        // move barrier left
        barrier.x -= speed;
        // if barrier passed, check win condition
        if (barrier.x + barrier.w < dot.x - dot.r) {
          // dot has passed the barrier
          const fits = dot.r * 2 <= barrier.gapH;
          if (fits) {
            score++;
            speed *= 1.05; // increase speed
            // extend timer - not displayed, just a placeholder
          }
          resetBarrier();
        }
        // loop dot back if it reaches right edge (optional)
        if (dot.x - dot.r > width) {
          dot.x = -dot.r;
        }
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        // background already dark via CSS
        // draw barrier (two rects leaving gap)
        ctx.fillStyle = '#7df9ff'; // neon cyan
        ctx.fillRect(barrier.x, 0, barrier.w, barrier.gapY - barrier.gapH / 2);
        ctx.fillRect(barrier.x, barrier.gapY + barrier.gapH / 2, barrier.w, height - (barrier.gapY + barrier.gapH / 2));
        // draw dot
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ff00aa'; // neon magenta
        ctx.fill();
        // draw score (optional)
        ctx.fillStyle = '#ffd23f';
        ctx.font = '18px sans-serif';
        ctx.fillText('Score: ' + score, 10, 30);
      }

      function loop(timestamp) {
        const dt = timestamp - lastTime;
        lastTime = timestamp;
        try {
          update(dt);
          draw();
        } catch (e) {
          console.error('Animation error', e);
        }
        requestAnimationFrame(loop);
      }

      resetBarrier();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
