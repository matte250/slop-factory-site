<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbit Switch</title>
<style>
body { margin:0; background:#0a0a0f; color:#e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
.game-header { padding:12px 16px; border-bottom:1px solid #1d1d2a; }
.game-header h1 { margin:0; font-size:18px; color:#7df9ff; }
.game-header .game-description { margin:4px 0; color:#a5a5b8; }
.game-header .game-controls { margin:4px 0; padding-left:18px; color:#c8c8d8; }
main { display:flex; flex-direction:column; align-items:center; padding:16px; }
canvas { background:#0f1320; border:1px solid #2a2f44; }
.game-restart { margin-top:10px; padding:8px 14px; background:#1c2030; color:#7df9ff; border:1px solid #2a2f44; cursor:pointer; }
.game-restart:hover { background:#232842; }
</style>
</head>
<body>
<header class="game-header">
<h1>Orbit Switch</h1>
<p class="game-description">The dot orbits a central point while the tunnel scrolls forward; each tap reverses the orbital direction, letting you dodge obstacles that appear from either side.</p>
<ul class="game-controls">
<li>Arrow keys or A/D to move</li>
<li>Tap or press Space to reverse direction</li>
<li>Press R or click Restart</li>
</ul>
</header>
<main>
<canvas id="game" width="800" height="600"></canvas>
<button id="restart" class="game-restart" type="button">Restart</button>
</main>
<script>
// === CONFIG =============================================================
// (no config yet)

// === STATE ==============================================================
let player = { x: 400, y: 300, radius: 5 };
let hazards = []; // array of obstacle objects
let score = 0;
let phase = "playing"; // "playing" | "gameover"
let keys = new Set();

// === LOOP ==============================================================
let lastTime = performance.now();
let loopId = null;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function update(dt) {
  // TODO: implement game update logic
}

function render() {
  // Clear canvas background
  ctx.fillStyle = "#0f1320";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw hazards
  ctx.fillStyle = "#ff52ae";
  for (const h of hazards) {
    if (h.alive === false) continue;
    // Assume hazard has x, y, radius or rect dimensions
    if (h.radius !== undefined) {
      ctx.beginPath();
      ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
      ctx.fill();
    } else if (h.w && h.h) {
      ctx.fillRect(h.x, h.y, h.w, h.h);
    }
  }

  // Draw player
  ctx.fillStyle = "#7df9ff";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
  ctx.fill();

  // HUD - score
  ctx.fillStyle = "#e6e6f0";
  ctx.font = "16px ui-sans-serif, system-ui";
  ctx.textAlign = "left";
  ctx.fillText(`Score ${score}`, 12, 22);

  // Game Over overlay
  if (phase === "gameover") {
    ctx.fillStyle = "rgba(10,10,15,0.7)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff52ae";
    ctx.font = "44px ui-sans-serif, system-ui";
    ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillStyle = "#e6e6f0";
    ctx.font = "20px ui-sans-serif, system-ui";
    ctx.fillText(`Final score ${score}`, canvas.width / 2, canvas.height / 2 + 14);
    ctx.fillStyle = "#a5a5b8";
    ctx.font = "16px ui-sans-serif, system-ui";
    ctx.fillText("Press R or click Restart", canvas.width / 2, canvas.height / 2 + 42);
  }
}

// === OBSERVABLE CONTRACT ==============================================
function publishState() {
  const playerVisible = player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height;
  window.__game = {
    state: phase === "playing" ? "playing" : (phase === "gameover" ? "gameover" : "menu"),
    score: score,
    player: {
      x: player.x,
      y: player.y,
      visible: playerVisible,
    },
    objective: "Dodge obstacles by reversing the orbit direction.",
  };
}

function startLoop() {
  if (loopId !== null) cancelAnimationFrame(loopId);
  function tick(now) {
    try {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      update(dt);
      render();
      publishState();
    } catch (err) {
      console.error('loop error', err);
    }
    loopId = requestAnimationFrame(tick);
  }
  loopId = requestAnimationFrame(tick);
}

// Initialize observable state
publishState();

// Start the game loop
startLoop();
</script>
</body>
</html>
