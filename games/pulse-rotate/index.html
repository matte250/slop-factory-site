<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pulse Rotate</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Pulse Rotate</h1>
    <p class="game-description">The dot orbits a center; taps emit pulses that expand its orbit to leap over rotating barriers.</p>
    <ul class="game-controls">
      <li>Tap / click to emit a pulse</li>
      <li>Press R or click Restart to restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === SECTION =============================================================
// CONFIG (placeholder values)
let audioCtx = null;
function beep(freq, durSec) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + durSec);
  } catch (e) {
    // audio init may fail in some browsers
  }
}
const ORBIT_RADIUS = 100;
const ORBIT_SPEED = 0.5; // radians per second
const SAFE_RADIUS = 80;
const HAZARD_RADIUS = 8;
const HAZARD_SPEED = 180; // px/sec
const SPAWN_INTERVAL = 1.5; // seconds

// === STATE ==============================================================
let player = { x: 0, y: 0, vx: 0, vy: 0 };
let hazards = [];
let score = 0;
let phase = 'playing';
let keys = new Set();
let spawnTimer = SPAWN_INTERVAL;
let lastTime = performance.now();
let loopId = null;

// === LOOP =============================================================
function startLoop() {
  if (loopId !== null) cancelAnimationFrame(loopId);
  function tick(now) {
    try {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      update(dt);
      render();
      publishState();
    } catch (err) {
      console.error('loop error', err);
    }
    loopId = requestAnimationFrame(tick);
  }
  loopId = requestAnimationFrame(tick);
}

// === UPDATE =============================================================
function update(dt) {
  if (phase !== 'playing') return;
  // Increment score over time
  score = Math.floor(score + dt * 10); // 10 points per second

  if (phase !== 'playing') return;
  // Player movement with acceleration, friction, max speed, and bounds
  const ACCEL = 300; // px/sec^2
  const MAX_SPEED = 400; // px/sec
  const FRICTION = 0.9;
  // Horizontal movement (A/D or ArrowLeft/ArrowRight)
  if (keys.has('ArrowRight') || keys.has('d') || keys.has('D')) player.vx += ACCEL * dt;
  if (keys.has('ArrowLeft') || keys.has('a') || keys.has('A')) player.vx -= ACCEL * dt;
  // Apply friction
  player.vx *= FRICTION;
  // Clamp speed
  if (player.vx > MAX_SPEED) player.vx = MAX_SPEED;
  if (player.vx < -MAX_SPEED) player.vx = -MAX_SPEED;
  // Update position
  player.x += player.vx * dt;
  // Keep within canvas bounds
  const margin = 5;
  if (player.x < margin) { player.x = margin; player.vx = 0; }
  if (player.x > canvas.width - margin) { player.x = canvas.width - margin; player.vx = 0; }
  // Keep angle for orbit placeholder (if needed)
  player.angle = Math.atan2(player.y - canvas.height/2, player.x - canvas.width/2);
  // Collision detection with hazards
  for (const h of hazards) {
    const dx = player.x - h.x;
    const dy = player.y - h.y;
    const dist2 = dx*dx + dy*dy;
    if (dist2 < (HAZARD_RADIUS + 5)*(HAZARD_RADIUS + 5)) { // player radius 5
      phase = 'gameover';
      // stop loop by not calling further updates; startLoop will continue but no update actions
      break;
    }
  }
}

// === RENDER =============================================================
function render() {
  // Clear canvas
  ctx.fillStyle = '#0f1320';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw hazards
  ctx.fillStyle = '#ff52ae'; // high contrast hazard color
  for (const h of hazards) {
    ctx.beginPath();
    ctx.arc(h.x, h.y, HAZARD_RADIUS, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw orbit path
  ctx.strokeStyle = '#7df9ff';
  ctx.beginPath();
  ctx.arc(canvas.width/2, canvas.height/2, ORBIT_RADIUS, 0, Math.PI*2);
  ctx.stroke();

  // Draw player dot
  const x = player.x;
  const y = player.y;
  ctx.fillStyle = '#ff00aa';
  ctx.beginPath();
  ctx.arc(x, y, 5, 0, Math.PI*2);
  ctx.fill();

  // Draw HUD (score)
  ctx.fillStyle = '#e6e6f0';
  ctx.font = '16px ui-sans-serif, system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('Score ' + score, 10, 20);

  // Game over overlay
  if (phase !== 'playing') {
    ctx.fillStyle = 'rgba(10,10,15,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff52ae';
    ctx.textAlign = 'center';
    ctx.font = '44px ui-sans-serif, system-ui';
    ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 20);
    ctx.fillStyle = '#e6e6f0';
    ctx.font = '20px ui-sans-serif, system-ui';
    ctx.fillText('Final score ' + score, canvas.width/2, canvas.height/2 + 14);
    ctx.fillStyle = '#a5a5b8';
    ctx.font = '16px ui-sans-serif, system-ui';
    ctx.fillText('Press R or click Restart', canvas.width/2, canvas.height/2 + 42);
  }
}


// === INPUT =============================================================
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
  keys.add(ev.key);
});
document.addEventListener('keyup', (ev) => { keys.delete(ev.key); });
// restart button already handled earlier

// === BOOT =============================================================
function reset() {
  // initialize canvas-dependent state
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;
  player.vx = 0; player.vy = 0;
  hazards = [];
  score = 0;
  phase = 'playing';
  spawnTimer = SPAWN_INTERVAL;
  lastTime = performance.now();
  publishState();
  startLoop();
}

function publishState() {
  const visible = player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height;
  window.__game = {
    state: phase === 'playing' ? 'playing' : 'gameover',
    score,
    player: { x: player.x, y: player.y, visible },
    objective: 'Emit pulses to expand orbit and pass barriers.',
  };
}

// Canvas init
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
// initial clear
ctx.fillStyle = '#0f1320';
ctx.fillRect(0, 0, canvas.width, canvas.height);

// start game
reset();
    document.addEventListener('keydown', (ev) => { if (ev.key === 'r' || ev.key === 'R') reset(); });
    document.getElementById('restart').addEventListener('click', reset);
  </script>
</body>
</html>
