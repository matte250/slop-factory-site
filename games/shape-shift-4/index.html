<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shape Shift</title>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #0a0a0f; color: #e6e6f0; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 20px; color: #7df9ff; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Shape Shift</h1>
    <p class="game-description">A dot constantly moves forward; tap to cycle its shape (circle, square, triangle) to match passing gate cutouts and survive as long as possible.</p>
    <ul class="game-controls">
      <li>Tap (Space) to change shape</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const PLAYER_RADIUS = 10;
    const PLAYER_COLOR = "#ff00aa"; // neon magenta
    const PLAYER_SPEED = 200; // px/sec forward
    const PLAYER_START_X = 400;
    const PLAYER_START_Y = 550; // near bottom
    const SHAPE_KEYS = [" "]; // space for shape change
    const SHAPES = ["circle", "square", "triangle"];
    const HAZARD_SPEED = 150; // px/sec toward player
    const HAZARD_SPAWN_INTERVAL = 1.5; // seconds
    const HAZARD_SIZE = 30; // size of hazard shape
    const SAFE_RADIUS = 200; // avoid spawning near player start
    const MAX_DT = 0.1; // seconds

    // === STATE ==============================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restart");

    let player = null; // { x, y, shapeIdx }
    let hazards = null; // array of { x, y, shapeIdx }
    let score = null;
    let phase = null; // "playing" | "gameover"
    let keys = null; // Set of pressed keys
    let lastTime = null;
    let loopId = null;
    let audioCtx = null;
    let spawnTimer = null;

    // === RESET ==============================================================
    function reset() {
      player = { x: PLAYER_START_X, y: PLAYER_START_Y, shapeIdx: 0 };
      hazards = [];
      score = 0;
      phase = "playing";
      keys = new Set();
      lastTime = performance.now();
      spawnTimer = HAZARD_SPAWN_INTERVAL;
      publishState();
      startLoop();
    }

    // === INPUT ==============================================================
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "r" || ev.key === "R") { reset(); return; }
      if (ev.key === " ") {
        // Cycle shape on space press
        if (player) player.shapeIdx = (player.shapeIdx + 1) % SHAPES.length;
      }
      keys.add(ev.key);
    });
    document.addEventListener("keyup", (ev) => { keys.delete(ev.key); });
    restartBtn.addEventListener("click", reset);

    // === AUDIO (lazy) =======================================================
    function beep(freq, durSec) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durSec);
      } catch {}
    }

    // === LOOP / UPDATE ======================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, MAX_DT);
          lastTime = now;
          update(dt);
          render();
          publishState();
        } catch (err) {
          console.error("loop error", err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    function update(dt) {
      if (phase !== "playing") return;
      // Auto‑advance forward (upwards)
      player.y -= PLAYER_SPEED * dt;
      if (player.y < PLAYER_RADIUS) player.y = PLAYER_RADIUS;

      // Spawn hazards
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnHazard();
        spawnTimer = HAZARD_SPAWN_INTERVAL;
      }

      // Move hazards downwards
      for (const h of hazards) {
        h.y += HAZARD_SPEED * dt;
      }
      // Remove off‑screen hazards
      hazards = hazards.filter(h => h.y - HAZARD_SIZE < canvas.height);

      // Collision detection
      for (const h of hazards) {
        const dx = Math.abs(player.x - h.x);
        const dy = Math.abs(player.y - h.y);
        const limit = PLAYER_RADIUS + HAZARD_SIZE / 2;
        if (dx < limit && dy < limit) {
          if (h.shapeIdx !== player.shapeIdx) {
            phase = "gameover";
            beep(110, 0.3);
            return;
          } else {
            score += 10;
            beep(440, 0.1);
            // Remove this hazard
            hazards = hazards.filter(x => x !== h);
            break;
          }
        }
      }
    }

    function spawnHazard() {
      const shapeIdx = Math.floor(Math.random() * SHAPES.length);
      const minX = PLAYER_RADIUS;
      const maxX = canvas.width - PLAYER_RADIUS;
      let x = Math.random() * (maxX - minX) + minX;
      // Ensure safe distance from player start
      if (Math.abs(x - player.x) < SAFE_RADIUS) {
        if (x > canvas.width / 2) x += SAFE_RADIUS;
        else x -= SAFE_RADIUS;
        x = Math.max(minX, Math.min(maxX, x));
      }
      const y = -HAZARD_SIZE; // start off‑screen
      hazards.push({ x, y, shapeIdx });
    }

    // === RENDER ==============================================================
    function render() {
      // Clear background
      ctx.fillStyle = "#0f1320";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Hazards
      for (const h of hazards) {
        ctx.fillStyle = "#7df9ff";
        const half = HAZARD_SIZE / 2;
        ctx.save();
        ctx.translate(h.x, h.y);
        switch (SHAPES[h.shapeIdx]) {
          case "circle":
            ctx.beginPath();
            ctx.arc(0, 0, half, 0, Math.PI * 2);
            ctx.fill();
            break;
          case "square":
            ctx.fillRect(-half, -half, HAZARD_SIZE, HAZARD_SIZE);
            break;
          case "triangle":
            ctx.beginPath();
            ctx.moveTo(0, -half);
            ctx.lineTo(half, half);
            ctx.lineTo(-half, half);
            ctx.closePath();
            ctx.fill();
            break;
        }
        ctx.restore();
      }

      // Player
      ctx.fillStyle = PLAYER_COLOR;
      ctx.save();
      ctx.translate(player.x, player.y);
      const r = PLAYER_RADIUS;
      switch (SHAPES[player.shapeIdx]) {
        case "circle":
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.fill();
          break;
        case "square":
          ctx.fillRect(-r, -r, r * 2, r * 2);
          break;
        case "triangle":
          ctx.beginPath();
          ctx.moveTo(0, -r);
          ctx.lineTo(r, r);
          ctx.lineTo(-r, r);
          ctx.closePath();
          ctx.fill();
          break;
      }
      ctx.restore();

      // HUD – score and shape name
      ctx.fillStyle = "#e6e6f0";
      ctx.font = "16px ui-sans-serif, system-ui";
      ctx.textAlign = "left";
      ctx.fillText(`Score ${score}`, 12, 22);
      ctx.textAlign = "right";
      ctx.fillText(`Shape ${SHAPES[player.shapeIdx]}`, canvas.width - 12, 22);

      // Game‑over overlay
      if (phase === "gameover") {
        ctx.fillStyle = "rgba(10,10,15,0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff52ae";
        ctx.textAlign = "center";
        ctx.font = "44px ui-sans-serif, system-ui";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = "20px ui-sans-serif, system-ui";
        ctx.fillText(`Final score ${score}`, canvas.width / 2, canvas.height / 2 + 14);
        ctx.font = "16px ui-sans-serif, system-ui";
        ctx.fillText("Press R or click Restart", canvas.width / 2, canvas.height / 2 + 44);
      }
    }

    // === OBSERVABLE CONTRACT ================================================
    function publishState() {
      window.__game = {
        state: phase === "playing" ? "playing" : "gameover",
        score,
        player: {
          x: player.x,
          y: player.y,
          visible: player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height,
        },
        objective: "Tap to cycle shape and pass matching cutouts; survive as long as possible.",
      };
    }

    // === BOOT ===============================================================
    reset();
  </script>
</body>
</html>
