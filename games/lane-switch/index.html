<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lane Switch</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; image-rendering: pixelated; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Lane Switch</h1>
    <p class="game-description">An auto-advancing dot moves down a three-lane tunnel; tap to shift the dot to the next lane and thread through gaps.</p>
    <ul class="game-controls">
      <li>Tap or click to shift lane</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
// === CONFIG =============================================================
const CANVAS_WIDTH = 800;
const CANVAS_HEIGHT = 600;
const LANE_COUNT = 3;
const LANE_WIDTH = CANVAS_WIDTH / LANE_COUNT;
const PLAYER_RADIUS = 8;
const PLAYER_SPEED = 200; // pixels per second

// === STATE ==============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const restartBtn = document.getElementById('restart');

let player = { lane: 0, x: LANE_WIDTH / 2, y: 0 };
let score = 0;
let phase = 'playing';
let lastTime = performance.now();
let loopId = null;
let keys = new Set();
let audioCtx = null;

// === RESET ==============================================================
function reset() {
  player.lane = 0;
  player.x = LANE_WIDTH / 2;
  player.y = 0;
  score = 0;
  phase = 'playing';
  lastTime = performance.now();
  publishState();
  startLoop();
}

// === LOOP ==============================================================
function startLoop() {
  if (loopId !== null) cancelAnimationFrame(loopId);
  function tick(now) {
    try {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      update(dt);
      render();
      publishState();
    } catch (err) {
      console.error('loop error', err);
    }
    loopId = requestAnimationFrame(tick);
  }
  loopId = requestAnimationFrame(tick);
}

// === UPDATE ==============================================================
function update(dt) {
  if (phase !== 'playing') return;
  // Apply lane shift input
  if (keys.has('shift')) {
    player.lane = (player.lane + 1) % LANE_COUNT;
    player.x = player.lane * LANE_WIDTH + LANE_WIDTH / 2;
    keys.delete('shift');
  }
  // Advance player downwards
  player.y += PLAYER_SPEED * dt;
  if (player.y > CANVAS_HEIGHT) {
    player.y = 0;
    score++;
    beep(660, 0.05);
  }
}

// === RENDER ==============================================================
function render() {
  // Clear background
  ctx.fillStyle = '#0f1320';
  ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
  // Draw player dot
  ctx.fillStyle = '#ff00aa';
  ctx.beginPath();
  ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
  ctx.fill();
  // HUD: score
  ctx.fillStyle = '#e6e6f0';
  ctx.font = '16px ui-sans-serif, system-ui';
  ctx.textAlign = 'left';
  ctx.fillText(`Score ${score}`, 12, 22);
}

// === INPUT ==============================================================
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
  if (phase !== 'playing') return;
  // any other key triggers lane shift
  if (!keys.has('shift')) keys.add('shift');
});

document.addEventListener('mousedown', (ev) => {
  if (phase !== 'playing') return;
  keys.add('shift');
});

restartBtn.addEventListener('click', reset);

// === AUDIO (lazy) =======================================================
function beep(freq, durSec) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + durSec);
  } catch { }
}

// === OBSERVABLE CONTRACT ===============================================
function publishState() {
  window.__game = {
    state: phase,
    score,
    player: {
      x: player.x,
      y: player.y,
      visible: player.x >= 0 && player.x < CANVAS_WIDTH && player.y >= 0 && player.y < CANVAS_HEIGHT,
    },
    objective: 'Tap to shift lane and survive as long as possible.',
  };
}

// === BOOT ================================================================
reset();
  </script>
</body>
</html>
