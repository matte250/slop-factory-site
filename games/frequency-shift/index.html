<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frequency Shift</title>
  <style>
    body { margin:0; background:#0a0a0f; color:#e6e6f0; font-family:ui-sans-serif,system-ui,sans-serif; }
    .game-header { padding:12px 16px; border-bottom:1px solid #1d1d2a; }
    .game-header h1 { margin:0; font-size:18px; color:#7df9ff; }
    .game-header .game-description { margin:4px 0; color:#a5a5b8; }
    .game-header .game-controls { margin:4px 0; padding-left:18px; color:#c8c8d8; }
    main { display:flex; flex-direction:column; align-items:center; padding:16px; }
    canvas { background:#0f1320; border:1px solid #2a2f44; image-rendering:pixelated; }
    .game-restart { margin-top:10px; padding:8px 14px; background:#1c2030; color:#7df9ff; border:1px solid #2a2f44; cursor:pointer; }
    .game-restart:hover { background:#232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Frequency Shift</h1>
    <p class="game-description">A moving dot changes its resonance frequency with each tap; only barriers tuned to the current frequency let it pass. Time your taps to survive.</p>
    <ul class="game-controls">
      <li>Tap (Space or click) to cycle frequency</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
  // === CONFIG =============================================================
  const CANVAS_W = 800;
  const CANVAS_H = 600;
  const PLAYER_RADIUS = 8;
  const PLAYER_SPEED = 150; // pixels per second (forward movement simulated by moving obstacles left)
  const SPAWN_INTERVAL = 1.2; // seconds between barriers
  const SAFE_RADIUS = 200; // pixels, first 3‑second safety zone
  const FREQUENCIES = ["low", "mid", "high"]; // textual names for debug / color mapping
  const FREQ_COLORS = ["#ff5e5e", "#ffdd57", "#7df9ff"];

  // === STATE ==============================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const restartBtn = document.getElementById('restart');

  let player = { x: CANVAS_W * 0.2, y: CANVAS_H / 2, freq: 0 };
  let obstacles = []; // each { x, y, w, h, freq }
  let score = 0;
  let highScore = 0;
  let spawnTimer = SPAWN_INTERVAL;
  let lastTime = performance.now();
  let loopId = null;
  let audioCtx = null;
  let keys = new Set(); // tracks pressed keys for polling
  let phase = 'menu'; // "menu" | "playing" | "gameover"

  // === RESET ==============================================================
  function reset() {
    player.x = CANVAS_W * 0.2;
    player.y = CANVAS_H / 2;
    player.freq = 0;
    obstacles = [];
    score = 0;
    spawnTimer = SPAWN_INTERVAL;
    phase = 'playing';
    lastTime = performance.now();
    publishState();
    startLoop();
  }

  // === LOOP ===============================================================
  function startLoop() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    function tick(now) {
      try {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        update(dt);
        render();
        publishState();
      } catch (e) {
        console.error('loop error', e);
      }
      loopId = requestAnimationFrame(tick);
    }
    loopId = requestAnimationFrame(tick);
  }

  // === UPDATE =============================================================
  function update(dt) {
    if (phase !== 'playing') return;

    // handle input (space or click cycles frequency)
    if (keys.has('Space')) {
      player.freq = (player.freq + 1) % FREQUENCIES.length;
      beep(440 + player.freq * 200, 0.08);
      keys.delete('Space'); // consume so one press = one cycle
    }

    // move obstacles leftwards
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const ob = obstacles[i];
      ob.x -= PLAYER_SPEED * dt;
      // check collision
      const dx = ob.x - player.x;
      const dy = ob.y - player.y;
      const distSq = dx * dx + dy * dy;
      if (distSq < (PLAYER_RADIUS + Math.max(ob.w, ob.h) / 2) ** 2) {
        if (ob.freq !== player.freq) {
          gameOver();
          return;
        } else {
          // correct pass – score and remove obstacle
          score++;
          beep(880, 0.05);
          obstacles.splice(i, 1);
        }
      } else if (ob.x + ob.w < 0) {
        // passed without collision (should have matched frequency)
        obstacles.splice(i, 1);
      }
    }

    // spawn new obstacles
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer = SPAWN_INTERVAL;
      spawnObstacle();
    }
  }

  function spawnObstacle() {
    const w = 20; // barrier thickness
    const h = 120; // height
    const y = Math.random() * (CANVAS_H - h) + h / 2;
    const freq = Math.floor(Math.random() * FREQUENCIES.length);
    // ensure safe spawn: keep out of SAFE_RADIUS from player for first 3 seconds
    const startX = CANVAS_W + SAFE_RADIUS;
    obstacles.push({ x: startX, y, w, h, freq });
  }

  function gameOver() {
    phase = 'gameover';
    if (score > highScore) highScore = score;
    beep(120, 0.2);
  }

  // === RENDER =============================================================
  function render() {
    // background
    ctx.fillStyle = '#0f1320';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // draw obstacles (color based on frequency)
    obstacles.forEach(ob => {
      ctx.fillStyle = FREQ_COLORS[ob.freq];
      ctx.fillRect(ob.x, ob.y - ob.h / 2, ob.w, ob.h);
    });

    // draw player (glowing circle)
    ctx.beginPath();
    ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = FREQ_COLORS[player.freq];
    ctx.fill();

    // HUD
    ctx.fillStyle = '#e6e6f0';
    ctx.font = '16px ui-sans-serif, system-ui';
    ctx.textAlign = 'left';
    ctx.fillText('Score ' + score, 12, 22);
    ctx.textAlign = 'right';
    ctx.fillText('Best ' + highScore, CANVAS_W - 12, 22);
    ctx.textAlign = 'center';
    ctx.font = '14px ui-sans-serif, system-ui';
    ctx.fillText('Freq: ' + FREQUENCIES[player.freq].toUpperCase(), CANVAS_W / 2, 22);

    if (phase === 'gameover') {
      ctx.fillStyle = 'rgba(10,10,15,0.7)';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = '#ff5e5e';
      ctx.font = '44px ui-sans-serif, system-ui';
      ctx.fillText('Game Over', CANVAS_W / 2, CANVAS_H / 2 - 20);
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '20px ui-sans-serif, system-ui';
      ctx.fillText('Final score ' + score + (score === highScore && score > 0 ? ' — new best!' : ''), CANVAS_W / 2, CANVAS_H / 2 + 16);
      ctx.fillStyle = '#a5a5b8';
      ctx.font = '16px ui-sans-serif, system-ui';
      ctx.fillText('Press R or click Restart', CANVAS_W / 2, CANVAS_H / 2 + 44);
    }
  }

  // === INPUT ==============================================================
  document.addEventListener('keydown', ev => {
    if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
    if (phase !== 'playing') return;
    if (ev.code === 'Space') {
      keys.add('Space');
    }
  });
  document.addEventListener('keyup', ev => {
    if (ev.code === 'Space') {
      keys.delete('Space');
    }
  });
  // mouse click also cycles frequency
  canvas.addEventListener('mousedown', ev => {
    if (phase !== 'playing') return;
    keys.add('Space');
  });
  canvas.addEventListener('mouseup', ev => {
    keys.delete('Space');
  });
  restartBtn.addEventListener('click', reset);

  // === AUDIO ===============================================================
  function beep(freq, durSec) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durSec);
    } catch (e) { /* silent fail */ }
  }

  // === OBSERVABLE CONTRACT ===============================================
  function publishState() {
    const visible = player.x >= 0 && player.x <= CANVAS_W && player.y >= 0 && player.y <= CANVAS_H;
    window.__game = {
      state: phase,
      score,
      player: {
        x: player.x,
        y: player.y,
        visible,
      },
      objective: 'Cycle frequency to match barriers and survive.'
    };
  }

  // === BOOT ===============================================================
  reset();
  </script>
</body>
</html>
