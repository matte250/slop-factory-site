<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wall Stick</title>
  <style>
    body {margin:0;background:#0a0a0f;color:#fff;font-family:sans-serif;overflow:hidden;}
    .game-header {padding:1rem;}
    .game-header h1 {margin:0;font-size:1.5rem;}
    .game-header p {margin:0.5rem 0;}
    .game-controls {margin:0;padding:0;list-style:none;}
    .game-restart {position:absolute;top:1rem;right:1rem;padding:0.5rem 1rem;background:#7df9ff;color:#000;border:none;cursor:pointer;}
    canvas {display:block;background:#111;}
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Wall Stick</h1>
    <p class="game-description">A dot moves forward automatically; tap to cling to the nearest wall, slide vertically, and avoid gaps and hazards.</p>
    <ul class="game-controls">
      <li>Tap / Click to cling to a wall</li>
      <li>Arrow keys to move while clinging</li>
      <li>Press R or click Restart to reset</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // ---------- Constants ----------
    const CANVAS_W = 800;
    const CANVAS_H = 600;
    const PLAYER_RADIUS = 10;
    const PLAYER_SPEED_X = 200; // px/s forward
    const CLING_DURATION = 1.5; // seconds
    const CLING_SPEED_Y = 150; // vertical speed while clinging
    const HAZARD_SPEED = 150; // px/s leftward
    const SPAWN_INTERVAL = 2; // seconds
    const SAFE_RADIUS = 200; // initial safe radius
    const MAX_DT = 0.1; // clamp dt

    // ---------- State ----------
    let canvas, ctx;
    let loopId = null;
    let lastTime = performance.now();
    let spawnTimer = 0;
    let elapsed = 0;
    let player = {
      x: 100,
      y: CANVAS_H/2,
      vx: PLAYER_SPEED_X,
      vy: 0,
      clinging: false,
      clingTimer: 0,
      visible: true,
    };
    let hazards = [];
    let score = 0;
    let state = "playing"; // menu not used in this simple game
    // Expose observable object
    window.__game = {
      state: state,
      score: score,
      player: {x: player.x, y: player.y, visible: player.visible},
      objective: "Cling to walls to avoid hazards and survive as long as possible."
    };
    // ---------- Helper Functions ----------
    function resetGame(){
      if (loopId!==null) cancelAnimationFrame(loopId);
      player.x = 100;
      player.y = CANVAS_H/2;
      player.vx = PLAYER_SPEED_X;
      player.vy = 0;
      player.clinging = false;
      player.clingTimer = 0;
      player.visible = true;
      hazards = [];
      spawnTimer = 0;
      elapsed = 0;
      score = 0;
      state = "playing";
      updateObservable();
      lastTime = performance.now();
      loopId = requestAnimationFrame(loop);
    }
    function updateObservable(){
      window.__game.state = state;
      window.__game.score = Math.floor(score);
      window.__game.player.x = player.x;
      window.__game.player.y = player.y;
      window.__game.player.visible = player.visible;
    }
    function spawnHazard(){
      // spawn at right edge, random y
      const y = Math.random() * (CANVAS_H - 30) + 15;
      // ensure safe distance from player for first 3 seconds
      if (elapsed < 3){
        const dx = (CANVAS_W + 20) - player.x;
        const timeToReach = dx / (HAZARD_SPEED + player.vx);
        if (dx < SAFE_RADIUS && timeToReach < 3) return; // skip this spawn
      }
      hazards.push({x: CANVAS_W + 20, y, w: 20, h: 20});
    }
    function rectCircleCollide(cx, cy, r, rx, ry, rw, rh){
      const closestX = Math.max(rx, Math.min(cx, rx+rw));
      const closestY = Math.max(ry, Math.min(cy, ry+rh));
      const dx = cx - closestX;
      const dy = cy - closestY;
      return (dx*dx + dy*dy) < r*r;
    }
    function gameOver(){
      state = "gameover";
      updateObservable();
    }
    // ---------- Input ----------
    function onKey(e){
      if (e.code === "KeyR") resetGame();
    }
    function onClick(){
      if (state !== "playing") return;
      // cling to nearest vertical wall
      const leftDist = player.x;
      const rightDist = CANVAS_W - player.x;
      if (leftDist < rightDist) {
        player.x = PLAYER_RADIUS; // stick to left
      } else {
        player.x = CANVAS_W - PLAYER_RADIUS; // right wall
      }
      player.clinging = true;
      player.clingTimer = 0;
      player.vx = 0;
    }
    function onArrow(e){
      if (!player.clinging) return;
      if (e.code === "ArrowUp") player.vy = -CLING_SPEED_Y;
      else if (e.code === "ArrowDown") player.vy = CLING_SPEED_Y;
    }
    function onArrowUp(e){
      if (!player.clinging) return;
      if (e.code === "ArrowUp" || e.code === "ArrowDown") player.vy = 0;
    }
    // ---------- Main Loop ----------
    function loop(now){
      try {
        const dt = Math.min((now - lastTime)/1000, MAX_DT);
        lastTime = now;
        if (state === "playing") {
          // update
          elapsed += dt;
          score = elapsed;
          // player movement
          player.x += player.vx * dt;
          player.y += player.vy * dt;
          // keep inside bounds vertically
          if (player.y < PLAYER_RADIUS) player.y = PLAYER_RADIUS;
          if (player.y > CANVAS_H - PLAYER_RADIUS) player.y = CANVAS_H - PLAYER_RADIUS;
          // cling timer
          if (player.clinging) {
            player.clingTimer += dt;
            if (player.clingTimer >= CLING_DURATION) {
              player.clinging = false;
              player.vx = PLAYER_SPEED_X;
              player.vy = 0;
            }
          }
          // hazards
          spawnTimer -= dt;
          if (spawnTimer <= 0){
            spawnHazard();
            spawnTimer = SPAWN_INTERVAL;
          }
          for (let i = hazards.length-1; i>=0; i--){
            const h = hazards[i];
            h.x -= HAZARD_SPEED * dt;
            if (h.x + h.w < 0) hazards.splice(i,1);
            else if (rectCircleCollide(player.x, player.y, PLAYER_RADIUS, h.x, h.y, h.w, h.h)) {
              player.visible = false;
              gameOver();
            }
          }
        }
        // render
        ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
        // draw player
        if (player.visible){
          ctx.fillStyle = "#7df9ff";
          ctx.beginPath();
          ctx.arc(player.x, player.y, PLAYER_RADIUS,0,Math.PI*2);
          ctx.fill();
        }
        // draw hazards
        ctx.fillStyle = "#ff00aa";
        hazards.forEach(h=>{ctx.fillRect(h.x, h.y, h.w, h.h);});
        // draw score
        ctx.fillStyle = "#ffd23f";
        ctx.font = "20px sans-serif";
        ctx.fillText(`Score: ${Math.floor(score)}` , 10, 30);
        // game over overlay
        if (state === "gameover"){
          ctx.fillStyle = "rgba(0,0,0,0.7)";
          ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
          ctx.fillStyle = "#fff";
          ctx.textAlign = "center";
          ctx.font = "30px sans-serif";
          ctx.fillText("Game Over", CANVAS_W/2, CANVAS_H/2 - 20);
          ctx.font = "20px sans-serif";
          ctx.fillText(`Score: ${Math.floor(score)}` , CANVAS_W/2, CANVAS_H/2 + 10);
          ctx.fillText("Press R or click Restart", CANVAS_W/2, CANVAS_H/2 + 40);
        }
        updateObservable();
      } catch(e){
        console.error(e);
      }
      loopId = requestAnimationFrame(loop);
    }
    // ---------- Init ----------
    function init(){
      canvas = document.getElementById('game');
      ctx = canvas.getContext('2d');
      // Input listeners
      window.addEventListener('keydown', onKey);
      window.addEventListener('keydown', onArrow);
      window.addEventListener('keyup', onArrowUp);
      canvas.addEventListener('click', onClick);
      document.getElementById('restart').addEventListener('click', resetGame);
      resetGame();
    }
    // start after DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
