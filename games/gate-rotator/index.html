<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gate Rotator</title>
  <style>
    body { margin:0; background:#0a0a0f; color:#fff; font-family:sans-serif; overflow:hidden; }
    .game-header { padding:0.5rem 1rem; }
    .game-header h1 { margin:0; font-size:1.5rem; }
    .game-header p { margin:0.2rem 0; }
    .game-controls { list-style:none; padding:0; margin:0; font-size:0.9rem; }
    .game-restart { position:absolute; top:1rem; right:1rem; padding:0.4rem 0.8rem; background:#7df9ff; color:#000; border:none; cursor:pointer; }
    canvas { display:block; margin:auto; background:#111; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Gate Rotator</h1>
    <p class="game-description">An auto‑scrolling tunnel with rotating gate segments; tap to rotate gates and align the opening for the dot to pass through.</p>
    <ul class="game-controls">
      <li>Tap or click or Space to rotate</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // ----- Configuration -----
    const CANVAS_W = 800, CANVAS_H = 600;
    const PLAYER_RADIUS = 6;
    const GATE_THICK = 20;
    const OPENING_W = 120;
    const SCROLL_SPEED = 150; // px/s
    const SPAWN_INTERVAL = 1.5; // seconds
    const SAFE_RADIUS = 200;
    const MAX_LIVES = 3;

    // ----- State -----
    let ctx, loopId = null;
    const player = { x: 400, y: 550, vx: 0, vy: 0, orientation: 0, lives: MAX_LIVES, score: 0 };
    let gates = [];
    let spawnTimer = SPAWN_INTERVAL;
    let globalOri = 0; // 0,1,2,3 -> multiples of 90°
    let state = "playing"; // menu | playing | gameover

    // Observable contract
    window.__game = {
      state: "menu",
      score: 0,
      player: { x: player.x, y: player.y, visible: true },
      objective: "Rotate tunnels to let the dot pass through openings while surviving as long as possible."
    };

    function resetGame() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      player.x = 400; player.y = 550; player.lives = MAX_LIVES; player.score = 0; player.orientation = 0;
      globalOri = 0; gates = []; spawnTimer = SPAWN_INTERVAL; state = "playing";
      updateObservable();
      loopId = requestAnimationFrame(loop);
    }

    function updateObservable(){
      window.__game.state = state;
      window.__game.score = player.score;
      window.__game.player.x = player.x;
      window.__game.player.y = player.y;
      window.__game.player.visible = true; // always on screen in this simple game
    }

    function spawnGate(){
      // gates inherit current global orientation
      gates.push({ y: -GATE_THICK, ori: globalOri });
    }

    function rotate(){
      globalOri = (globalOri + 1) & 3; // mod 4
    }

    function handleInput(e){
      if (state !== "playing") return;
      if (e.type === "keydown"){
        if (e.code === "Space") { rotate(); }
        if (e.code === "KeyR") { resetGame(); }
      } else if (e.type === "pointerdown"){
        rotate();
      }
    }

    function gameOver(){
      state = "gameover";
      updateObservable();
    }

    function loop(timestamp){
      if (!loop.last) loop.last = timestamp;
      const dt = Math.min((timestamp - loop.last) / 1000, 0.1);
      loop.last = timestamp;

      // update gates
      spawnTimer -= dt;
      if (spawnTimer <= 0){ spawnGate(); spawnTimer += SPAWN_INTERVAL; }
      for (let g of gates) g.y += SCROLL_SPEED * dt;
      // remove off‑screen gates
      gates = gates.filter(g => g.y < CANVAS_H + GATE_THICK);

      // collision / scoring when gate passes player.y
      for (let g of gates){
        const passed = (g.y + GATE_THICK) >= player.y && (g.y) <= player.y;
        if (passed && !g.checked){
          g.checked = true;
          // Determine opening range based on gate orientation
          const openingCenter = CANVAS_W/2; // always centered horizontally
          const openingMin = openingCenter - OPENING_W/2;
          const openingMax = openingCenter + OPENING_W/2;
          // If gate orientation is 0 or 2 (horizontal bar), opening is vertical slit -> player passes if x inside opening
          // If orientation is 1 or 3 (vertical bar), opening is horizontal slit -> player passes if y inside opening (but player y is fixed, treat as always pass)
          let safe = false;
          if (g.ori % 2 === 0){ // horizontal bar, opening vertical
            safe = (player.x >= openingMin && player.x <= openingMax);
          } else { // vertical bar, opening horizontal (player y is near bottom, opening at center vertically)
            const openingYCenter = CANVAS_H/2;
            const openingYMin = openingYCenter - OPENING_W/2;
            const openingYMax = openingYCenter + OPENING_W/2;
            safe = (player.y >= openingYMin && player.y <= openingYMax);
          }
          if (safe){
            player.score++;
          } else {
            player.lives--;
            if (player.lives <= 0) gameOver();
          }
        }
      }

      // render
      ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
      // background
      ctx.fillStyle = "#0a0a0f";
      ctx.fillRect(0,0,CANVAS_W,CANVAS_H);

      // draw gates
      ctx.fillStyle = "#7df9ff";
for (let g of gates){
          if (g.ori % 2 === 0){ // horizontal bar
            const openingCenter = CANVAS_W/2;
            const openingMin = openingCenter - OPENING_W/2;
            const openingMax = openingCenter + OPENING_W/2;
            // draw left part
            ctx.fillRect(0, g.y, openingMin, GATE_THICK);
            // right part
            ctx.fillRect(openingMax, g.y, CANVAS_W - openingMax, GATE_THICK);
          } else { // vertical bar
            const openingYCenter = CANVAS_H/2;
            const openingYMin = openingYCenter - OPENING_W/2;
            const openingYMax = openingYCenter + OPENING_W/2;
            ctx.fillRect(g.y, 0, GATE_THICK, openingYMin);
            ctx.fillRect(g.y, openingYMax, GATE_THICK, CANVAS_H - openingYMax);
          }
        }

      // draw player
      ctx.fillStyle = "#ff00aa";
      ctx.beginPath();
      ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI*2);
      ctx.fill();

      // UI overlay
      ctx.fillStyle = "#fff";
      ctx.font = "16px sans-serif";
      ctx.fillText(`Score: ${player.score}` , 10, 20);
      ctx.fillText(`Lives: ${player.lives}` , 10, 40);

      if (state === "gameover"){
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
        ctx.fillStyle = "#ffd23f";
        ctx.textAlign = "center";
        ctx.font = "48px sans-serif";
        ctx.fillText("Game Over", CANVAS_W/2, CANVAS_H/2 - 20);
        ctx.font = "24px sans-serif";
        ctx.fillText(`Score: ${player.score}`, CANVAS_W/2, CANVAS_H/2 + 20);
        ctx.fillText("Press R or click Restart", CANVAS_W/2, CANVAS_H/2 + 60);
        ctx.textAlign = "left";
      }

      updateObservable();
      if (state !== "gameover") loopId = requestAnimationFrame(loop);
    }

    function init(){
      const canvas = document.getElementById('game');
      ctx = canvas.getContext('2d');
      // input listeners
      window.addEventListener('keydown', handleInput);
      window.addEventListener('pointerdown', handleInput);
      document.getElementById('restart').addEventListener('click', resetGame);
      // start immediately
      resetGame();
    }
    window.addEventListener('load', init);
  </script>
</body>
</html>
