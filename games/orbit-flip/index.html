<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orbit Flip</title>
  <style>
    body {margin:0;background:#0a0a0f;color:#fff;font-family:sans-serif;overflow:hidden;}
    .game-header {padding:1rem; background:#111;}
    .game-header h1 {margin:0;font-size:1.5rem;}
    .game-header p {margin:0.5rem 0;}
    .game-controls {margin:0;padding:0;list-style:none;}
    .game-controls li {margin:0.2rem 0;}
    canvas {display:block; background:#0a0a0f;}
    #restart {position:absolute; top:1rem; right:1rem; padding:0.5rem 1rem; background:#7df9ff; color:#000; border:none; cursor:pointer; font-weight:bold;}
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Orbit Flip</h1>
    <p class="game-description">A dot orbits a fixed center while expanding radial rings with gaps; tap or press Space to flip direction and slip through the gaps. Survive as long as possible.</p>
    <ul class="game-controls">
      <li>Space or mouse click to flip direction</li>
      <li>Press R or click Restart to reset</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
/*
=== CRITIQUE ANALYSIS
(analysis placeholder)
=== END CRITIQUE ===
*/
    (function(){
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const CENTER_X = canvas.width/2;
      const CENTER_Y = canvas.height/2;

       // ------- Config -------
       const PLAYER_RADIUS = 150; // orbit radius
       const PLAYER_DOT_R = 6; // visual radius of the player dot
       const ANGULAR_SPEED = Math.PI*2; // rad/s (one rev per sec)
       const GAP_ANGLE = 0.698; // radians (~40°)
       const RING_THICKNESS = 20;
       const RING_COLOR = '#7df9ff';
       const BACKGROUND_COLOR = '#0a0a0f';
       const SPAWN_INTERVAL = 2.0; // seconds
       const RING_SPEED = 100; // px/s outward
       const MAX_RING_RADIUS = Math.hypot(canvas.width, canvas.height);

       // ------- Extras for juice -------
       // Audio context (lazy init)
       let audioCtx = null;
       let userInteracted = false;
       function playTone(freq, dur) {
         try {
           if (!userInteracted) return; // do not play before user gesture
           if (!audioCtx) {
             audioCtx = new (window.AudioContext || window.webkitAudioContext)();
           }
           const osc = audioCtx.createOscillator();
           const gain = audioCtx.createGain();
           osc.frequency.value = freq;
           osc.connect(gain);
           gain.connect(audioCtx.destination);
           gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
           osc.start();
           osc.stop(audioCtx.currentTime + dur);
         } catch (e) {
           // fail silently
         }
       }

       // Visual flash parameters
       let flashAlpha = 0;
       function triggerFlash(alpha) {
         flashAlpha = Math.max(flashAlpha, alpha);
       }

       // Screen shake parameters
       let shakeTime = 0;
       function triggerShake(duration) {
         shakeTime = Math.max(shakeTime, duration);
       }

       // Simple starfield background
       const stars = [];
       for (let i = 0; i < 50; i++) {
         stars.push({
           x: Math.random() * canvas.width,
           y: Math.random() * canvas.height,
           r: Math.random() * 1.5 + 0.5,
           speed: Math.random() * 0.3 + 0.1,
         });
       }

       function updateStars(dt) {
         for (const s of stars) {
           s.y += s.speed * dt * 60; // slower drift
           if (s.y > canvas.height) s.y = 0;
         }
       }

       function drawStars() {
         ctx.fillStyle = '#555';
         for (const s of stars) {
           ctx.beginPath();
           ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
           ctx.fill();
         }
       }


      // ------- State -------
      let angle = 0; // current angle
      let angularVelocity = ANGULAR_SPEED; // sign determines direction
      let score = 0;
      let lives = 1;
      let state = 'playing'; // 'playing' or 'gameover'
      let spawnTimer = SPAWN_INTERVAL;
      let elapsedTime = 0;
      let rings = [];
      let loopId = null;

      // ------- Observable contract -------
      window.__game = {
        state: 'menu',
        score: 0,
        player: {x: CENTER_X + PLAYER_RADIUS, y: CENTER_Y, visible: true},
        objective: 'Avoid expanding rings by flipping direction to slip through gaps.'
      };

      function reset(){
        if(loopId!==null) cancelAnimationFrame(loopId);
        angle = 0;
        angularVelocity = ANGULAR_SPEED;
        score = 0;
        lives = 1;
        state = 'playing';
        spawnTimer = SPAWN_INTERVAL;
        elapsedTime = 0;
        rings = [];
        updateObservable();
        loopId = requestAnimationFrame(loop);
      }

      function updateObservable(){
        const playerX = CENTER_X + PLAYER_RADIUS*Math.cos(angle);
        const playerY = CENTER_Y + PLAYER_RADIUS*Math.sin(angle);
        window.__game.state = state === 'playing' ? 'playing' : 'gameover';
        window.__game.score = score;
        window.__game.player.x = playerX;
        window.__game.player.y = playerY;
        window.__game.player.visible = true; // player always visible
      }

      function flip(){
        if(state!== 'playing') return;
        angularVelocity = -angularVelocity;
      }

      function spawnRing(){
        // Rings start at radius 0 (center) and expand outward.
        rings.push({radius:0});
      }

       function checkCollision(ring){
         // Called when ring reaches player orbit radius
         const ringAngle = 0; // gap centers are fixed at 0 and PI
         // Compute gap intervals
         const halfGap = GAP_ANGLE/2;
         const gap1Start = normalizeAngle(ringAngle - halfGap);
         const gap1End   = normalizeAngle(ringAngle + halfGap);
         const gap2Start = normalizeAngle(ringAngle + Math.PI - halfGap);
         const gap2End   = normalizeAngle(ringAngle + Math.PI + halfGap);
         const playerAngle = normalizeAngle(angle);
         // helper to test if angle inside interval (handling wrap)
         const inInterval = (a,start,end)=>{
           if(start<end) return a>=start && a<=end;
           return a>=start || a<=end; // wrapped interval
         };
         const inGap = inInterval(playerAngle,gap1Start,gap1End) || inInterval(playerAngle,gap2Start,gap2End);
         if(!inGap){
           // collision -> game over
           state = 'gameover';
           // audio & visual feedback for death
           playTone(110, 0.3);
           triggerFlash(0.5);
           triggerShake(0.4);
         } else {
           // safe pass -> score
           score += 1;
           // audio & visual feedback for score
           playTone(440, 0.1);
           triggerFlash(0.2);
         }
       }

      function normalizeAngle(a){
        let twoPi = Math.PI*2;
        a = a % twoPi;
        if(a<0) a+=twoPi;
        return a;
      }

       function loop(now){
         try {
           const dt = Math.min((now - (loopId?lastTime:now))/1000, 0.1);
           lastTime = now;
           // update visual effects timers
           if (shakeTime > 0) shakeTime -= dt;
           if (flashAlpha > 0) flashAlpha *= 0.9;

           // update stars background
           updateStars(dt);

           if(state === 'playing'){
             // update player angle
             angle += angularVelocity * dt;
             angle = normalizeAngle(angle);
             // update rings
             for(let i=rings.length-1;i>=0;i--){
               const ring = rings[i];
               ring.radius += RING_SPEED * dt;
               // check for collision/score when passing player radius
               if(!ring.checked && ring.radius >= PLAYER_RADIUS){
                 checkCollision(ring);
                 ring.checked = true;
               }
               if(ring.radius - RING_THICKNESS/2 > MAX_RING_RADIUS){
                 rings.splice(i,1);
               }
             }
             // spawn timer
             spawnTimer -= dt;
             if(spawnTimer <= 0){
               spawnRing();
               spawnTimer += SPAWN_INTERVAL;
             }
           }
           // rendering with optional shake
           ctx.save();
           if (shakeTime > 0) {
             const shakeAmt = 5 * shakeTime; // magnitude decays
             ctx.translate((Math.random()-0.5)*shakeAmt, (Math.random()-0.5)*shakeAmt);
           }
           // draw background stars first
           drawStars();
           // clear background color
           ctx.fillStyle = BACKGROUND_COLOR;
           ctx.fillRect(0,0,canvas.width,canvas.height);
           // draw stars on top of background
           drawStars();

           // draw rings
           ctx.lineWidth = RING_THICKNESS;
           ctx.strokeStyle = RING_COLOR;
           const halfGap = GAP_ANGLE/2;
           for(const ring of rings){
             const r = ring.radius;
             // draw two arcs (gap1 and gap2 are omitted)
             // First arc: from gap1End to gap2Start
             const start1 = normalizeAngle(0 + halfGap);
             const end1   = normalizeAngle(Math.PI - halfGap);
             ctx.beginPath();
             ctx.arc(CENTER_X, CENTER_Y, r, start1, end1, false);
             ctx.stroke();
             // Second arc: from gap2End to gap1Start (wrapped)
             const start2 = normalizeAngle(Math.PI + halfGap);
             const end2   = normalizeAngle(2*Math.PI - halfGap);
             ctx.beginPath();
             ctx.arc(CENTER_X, CENTER_Y, r, start2, end2, false);
             ctx.stroke();
           }
           // draw player
           const px = CENTER_X + PLAYER_RADIUS*Math.cos(angle);
           const py = CENTER_Y + PLAYER_RADIUS*Math.sin(angle);
           ctx.fillStyle = '#ff00aa'; // neon magenta
           ctx.beginPath();
           ctx.arc(px, py, PLAYER_DOT_R, 0, Math.PI*2);
           ctx.fill();
           // draw score (persistent UI)
           ctx.fillStyle = '#ffd23f';
           ctx.font = '20px sans-serif';
           ctx.fillText('Score: '+score, 10, 30);
           // flash overlay if active
           if (flashAlpha > 0) {
             ctx.fillStyle = 'rgba(255,255,255,'+flashAlpha+')';
             ctx.fillRect(0,0,canvas.width,canvas.height);
           }
           // game over overlay
           if(state === 'gameover'){
             ctx.fillStyle = 'rgba(0,0,0,0.6)';
             ctx.fillRect(0,0,canvas.width,canvas.height);
             ctx.fillStyle = '#fff';
             ctx.textAlign = 'center';
             ctx.font = '40px sans-serif';
             ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 20);
             ctx.font = '24px sans-serif';
             ctx.fillText('Score: '+score, canvas.width/2, canvas.height/2 + 20);
             ctx.fillText('Press R or click Restart', canvas.width/2, canvas.height/2 + 60);
           }
           ctx.restore();
           updateObservable();
         } catch(e){
           console.error('Loop error', e);
         }
         loopId = requestAnimationFrame(loop);
       }

      // input handling
      document.addEventListener('keydown', (e)=>{ userInteracted = true;
        if(e.code === 'Space'){
          e.preventDefault();
          flip();
        } else if(e.key === 'r' || e.key === 'R'){
          reset();
        }
      });
      canvas.addEventListener('click', flip);
      document.getElementById('restart').addEventListener('click', reset);

      // start game on load
      let lastTime = performance.now();
      reset();
    })();
  </script>
</body>
</html>
