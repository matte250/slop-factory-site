<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Color Sync</title>
  <style>
    body { margin:0; background:#0a0a0f; color:#e6e6f0; font-family:ui-sans-serif,system-ui,sans-serif; }
    .game-header { padding:12px 16px; border-bottom:1px solid #1d1d2a; }
    .game-header h1 { margin:0; font-size:18px; color:#7df9ff; }
    .game-header .game-description { margin:4px 0; color:#a5a5b8; }
    .game-header .game-controls { margin:4px 0; padding-left:18px; color:#c8c8d8; }
    main { display:flex; flex-direction:column; align-items:center; padding:16px; }
    canvas { background:#0f1320; border:1px solid #2a2f44; }
    .game-restart { margin-top:10px; padding:8px 14px; background:#1c2030; color:#7df9ff; border:1px solid #2a2f44; cursor:pointer; }
    .game-restart:hover { background:#232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Color Sync</h1>
    <p class="game-description">Tap the dot to cycle through colors; obstacles are colored and become passable only when the dot matches their color, requiring timed color changes to navigate barriers.</p>
    <ul class="game-controls">
      <li>Tap (click) to change color</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    // Game constants
const COLORS = ["#ff52ae", "#ff8c52", "#ffd23f", "#a3ff52", "#52ffae", "#7df9ff"]; // color palette
const SAFE_RADIUS = 150; // safe radius around player start
const DOT_R = 10; // player dot radius
const HAZARD_SPEED = 200; // pixels per second for hazards
const HAZARD_SIZE = 30; // square size of hazards
    // === STATE ==============================================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const restartBtn = document.getElementById('restart');
    let loopId = null;
    let lastTime = performance.now();
let player = { x: canvas.width / 2, y: canvas.height / 2, colorIndex: 0, visible: true };
let hazards = [];
let score = 0;
let phase = 'playing'; // "menu" | "playing" | "gameover"
let keys = new Set();
    // === OBSERVABLE CONTRACT ===============================================
    function publishState() {
      // Determine if player is within canvas bounds
      const visible = player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height;
      // Map internal phase to observable state string
      const stateMap = { menu: 'menu', playing: 'playing', gameover: 'gameover' };
      const currentState = stateMap[phase] || 'playing';
      window.__game = {
        state: currentState,
        score,
        player: { x: player.x, y: player.y, visible },
        objective: 'Tap to change color and avoid colored obstacles.'
      };
    }
    // === RENDER =============================================================
    function render() {
  // Clear canvas / background
  ctx.fillStyle = '#0f1320';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw hazards
  for (const h of hazards) {
    ctx.fillStyle = COLORS[h.colorIndex];
    ctx.fillRect(h.x - HAZARD_SIZE / 2, h.y - HAZARD_SIZE / 2, HAZARD_SIZE, HAZARD_SIZE);
  }

  // Draw player dot
  ctx.fillStyle = COLORS[player.colorIndex];
  ctx.beginPath();
  ctx.arc(player.x, player.y, DOT_R, 0, Math.PI * 2);
  ctx.fill();

  // Draw HUD (score)
  ctx.fillStyle = '#e6e6f0';
  ctx.font = '16px ui-sans-serif, system-ui';
  ctx.textAlign = 'left';
  ctx.fillText(`Score ${score}`, 12, 22);

  // Game Over overlay
  if (phase === 'gameover') {
    ctx.fillStyle = 'rgba(10,10,15,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.font = '44px ui-sans-serif, system-ui';
    ctx.fillStyle = '#ff52ae';
    ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '20px ui-sans-serif, system-ui';
    ctx.fillStyle = '#e6e6f0';
    ctx.fillText(`Final score ${score}`, canvas.width / 2, canvas.height / 2 + 14);
    ctx.font = '16px ui-sans-serif, system-ui';
    ctx.fillStyle = '#a5a5b8';
    ctx.fillText('Press R or click Restart', canvas.width / 2, canvas.height / 2 + 42);
  }
}
    // === LOOP ===============================================================
    function startLoop() {
  // Reset the time reference for dt calculation
  lastTime = performance.now();
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          render();
          publishState();
        } catch (e) { console.error(e); }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }
    // === INPUT ==============================================================
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
      // Space key cycles player color
      if (ev.key === ' ') {
        player.colorIndex = (player.colorIndex + 1) % COLORS.length;
        return;
      }
      keys.add(ev.key);
    });
    // Click or tap on canvas to cycle color
    canvas.addEventListener('click', () => {
      player.colorIndex = (player.colorIndex + 1) % COLORS.length;
    });
    document.addEventListener('keyup', (ev) => {
      keys.delete(ev.key);
    });
    restartBtn.addEventListener('click', reset);
    function reset() {
      // Placeholder reset - restart loop
      startLoop();
    }
        // === AUDIO (lazy) =========================================================
    let audioCtx = null;
    function beep(freq, durSec) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durSec);
      } catch (e) { console.error(e); }
    }

    // Initialize game
    publishState();
    startLoop();
  </script>
</body>
</html>
