<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sidewall Switch</title>
  <style>
    body { margin:0; background:#0a0a0f; color:#e6e6f0; font-family:ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding:12px 16px; border-bottom:1px solid #1d1d2a; }
    .game-header h1 { margin:0; font-size:18px; color:#7df9ff; }
    .game-header .game-description { margin:4px 0; color:#a5a5b8; }
    .game-header .game-controls { margin:4px 0; padding-left:18px; color:#c8c8d8; }
    canvas { background:#0f1320; border:1px solid #2a2f44; image-rendering:pixelated; }
    .game-restart { margin-top:10px; padding:8px 14px; background:#1c2030; color:#7df9ff; border:1px solid #2a2f44; cursor:pointer; }
    .game-restart:hover { background:#232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Sidewall Switch</h1>
    <p class="game-description">The dot auto-advances while clinging to a side wall; each tap flips it to the opposite wall, letting you dodge obstacles that block the current wall or the center.</p>
    <ul class="game-controls">
      <li>Press Space or click the canvas to flip walls</li>
      <li>Press R or click Restart to reset</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
  // === CONFIG ==============================================================
  const PLAYER_SPEED = 150; // pixels per second
  const PLAYER_RADIUS = 5;
  const SPAWN_INTERVAL = 2; // seconds (placeholder)

  // === STATE ==============================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const restartBtn = document.getElementById('restart');

  let player = { x: canvas.width / 2, y: PLAYER_RADIUS, radius: PLAYER_RADIUS, side: 'left' };
  let hazards = []; // placeholder array
  let score = 0;
  let phase = 'playing'; // 'playing' | 'gameover'
  const keys = new Set();
  let lastTime = performance.now();
  let loopId = null;
  let spawnTimer = SPAWN_INTERVAL;

  // === RESET ==============================================================
  function reset() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    score = 0;
    phase = 'playing';
    player.side = 'left';
    player.x = player.side === 'left' ? PLAYER_RADIUS : canvas.width - PLAYER_RADIUS;
    player.y = PLAYER_RADIUS;
    hazards = [];
    spawnTimer = SPAWN_INTERVAL;
    // Update observable contract
    window.__game.state = 'playing';
    window.__game.score = 0;
    window.__game.player.x = player.x;
    window.__game.player.y = player.y;
    window.__game.player.visible = true;
  }

  // === LOOP/UPDATE ==========================================================
  function startLoop() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    function tick(now) {
      try {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        update(dt);
        render();
        publishState();
      } catch (e) {
        console.error('loop error', e);
      }
      loopId = requestAnimationFrame(tick);
    }
    loopId = requestAnimationFrame(tick);
  }

  function update(dt) {
    if (phase !== 'playing') return;
    // auto-advance downwards
    player.y += PLAYER_SPEED * dt;
    if (player.y - player.radius >= canvas.height) {
      // reset to top edge to keep player visible
      player.y = PLAYER_RADIUS;
    }
    // flip side on space or Enter
    if (keys.has(' ') || keys.has('Enter')) {
      flipSide();
      keys.delete(' ');
      keys.delete('Enter');
    }
    // simple score increment per second
    score = Math.floor(score + dt);
  }

  function flipSide() {
    player.side = player.side === 'left' ? 'right' : 'left';
    player.x = player.side === 'left' ? PLAYER_RADIUS : canvas.width - PLAYER_RADIUS;
  }

  // === RENDER ==============================================================
  function render() {
    // clear canvas
    ctx.fillStyle = '#0f1320';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // draw player
    ctx.fillStyle = '#ff00aa';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();
    // HUD
    ctx.fillStyle = '#e6e6f0';
    ctx.font = '16px ui-sans-serif, system-ui';
    ctx.textAlign = 'left';
    ctx.fillText('Score ' + score, 12, 22);
  }

  function publishState() {
    // update observable contract each frame
    window.__game.state = phase;
    window.__game.score = score;
    window.__game.player.x = player.x;
    window.__game.player.y = player.y;
    window.__game.player.visible =
      player.x + player.radius >= 0 && player.x - player.radius <= canvas.width &&
      player.y + player.radius >= 0 && player.y - player.radius <= canvas.height;
    // objective remains static
  }

  // === INPUT ==============================================================
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
    keys.add(ev.key);
  });
  document.addEventListener('keyup', (ev) => { keys.delete(ev.key); });
  restartBtn.addEventListener('click', reset);

  // === AUDIO (lazy) =========================================================
  function beep(freq, dur) {
    try {
      if (!window.audioCtx) window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = window.audioCtx.createOscillator();
      const gain = window.audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.06, window.audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, window.audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(window.audioCtx.destination);
      osc.start();
      osc.stop(window.audioCtx.currentTime + dur);
    } catch (e) {}
  }

  // === OBSERVABLE CONTRACT ================================================
  window.__game = {
    state: 'menu',
    score: 0,
    player: { x: 400, y: 300, visible: true },
    objective: 'Flip the dot between walls to avoid obstacles.'
  };

  // === BOOT ================================================================
  reset();
  startLoop();

</script>
</body>
</html>
