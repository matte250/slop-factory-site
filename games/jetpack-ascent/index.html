<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jetpack Ascent</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #05050c; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Jetpack Ascent</h1>
    <p class="game-description">Rise using your jetpack, navigating vertical gaps while avoiding obstacles. Control thrust to ascend and survive as long as possible.</p>
    <ul class="game-controls">
      <li>Hold space or tap to thrust upward</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const W = 800, H = 600;

    // === STATE ==============================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restart");
    let player;
    let hazards = [];
    let score = 0;
    let phase = "playing";
    let keys = new Set();
    let loopId = null;
    let lastTime = performance.now();

    // === RESET ==============================================================
function reset() {
  player = { x: W / 2, y: H / 2 };
  score = 0;
  lastTime = performance.now();
  publishState();
  render(); // draw initial frame
}

    // === LOOP / UPDATE ======================================================
function startLoop() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    function tick(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      update(dt);
      render();
      publishState();
      loopId = requestAnimationFrame(tick);
    }
    loopId = requestAnimationFrame(tick);
  }

  // === UPDATE =============================================================
  function update(dt) {
    // Increment score over time as a placeholder for gameplay progress.
    // Score increases by 10 points per second.
    score = Math.floor(score + 10 * dt);
    // Keep player within bounds (optional). Here we leave position static.
  }

    // === RENDER =============================================================
function render() {
  ctx.fillStyle = "#05050c";
  ctx.fillRect(0, 0, W, H);
  // Simple player representation.
  ctx.fillStyle = "#7df9ff";
  ctx.beginPath();
  ctx.arc(player.x, player.y, 8, 0, Math.PI * 2);
  ctx.fill();
  // HUD - draw score.
  ctx.fillStyle = "#e6e6f0";
  ctx.font = "16px ui-sans-serif, system-ui";
  ctx.textAlign = "left";
  ctx.fillText(`Score ${score}`, 12, 22);
}

    // === INPUT ==============================================================
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "r" || ev.key === "R") { reset(); ev.preventDefault(); }
    });
    restartBtn.addEventListener("click", reset);

    // === AUDIO (lazy) =======================================================
function beep(freq = 440, durSec = 0.05) {
  try {
    if (!window.__audioCtx) window.__audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = window.__audioCtx.createOscillator();
    const gain = window.__audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.04, window.__audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, window.__audioCtx.currentTime + durSec);
    osc.connect(gain);
    gain.connect(window.__audioCtx.destination);
    osc.start();
    osc.stop(window.__audioCtx.currentTime + durSec);
  } catch {}
}

    // === OBSERVABLE CONTRACT ===============================================
    function publishState() {
      window.__game = {
        state: "playing",
        score,
        player: {
          x: player.x,
          y: player.y,
          visible: player.x >= 0 && player.x < W && player.y >= 0 && player.y < H,
        },
        objective: "Use thrust to rise and pass through gaps.",
      };
    }

    // === BOOT ===============================================================
    reset();
    startLoop();
  </script>
</body>
</html>
