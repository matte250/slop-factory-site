<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rope Swing</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Rope Swing</h1>
    <p class="game-description">Swing the auto‑advancing dot by extending and releasing a rope to navigate obstacles and survive as long as possible.</p>
    <ul class="game-controls">
      <li>Tap or click to extend rope</li>
      <li>Release to retract rope</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
  // === CONFIG =============================================================
  const PLAYER_R = 6;
  const PLAYER_START_X = 100;
  const PLAYER_START_Y = 300;
  const PLAYER_SPEED = 200; // px/sec forward
  const BACKGROUND = "#0f1320";
// physics
const PLAYER_ACC = 600; // acceleration px/sec^2
const PLAYER_MAX_SPEED = 400; // max speed px/sec
const PLAYER_FRICTION = 400; // friction deceleration px/sec^2
// hazards
const HAZARD_SPEED = 150; // px/sec leftward
const HAZARD_SIZE = 20;
const SAFE_RADIUS = 200;
const SPAWN_INTERVAL_MIN = 1.0;
const SPAWN_INTERVAL_MAX = 2.0;

  // === STATE ==============================================================
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const restartBtn = document.getElementById("restart");

  let player = { x: PLAYER_START_X, y: PLAYER_START_Y };
  let keys = new Set(); // Set of pressed keys
  let score = 0;
  let hazards = []; // placeholder for obstacles
  let phase = "playing";
  let loopId = null;
  let lastTime;
  let audioCtx = null;

  // === RESET ==============================================================
  function reset() {
    player = { x: PLAYER_START_X, y: PLAYER_START_Y };
    keys = new Set();
    score = 0;
    lastTime = performance.now();
    publishState();
    startLoop();
  }

  // === LOOP / UPDATE ======================================================
  function startLoop() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    function tick(now) {
      try {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        update(dt);
        render();
        publishState();
      } catch (e) {
        console.error("loop error", e);
      }
      loopId = requestAnimationFrame(tick);
    }
    loopId = requestAnimationFrame(tick);
  }

  function update(dt) {
    // Auto‑advance forward
    player.x += PLAYER_SPEED * dt;
    // Simple wrap to keep player visible for demo
    if (player.x > canvas.width + PLAYER_R) player.x = -PLAYER_R;
  }

  // === RENDER =============================================================
  function render() {
    // Clear canvas
    ctx.fillStyle = BACKGROUND;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw hazards (if any)
    ctx.fillStyle = "#7df9ff"; // neon cyan for obstacles
    for (const h of hazards) {
      // Simple square hazard
      ctx.fillRect(h.x, h.y, HAZARD_SIZE, HAZARD_SIZE);
    }

    // Draw player dot (high contrast neon pink)
    ctx.fillStyle = "#ff52ae";
    ctx.beginPath();
    ctx.arc(player.x, player.y, PLAYER_R, 0, Math.PI * 2);
    ctx.fill();

    // HUD (score)
    ctx.fillStyle = "#e6e6f0";
    ctx.font = "16px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText(`Score ${score}`, 12, 22);
  }

  // === INPUT ==============================================================
  document.addEventListener("keydown", ev => {
    if (ev.key === "r" || ev.key === "R") { reset(); return; }
    keys.add(ev.key);
    // placeholder for rope extension on space or mouse click
  });
  document.addEventListener("keyup", ev => { keys.delete(ev.key); });
  restartBtn.addEventListener("click", reset);

  // === AUDIO (lazy) =======================================================
  function beep(freq, durSec) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durSec);
    } catch (e) {}
  }

  // === OBSERVABLE CONTRACT ===============================================
  function publishState() {
    window.__game = {
      state: "playing",
      score,
      player: {
        x: Math.round(player.x),
        y: Math.round(player.y),
        visible: player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height,
      },
      objective: "Extend and release the rope to swing the dot through obstacles.",
    };
  }

  // === BOOT ===============================================================
  reset();
  </script>
</body>
</html>
