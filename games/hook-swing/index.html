<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hook Swing</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Hook Swing</h1>
    <p class="game-description">The dot auto‑advances; tapping when an anchor appears attaches a rope that lets the dot swing around the anchor to clear vertical gaps, then releasing the swing propels it forward.</p>
    <ul class="game-controls">
      <li>Space to attach rope</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    // Game constants
    const PLAYER_SPEED = 200; // px/sec forward
    const PLAYER_LATERAL_SPEED = 200; // px/sec vertical shift
    const PLAYER_RADIUS = 5; // player dot radius

    // === STATE ==============================================================
    // Core game state objects
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restart");
    let keys = new Set();
    let player = { x: 0, y: canvas.height / 2, radius: 5, vx: 100, vy: 0 };
    let hook = { x: null, y: null, active: false };
    let rope = { attached: false };
    let hazards = []; // array of obstacle objects
    let score = 0;
    let phase = "playing"; // "playing" | "gameover" | "menu"
    let loopId = null;
    let lastTime = performance.now();
    // === INPUT ==============================================================
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "r" || ev.key === "R") { reset(); return; }
      if (ev.key === " ") { // Space to attach rope
        // Placeholder hook attach logic
        beep(660, 0.05);
        // In a full implementation, we'd set rope.attached = true and handle attachment.
      }
      keys.add(ev.key);
    });

    document.addEventListener("keyup", (ev) => { keys.delete(ev.key); });
    restartBtn.addEventListener("click", reset);

    // === RESET ==============================================================
    function reset() {
      // Reset game state
      player.x = 0;
      player.y = canvas.height / 2;
      player.vx = 0;
      player.vy = 0;
      hook.x = null;
      hook.y = null;
      hook.active = false;
      rope.attached = false;
      hazards = [];
      score = 0;
      phase = "playing";
      keys.clear();
      lastTime = performance.now();
      startLoop();
    }

    // === UPDATE ==============================================================
    function update(dt) {
      if (phase !== "playing") return;

      // Auto-advance forward
      player.x += PLAYER_SPEED * dt;

      // Lateral shift (vertical)
      if (keys.has("ArrowUp") || keys.has("w") || keys.has("W")) {
        player.y -= PLAYER_LATERAL_SPEED * dt;
      }
      if (keys.has("ArrowDown") || keys.has("s") || keys.has("S")) {
        player.y += PLAYER_LATERAL_SPEED * dt;
      }
      // Clamp to canvas bounds
      player.x = Math.max(0, Math.min(canvas.width, player.x));
      player.y = Math.max(0, Math.min(canvas.height, player.y));

      // Simple game‑over trigger when reaching right edge
      if (player.x >= canvas.width) {
        phase = "gameover";
      }
    }

    // === RENDER ==============================================================
    function render() {
      // Clear canvas
      ctx.fillStyle = "#0f1320";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw player (high‑contrast)
      ctx.fillStyle = "#7df9ff";
      ctx.beginPath();
      ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
      ctx.fill();

      // HUD – score
      ctx.fillStyle = "#e6e6f0";
      ctx.font = "16px ui-sans-serif, system-ui";
      ctx.textAlign = "left";
      ctx.fillText(`Score ${score}`, 12, 22);

      // Game‑over overlay
      if (phase === "gameover") {
        ctx.fillStyle = "rgba(10,10,15,0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = "center";
        ctx.font = "44px ui-sans-serif, system-ui";
        ctx.fillStyle = "#ff52ae";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = "#e6e6f0";
        ctx.font = "20px ui-sans-serif, system-ui";
        ctx.fillText(`Final score ${score}`, canvas.width / 2, canvas.height / 2 + 14);
        ctx.fillStyle = "#c8c8d8";
        ctx.font = "16px ui-sans-serif, system-ui";
        ctx.fillText("Press R or click Restart", canvas.width / 2, canvas.height / 2 + 42);
      }
    }

    // === LOOP ==============================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          update(dt);
          render();
          publishState();
        } catch (err) {
          console.error("loop error", err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    // === AUDIO (lazy) ======================================================
    let audioCtx = null;
    function beep(freq, durSec) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durSec);
      } catch {}
    }

    // === OBSERVABLE CONTRACT ===============================================
    function publishState() {
      window.__game = {
        state: phase === "playing" ? "playing" : "gameover",
        score,
        player: {
          x: player.x,
          y: player.y,
          visible:
            player.x >= 0 &&
            player.x <= canvas.width &&
            player.y >= 0 &&
            player.y <= canvas.height,
        },
        objective:
          "Attach ropes to swing past gaps and survive as long as possible.",
      };
    }

    // === BOOT ===============================================================
    reset();
  </script>
</body>
</html>
