<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Size Shift</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Size Shift</h1>
    <p class="game-description">Tap to toggle the dot’s radius between a small and a large size; only gaps sized to match the current radius let the dot pass, requiring rhythmic size changes as the tunnel scrolls.</p>
    <ul class="game-controls">
      <li>Tap / Click to toggle size</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const PLAYER_SPEED = 300; // px/sec
    const PLAYER_RADIUS_SMALL = 8;
    const PLAYER_RADIUS_LARGE = 24;
    const HAZARD_SPEED = 200; // px/sec
    const HAZARD_RADIUS_MIN = 10;
    const HAZARD_RADIUS_MAX = 25;
    const SPAWN_INTERVAL = 1.2; // seconds
    const SAFE_RADIUS = 200; // px, safe spawn distance from player

    // === STATE ==============================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restart");

    let player; // { x, y, radius }
    let hazards; // array of { x, y, radius }
    let spawnTimer;
    let score;
    let phase; // "playing" | "gameover"
    let keys;
    let lastTime;
    let loopId = null;
    let audioCtx = null;

    // === RESET ==============================================================
    function reset() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      player = { x: canvas.width / 2, y: canvas.height / 2, radius: PLAYER_RADIUS_SMALL };
      score = 0;
      phase = "playing";
      keys = new Set();
      lastTime = performance.now();
      publishState();
      startLoop();
    }

    // === LOOP ==============================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          update(dt);
          render();
          publishState();
        } catch (err) {
          console.error("loop error", err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    // === UPDATE ==============================================================
    function update(dt) {
      if (phase !== "playing") return;
      // Player movement.
      const dirX = (keys.has("ArrowRight") || keys.has("d") || keys.has("D") ? 1 : 0)
                 - (keys.has("ArrowLeft")  || keys.has("a") || keys.has("A") ? 1 : 0);
      player.x += dirX * PLAYER_SPEED * dt;
      player.x = clamp(player.x, 0, canvas.width);
      score += 1;
    }

    // === RENDER ==============================================================
    function render() {
      ctx.fillStyle = "#0f1320";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Player.
      ctx.fillStyle = "#7df9ff";
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // HUD.
      ctx.fillStyle = "#e6e6f0";
      ctx.font = "16px ui-sans-serif, system-ui";
      ctx.textAlign = "left";
      ctx.fillText(`Score ${score}`, 12, 22);
    }

    // === INPUT ==============================================================
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "r" || ev.key === "R") { reset(); return; }
      keys.add(ev.key);
    });
    document.addEventListener("keyup", (ev) => { keys.delete(ev.key); });
    restartBtn.addEventListener("click", reset);

    // === AUDIO (lazy) =======================================================
    function beep(freq, durSec) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durSec);
      } catch {}
    }

    // === OBSERVABLE CONTRACT ================================================
    function publishState() {
      window.__game = {
        state: phase,
        score,
        player: {
          x: player.x,
          y: player.y,
          visible: player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height,
        },
        objective: "Toggle the dot’s size to fit through gaps in the scrolling tunnel.",
      };
    }
    // Observable contract populated each frame as required
    // === HELPERS ============================================================
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

    // === BOOT ==============================================================
    // Initialize game and ensure observable contract is set up from the first frame.
    reset();
  </script>
</body>
</html>
