<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shape Shift</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; image-rendering: pixelated; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Shape Shift</h1>
    <p class="game-description">A dot auto‑advances through a scrolling tunnel, toggling between a circle and a square on each tap. Only matching shapes can pass through the corresponding gaps.</p>
    <ul class="game-controls">
      <li>Space or click to toggle shape</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
  // === CONFIG =============================================================
  const CANVAS_W = 800;
  const CANVAS_H = 600;
  const PLAYER_X = 120;               // constant horizontal position
  const PLAYER_SPEED = 0;               // player does not move horizontally; auto‑advance is simulated by obstacles moving left
  const OBSTACLE_SPEED_START = 200;    // px/s
  const OBSTACLE_SPEED_MAX = 500;
  const OBSTACLE_SPEEDUP = 5;          // px/s per obstacle passed
  const SPAWN_INTERVAL_START = 1.5;    // seconds
  const SPAWN_INTERVAL_MIN = 0.6;
  const SPAWN_DECREASE = 0.02;         // seconds per obstacle passed
  const SHAPE_SIZE = 40;               // visual size of circle/square
  const SAFE_RADIUS = 200;             // not used directly – spawn is beyond canvas width
  const OBJECTIVE = "Toggle shape to match tunnel gaps and survive as long as possible.";

  // === STATE ==============================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const restartBtn = document.getElementById('restart');

  let player;          // { shape: 'circle'|'square', x, y }
  let obstacles = [];  // array of { x, type: 'circle'|'square', passed: false }
  let score = 0;
  let highScore = 0;
  let obstacleSpeed = OBSTACLE_SPEED_START;
  let spawnInterval = SPAWN_INTERVAL_START;
  let spawnTimer = 0;
  let phase = 'menu';   // 'menu' | 'playing' | 'gameover'
  let lastTime = performance.now();
  let loopId = null;
  let audioCtx = null;
  const keys = new Set();

  // === RESET ==============================================================
  function reset() {
    // load persisted high score
    try {
      const stored = localStorage.getItem('slop-factory:shape-shift-2:highScore');
      if (stored !== null) highScore = Number(stored);
    } catch {}
    player = { shape: 'circle', x: PLAYER_X, y: CANVAS_H / 2 };
    obstacles = [];
    score = 0;
    obstacleSpeed = OBSTACLE_SPEED_START;
    spawnInterval = SPAWN_INTERVAL_START;
    spawnTimer = 0;
    phase = 'playing';
    lastTime = performance.now();
    publishState();
    startLoop();
  }

  // === LOOP ===============================================================
  function startLoop() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    function tick(now) {
      try {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        update(dt);
        render();
        publishState();
      } catch (e) {
        console.error('loop error', e);
      }
      loopId = requestAnimationFrame(tick);
    }
    loopId = requestAnimationFrame(tick);
  }

  // === UPDATE =============================================================
  function update(dt) {
    if (phase !== 'playing') return;

    // input handling (space toggles shape)
    if (keys.has('Space')) {
      toggleShape();
      keys.delete('Space'); // prevent repeat on held key
    }

    // obstacle spawning
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnObstacle();
      spawnTimer = spawnInterval;
      // difficulty increase
      obstacleSpeed = Math.min(OBSTACLE_SPEED_MAX, obstacleSpeed + OBSTACLE_SPEEDUP);
      spawnInterval = Math.max(SPAWN_INTERVAL_MIN, spawnInterval - SPAWN_DECREASE);
    }

    // move obstacles leftwards
    for (const obs of obstacles) {
      obs.x -= obstacleSpeed * dt;
    }

    // check collisions / scoring
    for (const obs of obstacles) {
      if (obs.passed) continue;
      if (obs.x <= player.x) {
        if (obs.type !== player.shape) {
          gameOver();
          return;
        } else {
          score++;
          if (score > highScore) highScore = score;
          obs.passed = true;
          beep(660, 0.05);
        }
      }
    }

    // remove off‑screen obstacles
    obstacles = obstacles.filter(o => o.x + SHAPE_SIZE > 0);
  }

  function spawnObstacle() {
    // spawn just beyond right edge
    const type = Math.random() < 0.5 ? 'circle' : 'square';
    obstacles.push({ x: CANVAS_W + SHAPE_SIZE, type, passed: false });
  }

  function toggleShape() {
    player.shape = player.shape === 'circle' ? 'square' : 'circle';
    beep(440, 0.04);
  }

  function gameOver() {
    phase = 'gameover';
    beep(120, 0.2);
    try {
      localStorage.setItem('slop-factory:shape-shift-2:highScore', String(highScore));
    } catch {}
  }

  // === RENDER =============================================================
  function render() {
    // background
    ctx.fillStyle = '#0f1320';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // tunnel walls (simple vertical bars on left/right)
    ctx.fillStyle = '#2a2f44';
    ctx.fillRect(0, 0, 20, CANVAS_H);
    ctx.fillRect(CANVAS_W - 20, 0, 20, CANVAS_H);

    // obstacles (gap shapes)
    for (const obs of obstacles) {
      if (obs.type === 'circle') {
        ctx.fillStyle = '#ff00aa';
        ctx.beginPath();
        ctx.arc(obs.x, player.y, SHAPE_SIZE / 2, 0, Math.PI * 2);
        ctx.fill();
      } else { // square
        ctx.fillStyle = '#ff00aa';
        ctx.fillRect(obs.x - SHAPE_SIZE / 2, player.y - SHAPE_SIZE / 2, SHAPE_SIZE, SHAPE_SIZE);
      }
    }

    // player
    if (player.shape === 'circle') {
      ctx.fillStyle = '#7df9ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, SHAPE_SIZE / 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#7df9ff';
      ctx.fillRect(player.x - SHAPE_SIZE / 2, player.y - SHAPE_SIZE / 2, SHAPE_SIZE, SHAPE_SIZE);
    }

    // HUD
    ctx.fillStyle = '#e6e6f0';
    ctx.font = '16px ui-sans-serif, system-ui';
    ctx.textAlign = 'left';
    ctx.fillText('Score ' + score, 12, 22);
    ctx.textAlign = 'right';
    ctx.fillText('Best ' + highScore, CANVAS_W - 12, 22);

    if (phase === 'gameover') {
      ctx.fillStyle = 'rgba(10,10,15,0.7)';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = '#ff00aa';
      ctx.textAlign = 'center';
      ctx.font = '44px ui-sans-serif, system-ui';
      ctx.fillText('Game Over', CANVAS_W / 2, CANVAS_H / 2 - 20);
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '20px ui-sans-serif, system-ui';
      ctx.fillText('Final score ' + score + (score === highScore && score > 0 ? ' — new best!' : ''), CANVAS_W / 2, CANVAS_H / 2 + 16);
      ctx.fillStyle = '#a5a5b8';
      ctx.font = '16px ui-sans-serif, system-ui';
      ctx.fillText('Press R or click Restart', CANVAS_W / 2, CANVAS_H / 2 + 44);
    }
  }

  // === INPUT ==============================================================
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
    if (phase !== 'playing') return;
    if (ev.code === 'Space') keys.add('Space');
  });
  document.addEventListener('click', (ev) => {
    // any click (except on restart button) toggles shape
    if (ev.target.id !== 'restart') {
      keys.add('Space');
    }
  });
  restartBtn.addEventListener('click', reset);

  // === AUDIO (lazy) =======================================================
  function beep(freq, durSec) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + durSec);
    } catch {}
  }

  // === OBSERVABLE CONTRACT ===============================================
  function publishState() {
    const visible = player.x >= 0 && player.x < CANVAS_W && player.y >= 0 && player.y < CANVAS_H;
    window.__game = {
      state: phase,
      score,
      player: {
        x: player.x,
        y: player.y,
        visible,
      },
      objective: OBJECTIVE,
    };
  }

  // === BOOT ===============================================================
  reset();
  </script>
</body>
</html>
