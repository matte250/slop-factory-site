<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gate Flip</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Gate Flip</h1>
    <p class="game-description">Tap toggles all on-screen gates between open and closed states, forcing you to time taps so the openings line up with the moving dot as the tunnel scrolls.</p>
    <ul class="game-controls">
      <li>Tap or click to toggle gates</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const PLAYER_SPEED = 400; // px/sec

    // === STATE ==============================================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Game objects
    const player = { x: canvas.width / 2, y: canvas.height / 2 };
    const hazards = [];
    let score = 0;
    let phase = 'playing'; // 'menu' | 'playing' | 'gameover'
    const keys = new Set();

    // Observable contract helper
    function publishState() {
      window.__game = {
        state: phase,
        score,
        player: {
          x: player.x,
          y: player.y,
          visible: true,
        },
        objective: 'Tap gates to open paths for the moving dot.',
      };
    }
    // Initialize observable state
    publishState();

    // === LOOP/UPDATE ==========================================================
    let lastTime = performance.now();
    let loopId = null;

    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          update(dt);
          render();
          publishState();
        } catch (err) {
          console.error('loop error', err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    function update(dt) {
      // placeholder for game logic
    }

    // === RENDER ==============================================================
    function render() {
      // Clear background
      ctx.fillStyle = '#0f1320';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw hazards (if any)
      ctx.fillStyle = '#ff52ae'; // neon hazard color
      hazards.forEach(h => {
        if (typeof h.x === 'number' && typeof h.y === 'number' && typeof h.w === 'number' && typeof h.h === 'number') {
          ctx.fillRect(h.x, h.y, h.w, h.h);
        }
      });

      // Draw player (high contrast)
      ctx.fillStyle = '#7df9ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, 8, 0, Math.PI * 2);
      ctx.fill();

      // HUD – score top‑left
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '16px ui-sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('Score ' + score, 12, 22);

      // Game‑over overlay
      if (phase === 'gameover') {
        ctx.fillStyle = 'rgba(10,10,15,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = 'center';
        ctx.font = '44px ui-sans-serif';
        ctx.fillStyle = '#ff52ae';
        ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '20px ui-sans-serif';
        ctx.fillStyle = '#e6e6f0';
        ctx.fillText('Final score ' + score, canvas.width / 2, canvas.height / 2 + 14);
        ctx.font = '16px ui-sans-serif';
        ctx.fillStyle = '#c8c8d8';
        ctx.fillText('Press R or click Restart', canvas.width / 2, canvas.height / 2 + 42);
        // Reset alignment for future draws
        ctx.textAlign = 'left';
      }
    }

    // === INPUT ==============================================================
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'r' || ev.key === 'R') {
        // Placeholder restart logic – reinitialize state and render
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        score = 0;
        phase = 'menu';
        publishState();
        render();
      } else {
        keys.add(ev.key);
      }
    });
    document.addEventListener('keyup', (ev) => {
      keys.delete(ev.key);
    });
    document.getElementById('restart').addEventListener('click', () => {
      // Placeholder restart logic – reinitialize state and render
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      score = 0;
      phase = 'menu';
      publishState();
      render();
    });

    // === AUDIO (lazy) ========================================================
    function beep(freq, durSec) {
      try {
        if (!window.__audioCtx) {
          window.__audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const osc = window.__audioCtx.createOscillator();
        const gain = window.__audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, window.__audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, window.__audioCtx.currentTime + durSec);
        osc.connect(gain);
        gain.connect(window.__audioCtx.destination);
        osc.start();
        osc.stop(window.__audioCtx.currentTime + durSec);
      } catch (e) {}
    }

    // === OBSERVABLE CONTRACT ================================================
    // (publishState defined above)

    // === BOOT ===============================================================
    startLoop();
  </script>
</body>
</html>
