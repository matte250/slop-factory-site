<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Split Path</title>
  <style>
    body {margin:0;background:#0a0a0f;color:#e6e6f0;font-family:ui-sans-serif,system-ui,sans-serif;}
    .game-header {padding:12px 16px;border-bottom:1px solid #1d1d2a;}
    .game-header h1 {margin:0;font-size:18px;color:#7df9ff;}
    .game-header .game-description {margin:4px 0;color:#a5a5b8;}
    .game-header .game-controls {margin:4px 0;padding-left:18px;color:#c8c8d8;}
    main {display:flex;flex-direction:column;align-items:center;padding:16px;}
    canvas {background:#0f1320;border:1px solid #2a2f44;image-rendering:pixelated;}
    .game-restart {margin-top:10px;padding:8px 14px;background:#1c2030;color:#7df9ff;border:1px solid #2a2f44;cursor:pointer;}
    .game-restart:hover {background:#232842;}
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Split Path</h1>
    <p class="game-description">Tap to duplicate the dot into two parallel copies that can each thread through different gap patterns, then merge back before the next obstacle.</p>
    <ul class="game-controls">
      <li>Tap / click to split</li>
      <li>← Arrow to move left copy while split</li>
      <li>→ Arrow to move right copy while split</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
  // === CONFIG =============================================================
  const CANVAS_W = 800;
  const CANVAS_H = 600;
  const PLAYER_RADIUS = 8;
  const PLAYER_START_X = 400;
  const PLAYER_START_Y = 550;
  const SPLIT_DURATION = 0.5; // seconds
  const SPLIT_SPEED = 200; // px/s for each copy
  const OBSTACLE_HEIGHT = 20;
  const GAP_WIDTH = 80;
  const OBSTACLE_SPEED = 100; // px/s
  const SPAWN_INTERVAL = 2.0; // seconds
  const GAP_LEFT_CENTER = 200; // x coordinate of left gap centre
  const GAP_RIGHT_CENTER = CANVAS_W - GAP_LEFT_CENTER; // mirrored

  // === STATE ==============================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const restartBtn = document.getElementById('restart');

  let player = {
    x: PLAYER_START_X,
    y: PLAYER_START_Y,
    vx: 0,
    radius: PLAYER_RADIUS,
    isSplit: false,
    splitTimer: 0,
    leftOffset: 0,
    rightOffset: 0,
  };
  let obstacles = [];
  let spawnTimer = SPAWN_INTERVAL;
  let score = 0;
  let highScore = 0;
  let state = 'playing'; // "playing" | "gameover"
  let lastTime = performance.now();
  let loopId = null;
  let audioCtx = null;
  const keys = new Set();

  // === RESET ==============================================================
  function reset() {
    player = {
      x: PLAYER_START_X,
      y: PLAYER_START_Y,
      vx: 0,
      radius: PLAYER_RADIUS,
      isSplit: false,
      splitTimer: 0,
      leftOffset: 0,
      rightOffset: 0,
    };
    obstacles = [];
    spawnTimer = SPAWN_INTERVAL;
    score = 0;
    state = 'playing';
    lastTime = performance.now();
    publishState();
    startLoop();
  }

  // === LOOP ==============================================================
  function startLoop() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    function tick(now) {
      try {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        update(dt);
        render();
        publishState();
      } catch (e) {
        console.error('loop error', e);
      }
      loopId = requestAnimationFrame(tick);
    }
    loopId = requestAnimationFrame(tick);
  }

  // === UPDATE =============================================================
  function update(dt) {
    if (state !== 'playing') return;
    // split timer
    if (player.isSplit) {
      player.splitTimer -= dt;
      if (player.splitTimer <= 0) {
        player.isSplit = false;
        player.leftOffset = 0;
        player.rightOffset = 0;
      }
    }
    // input handling for split movement
    if (player.isSplit) {
      if (keys.has('ArrowLeft')) player.leftOffset -= SPLIT_SPEED * dt;
      if (keys.has('ArrowRight')) player.rightOffset += SPLIT_SPEED * dt;
    }
    // spawn obstacles
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer += SPAWN_INTERVAL;
      obstacles.push({ y: -OBSTACLE_HEIGHT });
    }
    // move obstacles and check collisions / scoring
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      obs.y += OBSTACLE_SPEED * dt;
      // collision check when obstacle overlaps player vertical range
      const top = obs.y;
      const bottom = obs.y + OBSTACLE_HEIGHT;
      const playerTop = player.y - player.radius;
      const playerBottom = player.y + player.radius;
      const verticalOverlap = !(playerBottom < top || playerTop > bottom);
      if (verticalOverlap) {
        // compute gap boundaries
        const leftGapStart = GAP_LEFT_CENTER - GAP_WIDTH / 2;
        const leftGapEnd = GAP_LEFT_CENTER + GAP_WIDTH / 2;
        const rightGapStart = GAP_RIGHT_CENTER - GAP_WIDTH / 2;
        const rightGapEnd = GAP_RIGHT_CENTER + GAP_WIDTH / 2;
        const leftCopyX = player.x + player.leftOffset;
        const rightCopyX = player.x + player.rightOffset;
        const leftInside = leftCopyX >= leftGapStart && leftCopyX <= leftGapEnd;
        const rightInside = rightCopyX >= rightGapStart && rightCopyX <= rightGapEnd;
        const singleInside = (player.x >= leftGapStart && player.x <= leftGapEnd) || (player.x >= rightGapStart && player.x <= rightGapEnd);
        const safe = player.isSplit ? (leftInside && rightInside) : singleInside;
        if (!safe) {
          gameOver();
          return;
        }
      }
      // scoring when obstacle passes bottom
      if (obs.y > CANVAS_H) {
        obstacles.splice(i, 1);
        score++;
        beep(440, 0.07);
      }
    }
  }

  function gameOver() {
    state = 'gameover';
    if (score > highScore) highScore = score;
    beep(120, 0.18);
  }

  // === RENDER =============================================================
  function render() {
    // clear background
    ctx.fillStyle = '#0f1320';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    // draw obstacles (bars with gaps)
    ctx.fillStyle = '#ff00aa';
    for (const obs of obstacles) {
      // draw full bar
      ctx.fillRect(0, obs.y, CANVAS_W, OBSTACLE_HEIGHT);
      // cut gaps
      ctx.clearRect(GAP_LEFT_CENTER - GAP_WIDTH / 2, obs.y, GAP_WIDTH, OBSTACLE_HEIGHT);
      ctx.clearRect(GAP_RIGHT_CENTER - GAP_WIDTH / 2, obs.y, GAP_WIDTH, OBSTACLE_HEIGHT);
    }
    // draw player copies
    ctx.fillStyle = '#7df9ff';
    if (player.isSplit) {
      ctx.beginPath();
      ctx.arc(player.x + player.leftOffset, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(player.x + player.rightOffset, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    }
    // HUD
    ctx.fillStyle = '#e6e6f0';
    ctx.font = '16px ui-sans-serif, system-ui';
    ctx.textAlign = 'left';
    ctx.fillText('Score ' + score, 12, 22);
    ctx.textAlign = 'right';
    ctx.fillText('Best ' + highScore, CANVAS_W - 12, 22);
    // game over overlay
    if (state === 'gameover') {
      ctx.fillStyle = 'rgba(10,10,15,0.7)';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = '#ff52ae';
      ctx.textAlign = 'center';
      ctx.font = '44px ui-sans-serif, system-ui';
      ctx.fillText('Game Over', CANVAS_W / 2, CANVAS_H / 2 - 20);
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '20px ui-sans-serif, system-ui';
      ctx.fillText('Final score ' + score + (score === highScore && score > 0 ? ' — new best!' : ''), CANVAS_W / 2, CANVAS_H / 2 + 16);
      ctx.fillStyle = '#a5a5b8';
      ctx.font = '16px ui-sans-serif, system-ui';
      ctx.fillText('Press R or click Restart', CANVAS_W / 2, CANVAS_H / 2 + 44);
    }
  }

  // === INPUT ==============================================================
  document.addEventListener('keydown', (e) => {
    keys.add(e.key);
    if (e.key === 'r' || e.key === 'R') { reset(); return; }
    if (state !== 'playing') return;
    // split trigger on mouse click handled separately
  });
  document.addEventListener('keyup', (e) => {
    keys.delete(e.key);
  });
  // tap / click to split
  canvas.addEventListener('mousedown', () => {
    if (state !== 'playing') return;
    if (!player.isSplit) {
      player.isSplit = true;
      player.splitTimer = SPLIT_DURATION;
      player.leftOffset = 0;
      player.rightOffset = 0;
      beep(660, 0.06);
    }
  });
  restartBtn.addEventListener('click', reset);

  // === AUDIO (lazy) =======================================================
  function beep(freq, durSec) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + durSec);
    } catch {}
  }

  // === OBSERVABLE CONTRACT ===============================================
  function publishState() {
    window.__game = {
      state,
      score,
      player: {
        x: player.x,
        y: player.y,
        visible: player.x >= 0 && player.x <= CANVAS_W && player.y >= 0 && player.y <= CANVAS_H,
      },
      objective: 'Duplicate the dot and thread each copy through its gap before merging.',
    };
  }

  // === BOOT ===============================================================
  reset();
  </script>
</body>
</html>
