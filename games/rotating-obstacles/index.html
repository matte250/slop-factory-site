<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rotating Obstacles</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Rotating Obstacles</h1>
    <p class="game-description">A dot auto‑advances while you tap rotating blocks to align their gaps and survive.</p>
    <ul class="game-controls">
      <li>Tap obstacle to rotate</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
  // === CONFIG =============================================================
  // (no configurable constants needed for this stage)

  // === STATE ==============================================================
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const restartBtn = document.getElementById("restart");

  let player;               // { x, y }
  let hazards = [];        // array of obstacle objects (empty for now)
  let score = 0;
let scoreTimer = 0;
  let phase = "playing";  // "playing" | "gameover"
  let keys = new Set();
  let lastTime = performance.now();
  let loopId = null;
  let audioCtx = null;

  function reset() {
    // Initialize player near bottom center.
    player = { x: canvas.width / 2, y: canvas.height - 60 };
    hazards = [];
    score = 0;
    phase = "playing";
    keys.clear();
    lastTime = performance.now();
    publishState();
    startLoop();
  }

  // === LOOP ==============================================================
function startLoop() {
  if (loopId !== null) cancelAnimationFrame(loopId);
  function tick(now) {
    try {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      // Clear the canvas before updating and rendering
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      update(dt);
      render();
      publishState();
    } catch (err) {
      console.error("loop error", err);
    }
    loopId = requestAnimationFrame(tick);
  }
  loopId = requestAnimationFrame(tick);
}

  function update(dt) {
    // Placeholder: player does not move yet.
    // Future logic will advance the dot and handle hazards.
  }

  // === RENDER =============================================================
  function render() {
    // Clear background
    ctx.fillStyle = "#0f1320";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw hazards
    ctx.fillStyle = "#ff52ae";
    for (const h of hazards) {
      const w = h.w ?? 40;
      const hgt = h.h ?? 20;
      const angle = h.angle ?? 0;
      const x = h.x ?? 0;
      const y = h.y ?? 0;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillRect(-w/2, -hgt/2, w, hgt);
      ctx.restore();
    }

    // Draw player as a small neon dot
    ctx.fillStyle = "#7df9ff";
    ctx.beginPath();
    ctx.arc(player.x, player.y, 5, 0, Math.PI * 2);
    ctx.fill();

    // Draw HUD (score)
    ctx.fillStyle = "#e6e6f0";
    ctx.font = "16px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText(`Score ${score}`, 12, 22);

    // Game‑over overlay
    if (phase === "gameover") {
      ctx.fillStyle = "rgba(10,10,15,0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center";
      ctx.font = "44px ui-sans-serif, system-ui";
      ctx.fillStyle = "#ff52ae";
      ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = "20px ui-sans-serif, system-ui";
      ctx.fillStyle = "#e6e6f0";
      ctx.fillText(`Final score ${score}`, canvas.width / 2, canvas.height / 2 + 14);
      ctx.font = "16px ui-sans-serif, system-ui";
      ctx.fillStyle = "#a5a5b8";
      ctx.fillText("Press R or click Restart", canvas.width / 2, canvas.height / 2 + 42);
    }
  }

  // === INPUT ==============================================================
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "r" || ev.key === "R") { reset(); return; }
    keys.add(ev.key);
  });
  document.addEventListener("keyup", (ev) => { keys.delete(ev.key); });
  restartBtn.addEventListener("click", reset);

  // === AUDIO (lazy) =======================================================
  function beep(freq, durSec) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durSec);
    } catch (e) { /* audio init may fail on some browsers */ }
  }

  // === OBSERVABLE CONTRACT ===============================================
  function publishState() {
    window.__game = {
      state: phase,
      score,
      player: {
        x: player.x,
        y: player.y,
        visible: player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height,
      },
      objective: "Navigate the dot through rotating obstacles.",
    };
  }

  // === BOOT ===============================================================
  reset();
  </script>
</body>
</html>
