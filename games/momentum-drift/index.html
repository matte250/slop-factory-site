<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Momentum Drift</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Momentum Drift</h1>
    <p class="game-description">The dot auto‑advances forward; each tap applies a short lateral impulse that gradually fades, letting you steer a drifting path through columns of moving gaps.</p>
    <ul class="game-controls">
      <li>Tap / click to apply lateral impulse</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
  // === CONFIG =============================================================
  // Game configuration constants
  const PLAYER_RADIUS = 5;
  const PLAYER_FORWARD_SPEED = 200; // px/sec forward (upwards)
  const IMPULSE_STRENGTH = 150; // px/sec lateral impulse per tap
  const MAX_SPEED = 400; // max lateral speed px/sec
  const FRICTION = 0.95; // lateral friction per frame

  // === STATE ==============================================================
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  // Core mutable state
  const player = { x: canvas.width / 2, y: canvas.height * 0.8, vx: 0, vy: 0 };
  const hazards = [];
  let score = 0;
  let phase = "playing"; // "menu" | "playing" | "gameover"
  const keys = new Set();
  let loopId = null;
  let lastTime = null;

  // === RESET ==============================================================
  function reset() {
    // Reset core state to initial values
    player.x = canvas.width / 2;
    player.y = canvas.height * 0.8;
    player.vx = 0;
    player.vy = 0;
    hazards.length = 0;
    score = 0;
    phase = "playing";
    keys.clear();
    lastTime = performance.now();
    startLoop();
    publishState();
  }

  // === LOOP/UPDATE ========================================================
  function startLoop() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    function tick(now) {
      try {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        update(dt);
        render();
        publishState();
      } catch (e) {
        console.error("loop error", e);
      }
      loopId = requestAnimationFrame(tick);
    }
    loopId = requestAnimationFrame(tick);
  }

  function update(dt) {
    if (phase !== "playing") return;
    // Auto‑advance forward (upwards)
    player.y -= PLAYER_FORWARD_SPEED * dt;

    // Apply lateral velocity with friction
    if (keys.has("ArrowLeft") || keys.has("a") || keys.has("A")) player.vx -= IMPULSE_STRENGTH * dt;
    if (keys.has("ArrowRight") || keys.has("d") || keys.has("D")) player.vx += IMPULSE_STRENGTH * dt;
    // Cap speed
    if (player.vx > MAX_SPEED) player.vx = MAX_SPEED;
    if (player.vx < -MAX_SPEED) player.vx = -MAX_SPEED;
    // Apply friction
    player.vx *= FRICTION;

    // Update position
    player.x += player.vx * dt;
    // Clamp within canvas bounds
    if (player.x < PLAYER_RADIUS) player.x = PLAYER_RADIUS;
    if (player.x > canvas.width - PLAYER_RADIUS) player.x = canvas.width - PLAYER_RADIUS;
    if (player.y < PLAYER_RADIUS) player.y = PLAYER_RADIUS;
    if (player.y > canvas.height - PLAYER_RADIUS) player.y = canvas.height - PLAYER_RADIUS;

    // TODO: hazard spawning, movement, collision, scoring – later tasks
  }

  // === RENDER =============================================================
  function render() {
    // Clear canvas background
    ctx.fillStyle = "#0f1320";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw hazards (placeholder – none yet)
    // ctx.fillStyle = "#ff52ae"; // example hazard colour
    // hazards.forEach(h => { ctx.fillRect(h.x, h.y, h.w, h.h); });

    // Draw player as a dot
    ctx.fillStyle = "#7df9ff";
    ctx.beginPath();
    ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    // Draw score HUD
    ctx.fillStyle = "#e6e6f0";
    ctx.font = "16px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText(`Score ${score}`, 12, 22);

    // Game‑over overlay
    if (phase === "gameover") {
      ctx.fillStyle = "rgba(10,10,15,0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center";
      ctx.font = "44px ui-sans-serif, system-ui";
      ctx.fillStyle = "#ff52ae";
      ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = "20px ui-sans-serif, system-ui";
      ctx.fillStyle = "#e6e6f0";
      ctx.fillText(`Final score ${score}`, canvas.width / 2, canvas.height / 2 + 14);
      ctx.font = "16px ui-sans-serif, system-ui";
      ctx.fillStyle = "#a5a5b8";
      ctx.fillText("Press R or click Restart", canvas.width / 2, canvas.height / 2 + 42);
    }
  }

  // === INPUT ===============================================================
  document.addEventListener("keydown", ev => {
    if (ev.key === "r" || ev.key === "R") { reset(); return; }
    keys.add(ev.key);
  });
  document.addEventListener("keyup", ev => keys.delete(ev.key));
  // Tap / click gives a short lateral impulse (to the right for simplicity)
  canvas.addEventListener("mousedown", () => {
    // Apply a brief impulse to the right; magnitude could be randomized or based on click position
    player.vx += IMPULSE_STRENGTH;
    beep(440, 0.05);
  });
  document.getElementById("restart").addEventListener("click", reset);

  // === AUDIO (lazy) =======================================================
  let audioCtx = null;
  function beep(freq, durSec) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durSec);
    } catch (e) {
      // Silently ignore audio errors (e.g., user gesture not yet allowed)
    }
  }

  // === OBSERVABLE CONTRACT ===============================================
  function publishState() {
    const visible = player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height;
    window.__game = {
      state: phase,
      score: score,
      player: { x: player.x, y: player.y, visible },
      objective: "Steer the drifting dot through moving gaps.",
    };
  }

  // === BOOT ===============================================================
  reset();
  </script>
</body>
</html>
