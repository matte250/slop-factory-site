<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Phase Shift</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0a0a0f; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Phase Shift</h1>
    <p class="game-description">Tap to toggle the dot between two parallel temporal phases; obstacles exist only in one phase at a time, so switching lets you phase through them while a short cooldown prevents spamming.</p>
    <ul class="game-controls">
      <li>Tap / click to toggle phase</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    // Configurable constants
    const PLAYER_RADIUS = 6;
    const HAZARD_RADIUS = 12;
    const HAZARD_SPEED = 200; // px/sec
    const SPAWN_INTERVAL = 1.5; // seconds between spawns
    const SAFE_RADIUS = 150; // safe distance at start

    // === STATE =============================================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const restartBtn = document.getElementById('restart');

    let player = { x: canvas.width / 2, y: canvas.height / 2 };
    let score = 0;
    let phase = 'playing'; // "playing" | "gameover"
    let keys = new Set();
    let lastTime = performance.now();
    let loopId = null;
    let audioCtx = null;
    // Game entities and timers
    let hazards = [];
    let spawnTimer = SPAWN_INTERVAL;
    let scoreTimer = 0;

    // === RESET =============================================================
    function reset() {
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      score = 0;
      phase = 'playing';
      keys.clear();
      lastTime = performance.now();
      publishState();
      startLoop();
    }
    // === LOOP =============================================================
    // Main animation loop with cancel discipline; runs update, render, and publish each frame.
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          update(dt);
          render();
          publishState();
        } catch (e) {
          console.error('loop error', e);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    // === UPDATE =============================================================
    function update(dt) {
      // Placeholder: no game logic yet.
    }

    // === RENDER =============================================================
    function render() {
      // Clear canvas with background color
      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // Draw player dot
      ctx.fillStyle = '#7df9ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      // Draw HUD (score)
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '16px ui-sans-serif, system-ui';
      ctx.textAlign = 'left';
      ctx.fillText(`Score ${score}`, 12, 22);
    }

    // === INPUT =============================================================
    canvas.addEventListener('click', () => {
      // Placeholder for phase toggle.
    });
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
      keys.add(ev.key);
    });
    document.addEventListener('keyup', (ev) => { keys.delete(ev.key); });
    restartBtn.addEventListener('click', reset);

    // === AUDIO (lazy) =======================================================
    function beep(freq, durSec) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durSec);
      } catch (e) {
        // ignore audio errors
      }
    }

    // === OBSERVABLE CONTRACT ===============================================
    function publishState() {
      // Ensure the observer contract matches the required schema.
      const visible = player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height;
      window.__game = {
        state: phase, // "playing" | "gameover" ("menu" not used)
        score: score,
        player: {
          x: player.x,
          y: player.y,
          visible: visible,
        },
        objective: 'Toggle the dot between two temporal phases to avoid obstacles.',
      };
    }

    // === BOOT ===============================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          update(dt);
          render();
          publishState();
        } catch (e) {
          console.error('loop error', e);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }
    // Initialize game
    reset();
  </script>
</body>
</html>
