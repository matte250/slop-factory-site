<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vector Burst</title>
  <style>
    body {
      margin: 0;
      background: #0a0a0f;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }
    .game-header {
      padding: 0.5rem 1rem;
    }
    .game-header h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    .game-description {
      margin: 0.25rem 0 0.5rem;
      font-size: 0.9rem;
      color: #ccc;
    }
    .game-controls {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 0.8rem;
      color: #aaa;
    }
    canvas#game {
      display: block;
      background: #0a0a0f;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Vector Burst</h1>
    <p class="game-description">A rotating laser beam shoots outward from the center; tap to change its rotation speed and angle, timing bursts to carve safe corridors through incoming geometric walls.</p>
    <ul class="game-controls">
      <li>Tap / Click to change laser direction and speed</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
  </main>
  <script>
    (function(){
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const cx = width/2;
      const cy = height/2;
      let angle = 0;
      let speed = 0.02; // radians per frame

      // simple click to randomise speed and angle
      canvas.addEventListener('click',()=>{
        // random small change
        angle += (Math.random()-0.5)*Math.PI/2;
        speed = (Math.random()*0.04+0.01)*(Math.random()<0.5?-1:1);
      });

      function drawLaser(){
        const length = Math.max(width, height);
        ctx.strokeStyle = '#ff00aa'; // neon magenta
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle)*length, cy + Math.sin(angle)*length);
        ctx.stroke();
      }

      function draw(){
        // background
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0,0,width,height);
        // laser
        drawLaser();
        // optional simple wall: rotating rectangle
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle + Math.PI/4);
        ctx.fillStyle = '#7df9ff'; // cyan
        ctx.fillRect(-150, -5, 300, 10);
        ctx.restore();
      }

      function loop(){
        try {
          angle += speed;
          draw();
        } catch(e){
          console.error('Game loop error:', e);
        }
        requestAnimationFrame(loop);
      }
      // start immediately
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
