<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gravity Spin</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Gravity Spin</h1>
    <p class="game-description">Rotate gravity by tapping to make the dot cling to walls, dodge obstacles, and survive as long as possible.</p>
    <ul class="game-controls">
      <li>Tap to rotate gravity</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
// === CONFIG =============================================================
    const CANVAS_W = 800;
    const CANVAS_H = 600;

    // === STATE ==============================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restart");

    const PLAYER_SPEED = 200; // pixels per second
    const GRAVITY_COOLDOWN = 0.3; // seconds
    let gravityDir = 0; // 0=up,1=right,2=down,3=left
    let gravityCooldown = 0;
    let player = { x: CANVAS_W/2, y: CANVAS_H/2 };
    let hazards = []; // will hold obstacle objects
    let score = 0;
    let phase = "menu"; // "menu" | "playing" | "gameover"
    let keys = new Set();
    let lastTime = performance.now();
    let loopId = null;
    let audioCtx = null;

    // === RESET ==============================================================
    function reset() {
      // Initialize game state
      player = { x: CANVAS_W/2, y: CANVAS_H/2 };
      hazards = [];
      score = 0;
      phase = "playing";
      keys.clear();
      lastTime = performance.now();
      startLoop();
    }

    // === LOOP ==============================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          // Update and render
          update(dt);
          render();
          // Publish observable state each frame
          publishState();
        } catch (err) {
          console.error("loop error", err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    // === UPDATE ==============================================================
    function update(dt) {
      // Update gravity cooldown
      if (gravityCooldown > 0) gravityCooldown -= dt;
      // Move player according to gravity direction
      let vx = 0, vy = 0;
      if (gravityDir === 0) vy = -1;
      else if (gravityDir === 1) vx = 1;
      else if (gravityDir === 2) vy = 1;
      else if (gravityDir === 3) vx = -1;
      player.x += vx * PLAYER_SPEED * dt;
      player.y += vy * PLAYER_SPEED * dt;
      // Clamp player inside canvas
      player.x = Math.max(0, Math.min(CANVAS_W, player.x));
      player.y = Math.max(0, Math.min(CANVAS_H, player.y));
      // Simple scoring over time
      score = Math.floor(score + dt);
    }

    // === RENDER ==============================================================
    function render() {
      // Canvas already cleared in loop
      // Fill background
      ctx.fillStyle = "#001020";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // Draw neon border for visual cue
      ctx.strokeStyle = "#7df9ff";
      ctx.lineWidth = 2;
      ctx.strokeRect(0, 0, canvas.width, canvas.height);
      // Draw player
      ctx.fillStyle = "#ff52ae";
      ctx.beginPath();
      ctx.arc(player.x, player.y, 6, 0, Math.PI * 2);
      ctx.fill();

      // HUD
      ctx.fillStyle = "#e6e6f0";
      ctx.font = "16px ui-sans-serif, system-ui";
      ctx.textAlign = "left";
      ctx.fillText(`Score ${score}`, 12, 22);
    }

    // === INPUT ==============================================================
    document.addEventListener("keydown", (e) => {
      if (e.key === "r" || e.key === "R") {
        reset();
        return;
      }
      keys.add(e.key);
    });
    document.addEventListener("keyup", (e) => { keys.delete(e.key); });
    restartBtn.addEventListener("click", reset);
    canvas.addEventListener("click", () => {
      if (gravityCooldown <= 0) {
        gravityDir = (gravityDir + 1) % 4;
        gravityCooldown = GRAVITY_COOLDOWN;
        // play rotation sound
        beep(540, 0.05);
      }
    });

    // === AUDIO (lazy) =======================================================
    function beep(freq, durSec) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durSec);
      } catch (e) {}
    }
    // Helper audio triggers for game events
    function playHitSound() {
      // Short blip for hitting a hazard
      beep(220, 0.04);
    }
    function playScoreSound() {
      // Higher pitch for scoring
      beep(880, 0.05);
    }
    function playDeathSound() {
      // Low tone for game over
      beep(110, 0.25);
    }

    // === OBSERVABLE CONTRACT ================================================
    function publishState() {
      window.__game = {
        state: phase,
        score,
        player: { x: player.x, y: player.y, visible: true },
        objective: "Rotate gravity by tapping to cling to walls and dodge obstacles."
      };
    }

    // === BOOT ==============================================================
    reset();
  </script>
</body>
</html>
