<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gravity Axis</title>
<style>
body { margin:0; background:#0a0a0f; color:#e6e6f0; font-family:ui-sans-serif, system-ui, sans-serif; }
canvas { display:block; background:#0f1320; margin:0 auto; border:1px solid #2a2f44; }
.game-restart { display:block; margin:10px auto; padding:8px 14px; background:#1c2030; color:#7df9ff; border:1px solid #2a2f44; cursor:pointer; }
.game-restart:hover { background:#232842; }
.game-header { padding:12px 16px; border-bottom:1px solid #1d1d2a; }
.game-header h1 { margin:0; font-size:18px; color:#7df9ff; }
.game-header .game-description { margin:4px 0; color:#a5a5b8; }
.game-header .game-controls { margin:4px 0; padding-left:18px; color:#c8c8d8; }
</style>
</head>
<body>
<header class="game-header">
<h1>Gravity Axis</h1>
<p class="game-description">Tap rotates gravity 90° clockwise, causing the dot to fall toward the new side while the tunnel scrolls forward; time the rotations so the dot slips through gaps that appear on each wall.</p>
<ul class="game-controls">
<li>Tap / Click to rotate gravity</li>
<li>Press R or click Restart</li>
</ul>
</header>
<main>
<canvas id="game" width="800" height="600"></canvas>
<button id="restart" class="game-restart" type="button">Restart</button>
</main>
<script>
// === CONFIG =============================================================
const PLAYER_R = 8;
const PLAYER_SPEED = 300; // px per second
const GAP_SIZE = 120; // size of gap in wall
const WALL_THICKNESS = 20;
const SAFE_RADIUS = 150;
const SPAWN_INTERVAL = 1.5; // seconds between walls
const GRAVITY = [
  {dx: 0, dy: 1},   // down
  {dx: -1, dy: 0},  // left
  {dx: 0, dy: -1},  // up
  {dx: 1, dy: 0},   // right
];

// === STATE ==============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const restartBtn = document.getElementById('restart');

let player = {x: canvas.width/2, y: canvas.height/2};
let gravityIdx = 0; // current gravity direction index
let hazards = []; // each hazard: {dir, gapStart}
let spawnTimer = 0;
let score = 0;
let highScore = 0;
let phase = 'playing'; // 'playing' | 'gameover'
let keys = new Set();
let loopId = null;
let lastTime = performance.now();
let audioCtx = null;

// === RESET ==============================================================
function reset() {
  player = {x: canvas.width/2, y: canvas.height/2};
  gravityIdx = 0;
  hazards = [];
  spawnTimer = 0;
  score = 0;
  phase = 'playing';
  keys.clear();
  publishState();
  startLoop();
}

// === START LOOP ========================================================
function startLoop() {
  if (loopId !== null) cancelAnimationFrame(loopId);
  function tick(now) {
    try {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      update(dt);
      render();
    } catch (err) {
      console.error('loop error', err);
    }
    loopId = requestAnimationFrame(tick);
  }
  loopId = requestAnimationFrame(tick);
}

// === UPDATE =============================================================
function update(dt) {
  if (phase !== 'playing') return;

  // move player according to current gravity direction
  const g = GRAVITY[gravityIdx];
  player.x += g.dx * PLAYER_SPEED * dt;
  player.y += g.dy * PLAYER_SPEED * dt;

  // check collision with current wall
  checkWallCollision();

  // spawn new wall when timer expires
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnHazard();
    spawnTimer = SPAWN_INTERVAL;
  }
}

function checkWallCollision() {
  switch (gravityIdx) {
    case 0: // down
      if (player.y + PLAYER_R >= canvas.height) {
        handleWallCollision(player.x);
      }
      break;
    case 1: // left
      if (player.x - PLAYER_R <= 0) {
        handleWallCollision(player.y);
      }
      break;
    case 2: // up
      if (player.y - PLAYER_R <= 0) {
        handleWallCollision(player.x);
      }
      break;
    case 3: // right
      if (player.x + PLAYER_R >= canvas.width) {
        handleWallCollision(player.y);
      }
      break;
  }
}

function handleWallCollision(coord) {
  // find the wall (hazard) that matches the current gravity direction
  const hazard = hazards.find(h => h.dir === gravityIdx);
  if (!hazard) {
    // no wall defined – treat as game over for safety
    phase = 'gameover';
    if (score > highScore) highScore = score;
    beep(110, 0.25);
    return;
  }
  const gapStart = hazard.gapStart;
  const gapEnd = gapStart + GAP_SIZE;
  if (coord >= gapStart && coord <= gapEnd) {
    // successful pass through gap
    score++;
    beep(540, 0.05);
    // reposition player on opposite side
    switch (gravityIdx) {
      case 0: // down → appear at top
        player.y = -PLAYER_R;
        break;
      case 1: // left → appear at right
        player.x = canvas.width + PLAYER_R;
        break;
      case 2: // up → appear at bottom
        player.y = canvas.height + PLAYER_R;
        break;
      case 3: // right → appear at left
        player.x = -PLAYER_R;
        break;
    }
    // remove used hazard
    const idx = hazards.indexOf(hazard);
    if (idx !== -1) hazards.splice(idx, 1);
  } else {
    // collided with solid part of wall
    phase = 'gameover';
    if (score > highScore) highScore = score;
    beep(110, 0.25);
  }
}

function spawnHazard() {
  const dir = gravityIdx; // wall aligns with current gravity direction
  const axisLength = (dir % 2 === 0) ? canvas.width : canvas.height;
  const maxStart = axisLength - GAP_SIZE;
  const playerAxisCoord = (dir % 2 === 0) ? player.x : player.y;
  let gapStart;
  // ensure the gap is at least SAFE_RADIUS away from the player's current axis coordinate
  do {
    gapStart = Math.random() * maxStart;
  } while (Math.abs(gapStart + GAP_SIZE/2 - playerAxisCoord) < SAFE_RADIUS);
  hazards.push({dir, gapStart});
}

// === RENDER =============================================================
function render() {
  // clear background
  ctx.fillStyle = '#0f1320';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // draw walls (hazards) with gaps
  ctx.fillStyle = '#7df9ff';
  for (const h of hazards) {
    const gapStart = h.gapStart;
    const gapEnd = gapStart + GAP_SIZE;
    switch (h.dir) {
      case 0: // down wall at bottom
        ctx.fillRect(0, canvas.height - WALL_THICKNESS, gapStart, WALL_THICKNESS);
        ctx.fillRect(gapEnd, canvas.height - WALL_THICKNESS, canvas.width - gapEnd, WALL_THICKNESS);
        break;
      case 2: // up wall at top
        ctx.fillRect(0, 0, gapStart, WALL_THICKNESS);
        ctx.fillRect(gapEnd, 0, canvas.width - gapEnd, WALL_THICKNESS);
        break;
      case 1: // left wall
        ctx.fillRect(0, 0, WALL_THICKNESS, gapStart);
        ctx.fillRect(0, gapEnd, WALL_THICKNESS, canvas.height - gapEnd);
        break;
      case 3: // right wall
        ctx.fillRect(canvas.width - WALL_THICKNESS, 0, WALL_THICKNESS, gapStart);
        ctx.fillRect(canvas.width - WALL_THICKNESS, gapEnd, WALL_THICKNESS, canvas.height - gapEnd);
        break;
    }
  }

  // draw player dot
  ctx.fillStyle = '#ff52ae';
  ctx.beginPath();
  ctx.arc(player.x, player.y, PLAYER_R, 0, Math.PI * 2);
  ctx.fill();

  // HUD – score & high score
  ctx.fillStyle = '#e6e6f0';
  ctx.font = '16px ui-sans-serif, system-ui';
  ctx.textAlign = 'left';
  ctx.fillText(`Score ${score}`, 12, 22);
  ctx.textAlign = 'right';
  ctx.fillText(`Best ${highScore}`, canvas.width - 12, 22);

  // game‑over overlay
  if (phase === 'gameover') {
    ctx.fillStyle = 'rgba(10,10,15,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.font = '44px ui-sans-serif, system-ui';
    ctx.fillStyle = '#ff52ae';
    ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '20px ui-sans-serif, system-ui';
    ctx.fillStyle = '#e6e6f0';
    ctx.fillText(`Final score ${score}`, canvas.width / 2, canvas.height / 2 + 14);
    ctx.font = '16px ui-sans-serif, system-ui';
    ctx.fillStyle = '#a5a5b8';
    ctx.fillText('Press R or click Restart', canvas.width / 2, canvas.height / 2 + 42);
  }

  // publish observable state for the validator
  publishState();
}

// === INPUT ==============================================================
document.addEventListener('keydown', ev => {
  if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
  keys.add(ev.key);
});

document.addEventListener('keyup', ev => { keys.delete(ev.key); });

canvas.addEventListener('click', rotateGravity);
restartBtn.addEventListener('click', reset);

function rotateGravity() {
  gravityIdx = (gravityIdx + 1) % 4;
  beep(440, 0.08);
}

// === AUDIO (lazy) =======================================================
function beep(freq, durSec) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + durSec);
  } catch (e) {
    // silence errors – audio not critical
  }
}

// === OBSERVABLE CONTRACT ===============================================
function publishState() {
  window.__game = {
    state: phase === 'playing' ? 'playing' : 'gameover',
    score,
    player: {
      x: player.x,
      y: player.y,
      visible: player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height,
    },
    objective: 'Tap to rotate gravity and guide the dot through gaps that appear on each wall.',
  };
}

// === BOOT ===============================================================
reset();
</script>
</body>
</html>
