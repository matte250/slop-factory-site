<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Laser Cutter</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #05050c; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Laser Cutter</h1>
    <p class="game-description">Guide the autonomous dot forward, tapping to fire a laser that slices obstacles, clearing a lane. Timing and cooldown matter.</p>
    <ul class="game-controls">
      <li>Tap / click to fire laser</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const W = 800;
    const H = 600;
    const PLAYER_SPEED = 200; // px/sec

    // === STATE ==============================================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const restartBtn = document.getElementById('restart');

    let player = { x: W / 2, y: H / 2, angle: 0 };
    let hazards = []; // obstacles will be added later
    let score = 0;
    let phase = 'playing'; // 'playing' | 'gameover'
    let keys = new Set();
    let lastTime = performance.now();
    let loopId = null;
    let audioCtx = null;

    // === RESET ==============================================================
    function reset() {
      player = { x: W / 2, y: H / 2, angle: 0 };
      hazards = [];
      score = 0;
      phase = 'playing';
      keys.clear();
      lastTime = performance.now();
      startLoop();
    }

    // === LOOP ==============================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          update(dt);
          render();
          publishState();
        } catch (err) {
          console.error('loop error', err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    // === UPDATE =============================================================
    function update(dt) {
      if (phase !== 'playing') return;
      // Auto-advance player forward (angle = 0 points right)
      player.x += Math.cos(player.angle) * PLAYER_SPEED * dt;
      player.y += Math.sin(player.angle) * PLAYER_SPEED * dt;

      // Simple wrap-around
      if (player.x < 0) player.x += W;
      if (player.x >= W) player.x -= W;
      if (player.y < 0) player.y += H;
      if (player.y >= H) player.y -= H;

      // Fire laser on space or click (placeholder)
      if ((keys.has(' ') || keys.has('Space')) && phase === 'playing') {
        fire();
      }
    }

    // === RENDER =============================================================
function render() {
  // Clear canvas each frame
  ctx.clearRect(0, 0, W, H);
  // Draw player dot
  ctx.fillStyle = "#7df9ff";
  ctx.beginPath();
  ctx.arc(player.x, player.y, 8, 0, Math.PI * 2);
  ctx.fill();
  // Draw HUD
  ctx.fillStyle = "#e6e6f0";
  ctx.font = "16px ui-sans-serif, system-ui";
  ctx.textAlign = "left";
  ctx.fillText(`Score ${score}`, 12, 22);
}

    // === INPUT =============================================================
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
      keys.add(ev.key);
    });
    document.addEventListener('keyup', (ev) => { keys.delete(ev.key); });
    restartBtn.addEventListener('click', reset);

    // === AUDIO (lazy) ======================================================
    function beep(freq, durSec) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durSec);
      } catch {}
    }

    // === OBSERVABLE CONTRACT ================================================
    function publishState() {
      window.__game = {
        state: phase,
        score,
        player: {
          x: player.x,
          y: player.y,
          visible: player.x >= 0 && player.x < W && player.y >= 0 && player.y < H,
        },
        objective: 'Move forward and tap to fire laser; slice obstacles.',
      };
    }

    // === HELPER FUNCTIONS ==================================================
    function fire() {
      // Placeholder for laser logic
    }

    // === BOOT ==============================================================
    reset();
  </script>
</body>
</html>
