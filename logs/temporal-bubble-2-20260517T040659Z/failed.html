<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Temporal Bubble</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #05050c; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Temporal Bubble</h1>
    <p class="game-description">Tap creates a short-lived bubble around the dot that freezes all obstacles inside it for half a second, letting you slip through tight clusters; the bubble has a cooldown to prevent spamming.</p>
    <ul class="game-controls">
      <li>Tap or click to create bubble</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const W = 800, H = 600;
// === CONFIG CONT'D =============================================================
const PLAYER_THRUST = 300; // px/sec^2
const PLAYER_MAX_SPEED = 400; // px/sec
const PLAYER_FRICTION = 0.9; // per second decay factor
const HAZARD_SPEED_MIN = 100;
const HAZARD_SPEED_MAX = 200;
const HAZARD_RADIUS = 12;
const SAFE_RADIUS_AT_SPAWN = 150; // avoid spawning near player
    // === STATE ==============================================================
    let player = { x: W/2, y: H/2, vx: 0, vy: 0, radius: 12, alive: true };
    let hazards = []; // obstacles
    let score = 0;
    let phase = "playing"; // "playing" | "gameover"
    // === LOOP =============================================================
    let loopId = null;
    let lastTime = performance.now();
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
const restartBtn = document.getElementById('restart');
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          // Clear canvas each frame
          ctx.fillStyle = '#05050c';
          ctx.fillRect(0, 0, W, H);
          // TODO: add update and render calls later
        } catch (err) {
          console.error('loop error', err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }
    // Start loop immediately
    startLoop();
  </script>
</body>
</html>
