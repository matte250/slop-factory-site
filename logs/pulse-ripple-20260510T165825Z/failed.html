<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pulse Ripple</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Pulse Ripple</h1>
    <p class="game-description">The dot moves forward while a periodic wave expands from its tail; tapping emits a secondary ripple that temporarily reverses the wave direction, letting the dot slip through incoming barriers that sync with the wave phase.</p>
    <ul class="game-controls">
      <li>Tap (Space) to emit ripple</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const restartBtn = document.getElementById('restart');
    let keys = new Set();
    let loopId = null;
    let lastTime = performance.now();
    // Player movement constants
    const PLAYER_ACC = 800; // px/sec^2
    const PLAYER_MAX_SPEED = 400; // px/sec
    const PLAYER_FRICTION = 600; // px/sec^2
    // Hazard constants
    const HAZARD_SPEED = 200; // px/sec
    const HAZARD_SPAWN_INTERVAL = 2.0; // seconds
    const SAFE_RADIUS = 150; // avoid spawning near player start

    // === STATE ==============================================================
    // Game objects
    const player = { x: 400, y: 300, vx: 0, vy: 0 };
    const hazards = [];
    let hazardTimer = 0;
    let score = 0;
    let phase = 'playing'; // 'playing' | 'gameover'
    // expose for observable contract
    // note: publishState will map these

    function reset() {
      player.x = 400; player.y = 300;
      score = 0;
      phase = 'playing';
      publishState();
      startLoop();
    }

    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          update(dt);
          render();
          publishState();
        } catch (err) {
          console.error('loop error', err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    // === UPDATE =============================================================
    function update(dt) {
      if (phase !== 'playing') return;
      // Player movement based on arrow keys or WASD
      let ax = 0, ay = 0;
      if (keys.has('ArrowLeft') || keys.has('a') || keys.has('A')) ax -= 1;
      if (keys.has('ArrowRight') || keys.has('d') || keys.has('D')) ax += 1;
      if (keys.has('ArrowUp') || keys.has('w') || keys.has('W')) ay -= 1;
      if (keys.has('ArrowDown') || keys.has('s') || keys.has('S')) ay += 1;
      // normalize diagonal
      if (ax !== 0 && ay !== 0) { const norm = Math.hypot(ax, ay); ax /= norm; ay /= norm; }
      // apply acceleration
      player.vx += ax * PLAYER_ACC * dt;
      player.vy += ay * PLAYER_ACC * dt;
      // apply friction
      const speed = Math.hypot(player.vx, player.vy);
      if (speed > 0) {
        const dec = PLAYER_FRICTION * dt;
        if (dec >= speed) { player.vx = 0; player.vy = 0; } else { player.vx *= (1 - dec / speed); player.vy *= (1 - dec / speed); }
      }
      // clamp max speed
      const curSpeed = Math.hypot(player.vx, player.vy);
      if (curSpeed > PLAYER_MAX_SPEED) { const factor = PLAYER_MAX_SPEED / curSpeed; player.vx *= factor; player.vy *= factor; }
      // update position
      player.x += player.vx * dt;
      player.y += player.vy * dt;
      // keep within canvas bounds
      player.x = Math.min(Math.max(player.x, 0), canvas.width);
      player.y = Math.min(Math.max(player.y, 0), canvas.height);

      // Hazard spawning
      hazardTimer += dt;
      if (hazardTimer >= HAZARD_SPAWN_INTERVAL) {
        hazardTimer -= HAZARD_SPAWN_INTERVAL;
        // spawn at random edge
        const side = Math.floor(Math.random()*4);
        let hx, hy, hvx = 0, hvy = 0;
        if (side===0) { hx=0; hy=Math.random()*canvas.height; hvx=HAZARD_SPEED; }
        else if (side===1) { hx=canvas.width; hy=Math.random()*canvas.height; hvx=-HAZARD_SPEED; }
        else if (side===2) { hx=Math.random()*canvas.width; hy=0; hvy=HAZARD_SPEED; }
        else { hx=Math.random()*canvas.width; hy=canvas.height; hvy=-HAZARD_SPEED; }
        // avoid safe radius around player start (400,300)
        const dx = hx-400, dy = hy-300;
        if (Math.hypot(dx, dy) < SAFE_RADIUS) {
          // shift outward
          const angle = Math.atan2(dy, dx);
          hx = 400 + Math.cos(angle)*(SAFE_RADIUS+5);
          hy = 300 + Math.sin(angle)*(SAFE_RADIUS+5);
        }
        hazards.push({ x:hx, y:hy, vx:hvx, vy:hvy, radius:12, alive:true });
      }

      // Update hazards
      for (const h of hazards) {
        if (!h.alive) continue;
        h.x += h.vx * dt;
        h.y += h.vy * dt;
        // offscreen removal
        if (h.x < -50 || h.x > canvas.width+50 || h.y < -50 || h.y > canvas.height+50) h.alive = false;
        // collision with player
        const dx = h.x - player.x;
        const dy = h.y - player.y;
        if (Math.hypot(dx, dy) < h.radius + 8) {
          phase = 'gameover';
          h.alive = false;
        }
      }

      // Scoring: increase over time while playing
      score = Math.floor(score + dt * 10);
    }

    // === RENDER =============================================================
    function render() {
      // Clear background
      ctx.fillStyle = '#0f1320';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw hazards
      ctx.fillStyle = '#ff52ae'; // high‑contrast hazard color
      for (const h of hazards) {
        if (!h.alive) continue;
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw player dot
      ctx.fillStyle = '#7df9ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, 8, 0, Math.PI * 2);
      ctx.fill();

      // HUD
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '16px ui-sans-serif, system-ui';
      ctx.textAlign = 'left';
      ctx.fillText('Score ' + score, 12, 22);

      // Game‑over overlay
      if (phase !== 'playing') {
        ctx.fillStyle = 'rgba(10,10,15,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff52ae';
        ctx.textAlign = 'center';
        ctx.font = '44px ui-sans-serif, system-ui';
        ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 20);
        ctx.fillStyle = '#e6e6f0';
        ctx.font = '20px ui-sans-serif, system-ui';
        ctx.fillText('Final score ' + score, canvas.width/2, canvas.height/2 + 14);
        ctx.fillStyle = '#c8c8d8';
        ctx.font = '16px ui-sans-serif, system-ui';
        ctx.fillText('Press R or click Restart', canvas.width/2, canvas.height/2 + 42);
      }
    }

    // === INPUT ==============================================================
    document.addEventListener('keydown', ev => {
      if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
      if (ev.key === ' ') { /* emit ripple placeholder */ }
      keys.add(ev.key);
    });
    document.addEventListener('keyup', ev => keys.delete(ev.key));
    restartBtn.addEventListener('click', reset);

    // === OBSERVABLE CONTRACT ===============================================
    function publishState() {
      const visible = player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height;
      window.__game = {
        state: phase,
        score: score,
        player: { x: player.x, y: player.y, visible },
        objective: 'Emit ripples to navigate through barriers synced with the wave.'
      };
    }

    // === BOOT ===============================================================
    reset();
  </script>
</body>
</html>
