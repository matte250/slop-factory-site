<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Momentum Flip</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Momentum Flip</h1>
    <p class="game-description">Roll the dot, tap to flip direction and bounce between alternating walls.</p>
    <ul class="game-controls">
      <li>Tap / click to reverse direction</li>
      <li>Press R or click Restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
  // === STATE ==============================================================
  // Initial game state objects
  const player = { x: 400, y: 300, radius: 6, vx: 200, vy: 0 };
  const hazards = []; // will hold hazard objects
  let score = 0;
  let phase = "playing"; // "playing" | "gameover"
  // Game script will be added in later tasks.

  // === LOOP ==============================================================
  let loopId = null;
  let lastTime = performance.now();
  function startLoop() {
    if (loopId !== null) cancelAnimationFrame(loopId);
    function tick(now) {
      try {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        if (typeof update === 'function') update(dt);
        if (typeof render === 'function') render();
      if (typeof publishState === 'function') publishState();
      } catch (err) {
        console.error('loop error', err);
      }
      loopId = requestAnimationFrame(tick);
    }
    loopId = requestAnimationFrame(tick);
  }
  // Placeholder functions to avoid reference errors

  // === INPUT ==============================================================
  const keys = new Set();
  function reset() { console.log('reset called'); }
  document.addEventListener('keydown', (ev) => { if (ev.key === 'r' || ev.key === 'R') { reset(); return; } keys.add(ev.key); });
  document.addEventListener('keyup', (ev) => { keys.delete(ev.key); });
  const restartBtn = document.getElementById('restart');
  if (restartBtn) restartBtn.addEventListener('click', reset);

  // === AUDIO (lazy) =======================================================
  let audioCtx = null;
  function beep(freq, durSec) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durSec);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durSec);
    } catch (e) {
      // silent fail
    }
  }
  function update(dt) {
    if (phase !== "playing") return;

    // Simple horizontal movement based on arrow keys or A/D
    const accel = 400; // px/sec^2
    const maxSpeed = 300; // px/sec
    const friction = 300; // deceleration when no input
    let ax = 0;
    if (keys.has('ArrowLeft') || keys.has('a') || keys.has('A')) ax -= accel;
    if (keys.has('ArrowRight') || keys.has('d') || keys.has('D')) ax += accel;
    // Apply acceleration to velocity
    player.vx += ax * dt;
    // Apply friction when no horizontal input
    if (!keys.has('ArrowLeft') && !keys.has('a') && !keys.has('A') && !keys.has('ArrowRight') && !keys.has('d') && !keys.has('D')) {
      if (player.vx > 0) {
        player.vx = Math.max(0, player.vx - friction * dt);
      } else if (player.vx < 0) {
        player.vx = Math.min(0, player.vx + friction * dt);
      }
    }
    // Clamp speed
    player.vx = Math.max(-maxSpeed, Math.min(maxSpeed, player.vx));
    // Update position
    player.x += player.vx * dt;
    // Keep player within canvas bounds
    const canvas = document.getElementById('game');
    if (player.x < player.radius) player.x = player.radius;
    if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;

    // Hazard system
    const HAZARD_SPEED = 150;
    const SPAWN_INTERVAL = 2; // seconds
    const SAFE_RADIUS = 80;
    if (typeof spawnTimer === 'undefined') spawnTimer = 0;
    spawnTimer += dt;
    if (spawnTimer >= SPAWN_INTERVAL) {
      spawnTimer -= SPAWN_INTERVAL;
      // spawn at random x, top of canvas, ensure safe distance from player
      let hx = Math.random() * canvas.width;
      if (Math.abs(hx - player.x) < SAFE_RADIUS) {
        hx = (hx + SAFE_RADIUS) % canvas.width;
      }
      hazards.push({ x: hx, y: 0, vy: HAZARD_SPEED, radius: 6 });
    }
    // Update hazards
    for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        h.y += h.vy * dt;
        if (h.y > canvas.height + h.radius) hazards.splice(i, 1);
    }
    // Collision detection
    for (const h of hazards) {
        const dx = h.x - player.x;
        const dy = h.y - player.y;
        const distSq = dx * dx + dy * dy;
        const radSum = h.radius + player.radius;
        if (distSq < radSum * radSum) {
            phase = "gameover";
            break;
        }
    }
  }
    // (duplicate movement logic removed)
  function render() {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    // Clear canvas
    ctx.fillStyle = '#0f1320';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Draw hazards
    ctx.fillStyle = '#ff5555';
    for (const h of hazards) {
      ctx.beginPath();
      ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
      ctx.fill();
    }
    // Draw player (high contrast)
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();
    // HUD: score
    ctx.fillStyle = '#e6e6f0';
    ctx.font = '16px ui-sans-serif, system-ui';
    ctx.textAlign = 'left';
    ctx.fillText('Score ' + score, 12, 22);
    // If game over, overlay message
    if (phase === 'gameover') {
      ctx.fillStyle = 'rgba(10,10,15,0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff5555';
      ctx.textAlign = 'center';
      ctx.font = '44px ui-sans-serif, system-ui';
      ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 30);
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '20px ui-sans-serif, system-ui';
      ctx.fillText('Final score ' + score, canvas.width/2, canvas.height/2 + 4);
      ctx.fillText('Press R or click Restart', canvas.width/2, canvas.height/2 + 30);
    }
  }

  // === OBSERVABLE CONTRACT ===============================================
  function publishState() {
    const canvas = document.getElementById('game');
    const visible = player.x >= 0 && player.x <= canvas.width && player.y >= 0 && player.y <= canvas.height;
    window.__game = {
      state: phase === 'playing' ? 'playing' : 'gameover',
      score,
      player: { x: player.x, y: player.y, visible },
      objective: 'Flip direction to bounce between walls and avoid hazards.'
    };
