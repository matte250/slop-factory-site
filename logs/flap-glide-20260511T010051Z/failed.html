<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flap Glide</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #e6e6f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .game-header { padding: 12px 16px; border-bottom: 1px solid #1d1d2a; }
    .game-header h1 { margin: 0; font-size: 18px; color: #7df9ff; }
    .game-header .game-description { margin: 4px 0; color: #a5a5b8; }
    .game-header .game-controls { margin: 4px 0; padding-left: 18px; color: #c8c8d8; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { background: #0f1320; border: 1px solid #2a2f44; }
    .game-restart { margin-top: 10px; padding: 8px 14px; background: #1c2030; color: #7df9ff; border: 1px solid #2a2f44; cursor: pointer; }
    .game-restart:hover { background: #232842; }
  </style>
</head>
<body>
  <header class="game-header">
    <h1>Flap Glide</h1>
    <p class="game-description">The dot auto‑scrolls horizontally while a constant gravity pulls it down; each tap gives a short upward thrust, letting you steer through vertical gaps in a scrolling pipe.</p>
    <ul class="game-controls">
      <li>Tap or click to thrust upward</li>
      <li>Press R or click Restart to restart</li>
    </ul>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="restart" class="game-restart" type="button">Restart</button>
  </main>
  <script>
    // === CONFIG =============================================================
    const PLAYER_R = 6; // player dot radius in px
    const GRAVITY = 800; // px/s^2, downward acceleration
    const THRUST = -300; // impulse velocity change on tap (px/s)
    const PIPE_W = 80; // pipe width
    const PIPE_GAP = 200; // vertical gap size between pipe halves
    const PIPE_SPEED = 200; // scrolling speed in px/s

    // === STATE ==============================================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const restartBtn = document.getElementById('restart');

    let player = { x: 0, y: 0, vy: 0 }; // player position and vertical velocity
    let hazards = []; // array of pipe objects
    let score = 0;
    let phase = 'playing'; // 'playing' | 'lost' | 'won'
    let keys = new Set(); // active keys (e.g., space for thrust)
    let lastTime = performance.now();
    let loopId = null;
    let audioCtx = null;

    function reset() {
      // Initialize player in left side, vertically centered
      player.x = 100;
      player.y = canvas.height / 2;
      player.vy = 0;
      hazards = [];
      score = 0;
      phase = 'playing';
      keys = new Set();
      lastTime = performance.now();
    }

    // === LOOP =============================================================
    function startLoop() {
      if (loopId !== null) cancelAnimationFrame(loopId);
      function tick(now) {
        try {
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;
          update(dt);
          render();
        } catch (err) {
          console.error('loop error', err);
        }
        loopId = requestAnimationFrame(tick);
      }
      loopId = requestAnimationFrame(tick);
    }

    // === UPDATE =============================================================
    function update(dt) {
      if (phase !== 'playing') return;
      // Horizontal auto‑scroll
      player.x += PIPE_SPEED * dt;
      // Gravity
      player.vy += GRAVITY * dt;
      // Apply vertical motion
      player.y += player.vy * dt;
      // Clamp within canvas bounds
      player.x = clamp(player.x, 0, canvas.width);
      player.y = clamp(player.y, PLAYER_R, canvas.height - PLAYER_R);
    }

// === RENDER =============================================================
function render() {
  ctx.fillStyle = '#0f1320';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw player
  ctx.fillStyle = '#7df9ff';
  ctx.beginPath();
  ctx.arc(player.x, player.y, PLAYER_R, 0, Math.PI * 2);
  ctx.fill();

  // TODO: draw hazards, HUD (handled in previous tasks)

  // Game Over overlay
  if (phase === 'gameover' || phase === 'lost') {
    // Dim background
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Text settings
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    // Title
    ctx.font = '48px sans-serif';
    ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 30);
    // Score
    ctx.font = '24px sans-serif';
    ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
    // Instructions
    ctx.fillText('Press R or click Restart', canvas.width / 2, canvas.height / 2 + 50);
  }
}

    // === INPUT ==============================================================
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'r' || ev.key === 'R') { reset(); return; }
      keys.add(ev.key);
    });
    document.addEventListener('keyup', (ev) => { keys.delete(ev.key); });
    restartBtn.addEventListener('click', reset);

    // === HELPERS ============================================================
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

    // === BOOT ===============================================================
    reset();
    startLoop();
  </script>
</body>
</html>
